<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nightstand Clock V5 | Zmanim Ambient Clock</title>
<style>
  /* ----- GLOBAL RESET & DESIGN SYSTEM (modern base) ----- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }

  :root {
    --fg: #00e5ff;
    --bg: #000000;
    --transition-smooth: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    --card-radius: 28px;
    --btn-radius: 44px;
    --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.5);
    /* dynamic sizes */
    --weekday-scale: 1.2;
    --seconds-scale: 0.5;       /* default 1/2 size (new default) */
    --ampm-scale: 0.25;         /* base 1/4 size, can grow to match seconds */
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', 'SF Mono', 'Fira Code', monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: background 0.25s ease, color 0.2s ease;
  }

  /* gear icon */
  #gear {
    position: fixed;
    top: 22px;
    right: 24px;
    font-size: 28px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 60px;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
    transition: var(--transition-smooth);
    z-index: 200;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  }

  #gear:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.03) rotate(8deg);
    border-color: var(--fg);
  }

  .hidden-ui #gear {
    display: none;
  }

  /* main clock container */
  #clock {
    text-align: center;
    width: 90%;
    max-width: 1200px;
    transition: all 0.3s ease;
  }

  /* TIME LINE: container for time + vertical stack for AM/PM and Seconds */
  .time-line {
    display: flex;
    align-items: stretch; /* Forces the extras container to match main time height exactly */
    justify-content: center;
    gap: 0.15em;
  }
  .main-hour-minute {
    font-size: 1em;
    font-weight: inherit;
    line-height: 0.8; /* Crops font padding to match optical top/bottom of digits */
    display: block;
  }
  .time-extras {
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* Pins units to top and bottom */
    font-size: 0.35em; 
    text-align: left;
    margin: 0;
    padding: 0;
  }
  .ampm-indicator {
    opacity: 0.7;
    font-weight: 500;
    line-height: 0.7; /* Tight alignment to the top */
  }
  .seconds-sm {
    opacity: 0.85;
    font-weight: 400;
    line-height: 0.7; /* Tight alignment to the bottom */
  }
  .time-extras.hide-extras {
    display: none;
  }

  /* layout styles */

  /* weekday */
  .weekday {
    font-size: calc(2.2vw * var(--weekday-scale));
    font-weight: 500;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-transform: uppercase;
    transition: font-size 0.1s ease;
  }

  /* layout styles */
  .retro .time-line {
    font-size: 18vw;
  }
  .retro .main-hour-minute {
    font-weight: 700;
    text-shadow: 0 0 8px currentColor;
  }
  .simple .time-line {
    font-size: 14vw;
  }
  .simple .main-hour-minute {
    font-weight: 400;
  }
  .minimal .time-line {
    font-size: 12vw;
  }
  .minimal .main-hour-minute {
    font-weight: 300;
  }
  .split .time-line {
    font-size: 13vw;
  }
  .split .main-hour-minute {
    font-weight: 500;
    background: linear-gradient(135deg, var(--fg) 30%, #aaffff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: none;
  }
  
  .main-hour-minute {
    font-size: 1em;
  }

  .date {
    font-size: 2.8vw;
    margin-top: 18px;
    font-weight: 400;
    opacity: 0.85;
  }
  .weather {
    margin-top: 24px;
    font-size: 2.2vw;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(8px);
    display: inline-flex;
    align-items: center;
    padding: 10px 28px;
    border-radius: 60px;
    gap: 12px;
  }
  .weather-stack {
    display: flex;
    flex-direction: column;
    font-size: 0.7em;
    line-height: 1.1;
    text-align: left;
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
  }
  .weather-rain {
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
  }

  .next-zman {
    margin-top: 20px;
    font-size: 2.2vw;
    background: rgba(0, 150, 200, 0.2);
    backdrop-filter: blur(8px);
    display: inline-block;
    padding: 10px 28px;
    border-radius: 60px;
    font-weight: 500;
    letter-spacing: 0.3px;
    border: 1px solid rgba(0, 229, 255, 0.3);
    transition: all 0.2s;
    color: var(--zman-fg, var(--fg));
  }

  /* MODAL SCROLLABLE */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(12px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    animation: fadeInModal 0.2s ease;
  }

  .panel {
    background: #11141fcc;
    backdrop-filter: blur(24px);
    border-radius: 48px;
    padding: 28px 26px;
    width: 90%;
    max-width: 580px;
    max-height: 85vh;
    overflow-y: auto;
    color: #f0f3ff;
    border: 1px solid rgba(0, 230, 255, 0.3);
    box-shadow: var(--shadow-soft);
    font-family: 'Inter', system-ui, sans-serif;
    scrollbar-width: thin;
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-track { background: #1e2335; border-radius: 10px; }
  .panel::-webkit-scrollbar-thumb { background: var(--fg); border-radius: 10px; }

  .panel h2 {
    font-size: 1.8rem;
    font-weight: 500;
    margin-bottom: 20px;
    border-left: 4px solid var(--fg);
    padding-left: 16px;
  }

  label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #bbd4ff;
  }

  select, input[type="color"] {
    width: 100%;
    padding: 12px 16px;
    background: rgba(20, 25, 40, 0.9);
    border: 1px solid rgba(0, 229, 255, 0.4);
    border-radius: 60px;
    color: white;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: var(--transition-smooth);
  }

  .zmanim-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 12px;
    background: rgba(20, 25, 40, 0.5);
    border-radius: 28px;
    padding: 14px;
  }
  .zman-check {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .zman-check input {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: var(--fg);
  }
  .zman-check span {
    font-family: monospace;
    font-size: 0.9rem;
  }

  .button-group {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 28px;
    justify-content: space-between;
  }
  button {
    background: rgba(30, 35, 55, 0.9);
    border: 1px solid rgba(0, 229, 255, 0.3);
    padding: 12px 20px;
    border-radius: 60px;
    font-size: 0.9rem;
    font-weight: 500;
    color: #eef5ff;
    cursor: pointer;
    transition: var(--transition-smooth);
    flex: 1;
    text-align: center;
  }
  button:hover {
    background: #1f2a46;
    border-color: var(--fg);
    transform: translateY(-2px);
  }
  #save {
    background: #00b8d4cc;
    border-color: #00e5ff;
    font-weight: 600;
  }
  hr {
    margin: 20px 0;
    border-color: rgba(0, 229, 255, 0.3);
  }
  #advanced {
    display: none;
    animation: fadeSlide 0.2s;
  }
  /* TABS */
  .tabs {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    border-bottom: 1px solid rgba(0, 229, 255, 0.3);
    padding-bottom: 10px;
  }
  .tab {
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 12px;
    transition: var(--transition-smooth);
    font-size: 0.9rem;
    font-weight: 500;
    color: #bbd4ff;
  }
  .tab.active {
    background: rgba(0, 229, 255, 0.2);
    color: var(--fg);
    border: 1px solid rgba(0, 229, 255, 0.4);
  }
  .tab-content {
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .tab-content.active {
    display: block;
  }

  /* ALARMS */
  .alarm-item {
    background: rgba(20, 25, 40, 0.5);
    border-radius: 20px;
    padding: 16px;
    margin-top: 12px;
    border: 1px solid rgba(0, 229, 255, 0.1);
  }
  .alarm-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .alarm-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .alarm-input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .alarm-input-group input {
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 10px;
    color: white;
  }
  .remove-alarm {
    color: #ff3b30;
    cursor: pointer;
    font-size: 0.8rem;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* FLASHING BACKGROUND */
  @keyframes alarmFlash {
    0%, 49% { background: #000000; color: #ffffff; }
    50%, 100% { background: #ffffff; color: #000000; }
  }
  .alarm-active {
    animation: alarmFlash var(--flash-speed, 0.5s) infinite;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (max-width: 640px) {
    .date, .weather, .next-zman { font-size: 5vw; }
    .weekday { font-size: calc(4vw * var(--weekday-scale)); }
  }
</style>
</head>
<body>

<button id="gear" aria-label="settings">⚙️</button>

<div id="clock" class="retro">
  <div class="weekday" id="weekday"></div>
  <div class="time-line">
    <span class="main-hour-minute" id="mainTime"></span>
    <div class="time-extras">
      <span class="ampm-indicator" id="ampmIndicator"></span>
      <div class="time-spacer"></div>
      <span class="seconds-sm" id="secondsSmall"></span>
    </div>
  </div>
  <div class="date" id="date"></div>
  <div class="weather" id="weather">🌙 loading forecast...</div>
  <div class="next-zman" id="nextZman">🕯️ Next Zman: --</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="panel">
    <h2>✨ Ambient Control + Zmanim</h2>
    <label>🖌️ Layout Style</label>
    <select id="layout"><option value="retro">Retro LED</option><option value="simple">Simple & Clean</option><option value="minimal">Minimal pure</option><option value="split">Split Chroma</option></select>
    <label>🎨 Theme Color</label>
    <select id="colorPreset"><option value="#00e5ff">Retro Cyan</option><option value="#00ff66">Coding Green</option><option value="#ff3b30">Red Ember</option><option value="custom">Custom (picker)</option></select>
    <input type="color" id="customColor" value="#00e5ff">
    <label>🌑 Background</label>
    <select id="bgPreset"><option value="#000000">Pure Black</option><option value="#222222">Dark Graphite</option><option value="#001133">Deep Navy</option><option value="custom">Custom Color</option></select>
    <input type="color" id="customBg" value="#000000">

    <button id="advBtn" type="button">⚡ Advanced Display & Zmanim</button>
    <div id="advanced">
      <div class="tabs">
        <div class="tab active" data-tab="tab-zmanim">🕯️ Zmanim</div>
        <div class="tab" data-tab="tab-alarms">⏰ Alarms</div>
        <div class="tab" data-tab="tab-display">🖥️ Display</div>
      </div>

      <!-- Zmanim Tab -->
      <div id="tab-zmanim" class="tab-content active">
        <label>🕯️ Zmanim Selection (Hebrew names)</label>
        <div id="zmanimChecklist" class="zmanim-grid"></div>
        <label>⏳ Zman Display Type</label>
        <select id="zmanDisplayType"><option value="time">At time (10:30 PM)</option><option value="countdown">Countdown (in 2h 15m)</option></select>
        <label>🏷️ Show "Next Zman:" prefix</label>
        <select id="showNextZmanPrefix"><option value="true">Show</option><option value="false">Hide</option></select>
        <label>🎨 Zman Text Color</label>
        <select id="zmanColorPreset"><option value="theme">Same as theme</option><option value="custom">Custom Color</option></select>
        <input type="color" id="zmanCustomColor" value="#00e5ff">
      </div>

      <!-- Alarms Tab -->
      <div id="tab-alarms" class="tab-content">
        <div id="alarmList"></div>
        <button id="addAlarm" style="margin-top: 15px; background: rgba(0, 229, 255, 0.2);">➕ Add Alarm (max 10)</button>
      </div>

      <!-- Display Tab -->
      <div id="tab-display" class="tab-content">
        <label>📆 Weekday Text Size</label>
        <select id="weekdaySize"><option value="0.8">Small (0.8x)</option><option value="1.0">Normal (1x)</option><option value="1.2">Big (1.2x)</option><option value="1.5">Extra Large (1.5x)</option><option value="1.8">Huge (1.8x)</option></select>
        <label>⏲️ Time Extras (Seconds & AM/PM)</label>
        <select id="showTimeExtras"><option value="true">Show unit</option><option value="false">Hide unit</option></select>
        <label>🌤️ Weather format</label>
        <select id="weatherFmt">
          <option value="words">🌡️ 72°F · Clear sky</option>
          <option value="numbers">🌤️ 72°F</option>
          <option value="extended">📊 Extended (High/Low + Rain)</option>
        </select>
        <label>📅 Date format</label>
        <select id="dateFmt"><option value="long">Monday, June 1, 2026</option><option value="medium">Mon, Jun 1</option><option value="numeric">6/1/2026</option></select>
        <label>✍️ Clock font family</label>
        <select id="font"><option value="'Inter', 'SF Mono', monospace">Digital Mono</option><option value="'Segoe UI', 'Inter', sans-serif">Modern Sans</option><option value="'Cormorant Garamond', serif">Classic Serif</option></select>
      </div>
    </div>
    <div class="button-group">
      <button id="fullscreen">🖥️ Fullscreen</button>
      <button id="save">💾 Save & Close</button>
    </div>
  </div>
</div>

<script>
  // ---------- ZMANIM DATA: Hebrew names + API keys ----------
  const ZMANIM_DB = {
    alotHaShachar: { he: "עלות השחר", icon: "🌄", default: true, display: "Alot Hashachar" },
    sunrise: { he: "נץ החמה", icon: "🌅", default: true, display: "Netz" },
    misheyakir: { he: "משיכיר", icon: "👕", default: true, display: "Mi Sheyakir" },
    sofZmanShma: { he: "סוף ק\"ש (גר\"א)", icon: "📜", default: true, display: "Sof Zman Shma GRA" },
    sofZmanTfilla: { he: "סוף תפילה (גר\"א)", icon: "🙏", default: true, display: "Sof Zman Tfila" },
    chatzot: { he: "חצות", icon: "🕛", default: true, display: "Chatzot" },
    minchaGedola: { he: "מנחה גדולה", icon: "☀️", default: true, display: "Mincha Gedola" },
    sunset: { he: "שקיעה", icon: "🌇", default: true, display: "Shkiya" },
    tzeit85deg: { he: "צאת הכוכבים", icon: "🌌", default: true, display: "Tzeit" },
    plagHaMincha: { he: "פלג המנחה", icon: "🌤️", default: false, display: "Plag HaMincha" },
    candleLighting: { he: "הדלקת נרות", icon: "🕯️", default: false, display: "Candle Lighting" },
    sofZmanShmaMGA: { he: "סוף ק\"ש (מג\"א)", icon: "📜", default: false, display: "Sof Zman Shma MGA" }
  };

  let currentZmanimData = {};       // { key: Date object }
  let enabledZmanKeys = new Set();   // keys enabled by user
  let alarms = [];                   // { time: "HH:mm", enabled: bool, flashSpeed: sec, duration: sec }
  let activeAlarmTimeout = null;
  let nextZmanTimeout = null;

  // DOM elements
  const weekdayEl = document.getElementById('weekday');
  const mainTimeSpan = document.getElementById('mainTime');
  const secondsSmallSpan = document.getElementById('secondsSmall');
  const ampmSpan = document.getElementById('ampmIndicator');
  const dateEl = document.getElementById('date');
  const weatherEl = document.getElementById('weather');
  const nextZmanEl = document.getElementById('nextZman');
  const clockContainer = document.getElementById('clock');
  const gearBtn = document.getElementById('gear');
  const modal = document.getElementById('modal');
  const layoutSelect = document.getElementById('layout');
  const colorPreset = document.getElementById('colorPreset');
  const customColor = document.getElementById('customColor');
  const bgPreset = document.getElementById('bgPreset');
  const customBg = document.getElementById('customBg');
  const weatherFmtSelect = document.getElementById('weatherFmt');
  const dateFmtSelect = document.getElementById('dateFmt');
  const fontSelect = document.getElementById('font');
  const advBtn = document.getElementById('advBtn');
  const advancedDiv = document.getElementById('advanced');
  const fullscreenBtn = document.getElementById('fullscreen');
  const saveBtn = document.getElementById('save');
  const weekdaySizeSelect = document.getElementById('weekdaySize');
  const showTimeExtrasSelect = document.getElementById('showTimeExtras');
  const zmanDisplayTypeSelect = document.getElementById('zmanDisplayType');
  const showNextZmanPrefixSelect = document.getElementById('showNextZmanPrefix');
  const zmanColorPresetSelect = document.getElementById('zmanColorPreset');
  const zmanCustomColorInput = document.getElementById('zmanCustomColor');

  // Tabs Logic
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    });
  });

  // Alarm Logic
  function createAlarmUI() {
    const list = document.getElementById('alarmList');
    list.innerHTML = '';
    alarms.forEach((alarm, index) => {
      const item = document.createElement('div');
      item.className = 'alarm-item';
      item.innerHTML = `
        <div class="alarm-header">
          <strong>Alarm #${index + 1}</strong>
          <span class="remove-alarm" onclick="removeAlarm(${index})">🗑️ Remove</span>
        </div>
        <div class="alarm-grid">
          <div class="alarm-input-group">
            <label>Time</label>
            <input type="time" value="${alarm.time}" onchange="updateAlarm(${index}, 'time', this.value)">
          </div>
          <div class="alarm-input-group">
            <label>Enabled</label>
            <select onchange="updateAlarm(${index}, 'enabled', this.value === 'true')">
              <option value="true" ${alarm.enabled ? 'selected' : ''}>ON</option>
              <option value="false" ${!alarm.enabled ? 'selected' : ''}>OFF</option>
            </select>
          </div>
          <div class="alarm-input-group">
            <label>Flash Speed (sec)</label>
            <input type="number" step="0.1" min="0.1" value="${alarm.flashSpeed}" onchange="updateAlarm(${index}, 'flashSpeed', this.value)">
          </div>
          <div class="alarm-input-group">
            <label>Duration (sec)</label>
            <input type="number" min="1" value="${alarm.duration}" onchange="updateAlarm(${index}, 'duration', this.value)">
          </div>
        </div>
      `;
      list.appendChild(item);
    });
  }

  window.addAlarm = () => {
    if (alarms.length >= 10) return;
    alarms.push({ time: "08:00", enabled: true, flashSpeed: 0.5, duration: 30 });
    createAlarmUI();
  };

  window.removeAlarm = (index) => {
    alarms.splice(index, 1);
    createAlarmUI();
  };

  window.updateAlarm = (index, field, value) => {
    alarms[index][field] = value;
  };

  function checkAlarms() {
    const now = new Date();
    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    const seconds = now.getSeconds();
    
    // Only trigger at the start of the minute
    if (seconds !== 0) return;

    alarms.forEach(alarm => {
      if (alarm.enabled && alarm.time === timeStr) {
        triggerAlarm(alarm);
      }
    });
  }

  function triggerAlarm(alarm) {
    if (activeAlarmTimeout) clearTimeout(activeAlarmTimeout);
    
    document.body.style.setProperty('--flash-speed', `${alarm.flashSpeed}s`);
    document.body.classList.add('alarm-active');
    
    activeAlarmTimeout = setTimeout(() => {
      document.body.classList.remove('alarm-active');
      activeAlarmTimeout = null;
    }, alarm.duration * 1000);
  }

  document.getElementById('addAlarm').addEventListener('click', window.addAlarm);

  // Helper: load & apply advanced sizes + AM/PM dynamic scaling
  function applyAdvancedSizesAndAmpm() {
    let weekdayScale = parseFloat(localStorage.weekdaySize || "1.2");
    document.documentElement.style.setProperty('--weekday-scale', weekdayScale);
  }

  function applyThemeAndStyle() {
    let fgValue = (localStorage.colorPreset === 'custom') ? (localStorage.customColor || '#00e5ff') : (localStorage.colorPreset || '#00e5ff');
    let bgValue = (localStorage.bgPreset === 'custom') ? (localStorage.customBg || '#000000') : (localStorage.bgPreset || '#000000');
    document.documentElement.style.setProperty('--fg', fgValue);
    document.documentElement.style.setProperty('--bg', bgValue);
    
    // apply zman text color
    let zmanFg = (localStorage.zmanColorPreset === 'custom') ? (localStorage.zmanCustomColor || '#00e5ff') : fgValue;
    document.documentElement.style.setProperty('--zman-fg', zmanFg);

    const activeLayout = localStorage.layout || 'retro';
    clockContainer.className = activeLayout;
    const activeFont = localStorage.font || "'Inter', 'SF Mono', monospace";
    document.body.style.fontFamily = activeFont;
    applyAdvancedSizesAndAmpm();
    
    const showExtras = (localStorage.showTimeExtras !== 'false');
    const extrasPanel = document.querySelector('.time-extras');
    if (showExtras) extrasPanel.classList.remove('hide-extras');
    else extrasPanel.classList.add('hide-extras');
  }

  // update time/date + trigger next zman refresh
  function updateTimeAndDate() {
    const now = new Date();
    checkDailyRefresh(); // ensure we refresh on day change
    checkAlarms();       // check if any alarms should trigger
    const showSecondsGlobal = (localStorage.seconds || 'true') === 'true';
    let hours = now.getHours();
    const minutes = now.getMinutes();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    let displayHours = hours % 12;
    if (displayHours === 0) displayHours = 12;
    mainTimeSpan.textContent = `${displayHours}:${minutes.toString().padStart(2, '0')}`;
    const secondsVal = now.getSeconds().toString().padStart(2, '0');
    secondsSmallSpan.textContent = secondsVal;
    ampmSpan.textContent = ampm;
    
    weekdayEl.textContent = now.toLocaleDateString([], { weekday: 'long' }).toUpperCase();
    const dateFormat = localStorage.dateFmt || 'medium';
    let dateStr = '';
    if (dateFormat === 'numeric') dateStr = now.toLocaleDateString();
    else if (dateFormat === 'long') dateStr = now.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    else dateStr = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    dateEl.textContent = dateStr;
    updateNextZmanDisplay(); // refresh "Next Zman"
  }

  // Weather (same as original but keep)
  let lastTemperature = null, lastWeatherCode = 0, weatherConditionText = "Clear";
  let todayHigh = null, todayLow = null, rainInfo = "";

  function updateWeatherDisplay() {
    if (lastTemperature === null) { weatherEl.textContent = "⛅ waiting for weather..."; return; }
    const fmt = localStorage.weatherFmt || 'extended';
    const tempRounded = Math.round(lastTemperature);
    let icon = "☀️";
    if (lastWeatherCode >= 61 && lastWeatherCode <= 65) icon = "🌧️";
    else if (lastWeatherCode >= 71 && lastWeatherCode <= 75) icon = "❄️";
    else if (lastWeatherCode >= 95) icon = "⛈️";
    else if (lastWeatherCode >= 3 && lastWeatherCode <= 4) icon = "☁️";
    else icon = "☀️";

    if (fmt === 'numbers') {
      weatherEl.textContent = `${icon} ${tempRounded}°F`;
    } else if (fmt === 'words') {
      weatherEl.textContent = `${icon} ${tempRounded}°F · ${weatherConditionText}`;
    } else {
      // Extended format: Icon -> Current -> Description -> Stacked High/Low -> Rain
      const highLowHtml = `<div class="weather-stack"><span>High: ${Math.round(todayHigh)}°</span><span>Low: ${Math.round(todayLow)}°</span></div>`;
      const rainHtml = `<div class="weather-rain">${rainInfo}</div>`;
      weatherEl.innerHTML = `<span>${icon} ${tempRounded}°F</span> <span>${weatherConditionText}</span> ${highLowHtml} ${rainHtml}`;
    }
  }

  async function fetchWeather(lat, lon) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min&hourly=precipitation_probability,precipitation&temperature_unit=fahrenheit&timezone=auto`;
      const response = await fetch(url);
      const data = await response.json();
      
      if (data.current) {
        lastTemperature = data.current.temperature_2m;
        lastWeatherCode = data.current.weathercode;
        
        // High/Low
        if (data.daily) {
          todayHigh = data.daily.temperature_2m_max[0];
          todayLow = data.daily.temperature_2m_min[0];
        }

        // Rain Logic
        if (data.hourly) {
          const now = new Date();
          const currentHour = now.getHours();
          let rainStart = -1;
          let rainEnd = -1;
          let totalRainToday = false;

          for (let i = currentHour; i < 24; i++) {
            if (data.hourly.precipitation[i] > 0) {
              totalRainToday = true;
              if (rainStart === -1) rainStart = i;
              rainEnd = i;
            } else if (rainStart !== -1 && rainEnd !== -1) {
              // Found a gap after rain
              break;
            }
          }

          if (totalRainToday && rainStart !== -1) {
            const startStr = rainStart > 12 ? (rainStart - 12) + "pm" : (rainStart === 12 ? "12pm" : (rainStart === 0 ? "12am" : rainStart + "am"));
            const duration = rainEnd - rainStart + 1;
            rainInfo = `🌧️ Rain at ${startStr} (${duration}h)`;
          } else {
            rainInfo = "☀️ No rain today";
          }
        }

        const wCode = lastWeatherCode;
        if (wCode === 0) weatherConditionText = "Clear sky";
        else if (wCode === 1 || wCode === 2) weatherConditionText = "Mainly clear";
        else if (wCode === 3) weatherConditionText = "Overcast";
        else if (wCode >= 45 && wCode <= 48) weatherConditionText = "Foggy";
        else if (wCode >= 51 && wCode <= 55) weatherConditionText = "Drizzle";
        else if (wCode >= 61 && wCode <= 65) weatherConditionText = "Rain";
        else if (wCode >= 71 && wCode <= 75) weatherConditionText = "Snow";
        else if (wCode >= 80 && wCode <= 82) weatherConditionText = "Rain showers";
        else if (wCode >= 95) weatherConditionText = "Thunderstorm";
        else weatherConditionText = "Mild";
        
        updateWeatherDisplay();
      }
    } catch(e) { 
      console.error(e);
      weatherEl.textContent = "🌡️ offline · ambient mode"; 
      lastTemperature = null; 
    }
  }

  // ZMANIM API: fetch from hebcal
  async function fetchZmanim(lat, lon, specificDate = null) {
    try {
      const targetDate = specificDate || new Date();
      const yyyy = targetDate.getFullYear();
      const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
      const dd = String(targetDate.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;
      const tzid = Intl.DateTimeFormat().resolvedOptions().timeZone || "America/New_York";
      const url = `https://www.hebcal.com/zmanim?cfg=json&latitude=${lat}&longitude=${lon}&tzid=${tzid}&date=${dateStr}`;
      const resp = await fetch(url);
      const data = await resp.json();
      const times = data.times;
      if (!times) throw new Error("No zmanim data");
      const parsed = {};
      for (const [key, isoTime] of Object.entries(times)) {
        if (ZMANIM_DB[key]) {
          parsed[key] = new Date(isoTime);
        }
      }
      currentZmanimData = parsed;
      updateNextZmanDisplay();
    } catch (err) {
      console.warn("Zmanim fetch error", err);
      nextZmanEl.textContent = "⚠️ Zmanim unavailable";
    }
  }

  function formatCountdown(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    
    let parts = [];
    if (hours > 0) parts.push(`${hours}h`);
    if (minutes > 0 || hours > 0) parts.push(`${minutes}m`);
    parts.push(`${seconds}s`);
    return parts.join(" ");
  }

  function updateNextZmanDisplay() {
    if (!currentZmanimData || Object.keys(currentZmanimData).length === 0) {
      nextZmanEl.textContent = "📅 Loading Zmanim...";
      return;
    }
    const now = new Date();
    let upcoming = null;
    let upcomingKey = null;
    
    const sortedKeys = Object.keys(currentZmanimData).sort((a, b) => currentZmanimData[a] - currentZmanimData[b]);
    
    for (const key of sortedKeys) {
      if (!enabledZmanKeys.has(key)) continue;
      const zmanDate = currentZmanimData[key];
      if (zmanDate > now) {
        if (!upcoming || zmanDate < upcoming) {
          upcoming = zmanDate;
          upcomingKey = key;
        }
      }
    }

    if (upcomingKey && upcoming) {
      const meta = ZMANIM_DB[upcomingKey] || { he: upcomingKey, icon: "🕯️" };
      const displayType = localStorage.zmanDisplayType || 'time';
      const showPrefix = (localStorage.showNextZmanPrefix !== 'false');
      
      let prefix = showPrefix ? "Next Zman: " : "";
      let icon = meta.icon || "🕯️";
      let text = "";

      if (displayType === 'countdown') {
        const diff = upcoming - now;
        text = `${prefix}${meta.he} will be in ${formatCountdown(diff)}`;
      } else {
        const timeStr = upcoming.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        text = `${prefix}${meta.he} will be at ${timeStr}`;
      }
      nextZmanEl.innerHTML = `${icon} ${text}`;
    } else {
      const firstZman = currentZmanimData[sortedKeys[0]];
      if (firstZman && firstZman.getDate() === now.getDate()) {
        nextZmanEl.textContent = "🌙 Fetching tomorrow's Zmanim...";
        const tomorrow = new Date();
        tomorrow.setDate(now.getDate() + 1);
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => fetchZmanim(pos.coords.latitude, pos.coords.longitude, tomorrow));
        } else {
          fetchZmanim(40.7128, -74.0060, tomorrow);
        }
      } else {
        nextZmanEl.textContent = "🌟 No more Zmanim today · Check tomorrow";
      }
    }
  }

  let lastFetchedDate = "";
  function initGeolocationAndZmanim() {
    const now = new Date();
    const dateStr = now.toDateString();
    lastFetchedDate = dateStr;

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => { 
          fetchZmanim(pos.coords.latitude, pos.coords.longitude); 
          fetchWeather(pos.coords.latitude, pos.coords.longitude); 
        },
        () => { 
          fetchZmanim(40.7128, -74.0060); 
          fetchWeather(40.7128, -74.0060); 
        }
      );
    } else {
      fetchZmanim(40.7128, -74.0060);
      fetchWeather(40.7128, -74.0060);
    }
  }

  function checkDailyRefresh() {
    const now = new Date();
    if (now.toDateString() !== lastFetchedDate) {
      console.log("New day detected, refreshing zmanim...");
      initGeolocationAndZmanim();
    }
  }

  // Build dynamic checklist of Zmanim (hebrew)
  function buildZmanimChecklist() {
    const container = document.getElementById('zmanimChecklist');
    if (!container) return;
    container.innerHTML = '';
    for (const [key, meta] of Object.entries(ZMANIM_DB)) {
      const isChecked = enabledZmanKeys.has(key);
      const div = document.createElement('label');
      div.className = 'zman-check';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = key;
      cb.checked = isChecked;
      cb.addEventListener('change', (e) => {
        if (e.target.checked) enabledZmanKeys.add(key);
        else enabledZmanKeys.delete(key);
        localStorage.setItem('enabledZmanim', JSON.stringify([...enabledZmanKeys]));
        updateNextZmanDisplay();
      });
      const span = document.createElement('span');
      span.innerText = `${meta.he} (${meta.display})`;
      div.appendChild(cb);
      div.appendChild(span);
      container.appendChild(div);
    }
  }

  function loadEnabledZmanimFromStorage() {
    const stored = localStorage.getItem('enabledZmanim');
    if (stored) {
      const arr = JSON.parse(stored);
      enabledZmanKeys.clear();
      arr.forEach(k => { if (ZMANIM_DB[k]) enabledZmanKeys.add(k); });
    } else {
      // default: all keys where default:true
      enabledZmanKeys.clear();
      for (const [key, meta] of Object.entries(ZMANIM_DB)) if (meta.default) enabledZmanKeys.add(key);
    }
    if (enabledZmanKeys.size === 0) {
      // fallback basic
      for (const [key, meta] of Object.entries(ZMANIM_DB)) if (meta.default) enabledZmanKeys.add(key);
    }
    buildZmanimChecklist();
  }

  // Save all
  function saveAndClose() {
    localStorage.layout = layoutSelect.value;
    localStorage.weatherFmt = weatherFmtSelect.value;
    localStorage.dateFmt = dateFmtSelect.value;
    localStorage.font = fontSelect.value;
    localStorage.colorPreset = colorPreset.value;
    localStorage.customColor = customColor.value;
    localStorage.bgPreset = bgPreset.value;
    localStorage.customBg = customBg.value;
    localStorage.weekdaySize = weekdaySizeSelect.value;
    localStorage.showTimeExtras = showTimeExtrasSelect.value;
    localStorage.zmanDisplayType = zmanDisplayTypeSelect.value;
    localStorage.showNextZmanPrefix = showNextZmanPrefixSelect.value;
    localStorage.zmanColorPreset = zmanColorPresetSelect.value;
    localStorage.zmanCustomColor = zmanCustomColorInput.value;
    // zmanim enabled set already updated via checkboxes
    localStorage.setItem('enabledZmanim', JSON.stringify([...enabledZmanKeys]));
    localStorage.setItem('alarms', JSON.stringify(alarms));
    applyThemeAndStyle();
    updateTimeAndDate();
    if (lastTemperature !== null) updateWeatherDisplay();
    updateNextZmanDisplay();
    modal.style.display = 'none';
  }

  function openModalWithCurrentSettings() {
    layoutSelect.value = localStorage.layout || 'retro';
    weatherFmtSelect.value = localStorage.weatherFmt || 'extended';

    dateFmtSelect.value = localStorage.dateFmt || 'medium';
    fontSelect.value = localStorage.font || "'Inter', 'SF Mono', monospace";
    colorPreset.value = localStorage.colorPreset || '#00e5ff';
    customColor.value = localStorage.customColor || '#00e5ff';
    bgPreset.value = localStorage.bgPreset || '#000000';
    customBg.value = localStorage.customBg || '#000000';
    weekdaySizeSelect.value = localStorage.weekdaySize || '1.2';
    showTimeExtrasSelect.value = localStorage.showTimeExtras || 'true';
    zmanDisplayTypeSelect.value = localStorage.zmanDisplayType || 'time';
    showNextZmanPrefixSelect.value = localStorage.showNextZmanPrefix || 'true';
    zmanColorPresetSelect.value = localStorage.zmanColorPreset || 'theme';
    zmanCustomColorInput.value = localStorage.zmanCustomColor || '#00e5ff';
    
    const storedAlarms = localStorage.getItem('alarms');
    if (storedAlarms) alarms = JSON.parse(storedAlarms);
    createAlarmUI();

    loadEnabledZmanimFromStorage(); // rebuilds checklist and syncs enabledZmanKeys
    modal.style.display = 'flex';
  }

  function livePreviewAdvanced() {
    if (modal.style.display !== 'flex') return;
    
    localStorage.weekdaySize = weekdaySizeSelect.value;
    localStorage.showTimeExtras = showTimeExtrasSelect.value;
    localStorage.zmanDisplayType = zmanDisplayTypeSelect.value;
    localStorage.showNextZmanPrefix = showNextZmanPrefixSelect.value;
    localStorage.zmanColorPreset = zmanColorPresetSelect.value;
    localStorage.zmanCustomColor = zmanCustomColorInput.value;
    localStorage.layout = layoutSelect.value;
    localStorage.weatherFmt = weatherFmtSelect.value;
    localStorage.font = fontSelect.value;
    
    applyThemeAndStyle();
    updateNextZmanDisplay();
    updateWeatherDisplay();
  }

  function toggleAdvanced() {
    if (advancedDiv.style.display === 'none' || advancedDiv.style.display === '') {
      advancedDiv.style.display = 'block';
      advBtn.textContent = '▲ Hide advanced';
    } else {
      advancedDiv.style.display = 'none';
      advBtn.textContent = '⚡ Advanced settings';
    }
  }
  async function toggleFullscreen() {
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); } catch(e) {}
  }

  function initializeApp() {
    if (!localStorage.layout) localStorage.setItem('layout', 'retro');
    if (!localStorage.weatherFmt) localStorage.setItem('weatherFmt', 'extended');
    if (!localStorage.dateFmt) localStorage.setItem('dateFmt', 'medium');
    if (!localStorage.font) localStorage.setItem('font', "'Inter', 'SF Mono', monospace");
    if (!localStorage.colorPreset) localStorage.setItem('colorPreset', '#00e5ff');
    if (!localStorage.customColor) localStorage.setItem('customColor', '#00e5ff');
    if (!localStorage.bgPreset) localStorage.setItem('bgPreset', '#000000');
    if (!localStorage.customBg) localStorage.setItem('customBg', '#000000');
    if (!localStorage.weekdaySize) localStorage.setItem('weekdaySize', '1.2');
    if (!localStorage.showTimeExtras) localStorage.setItem('showTimeExtras', 'true');
    if (!localStorage.zmanDisplayType) localStorage.setItem('zmanDisplayType', 'time');
    if (!localStorage.showNextZmanPrefix) localStorage.setItem('showNextZmanPrefix', 'true');
    if (!localStorage.zmanColorPreset) localStorage.setItem('zmanColorPreset', 'theme');
    if (!localStorage.zmanCustomColor) localStorage.setItem('zmanCustomColor', '#00e5ff');
    
    const storedAlarms = localStorage.getItem('alarms');
    if (storedAlarms) alarms = JSON.parse(storedAlarms);

    loadEnabledZmanimFromStorage();
    applyThemeAndStyle();
    updateTimeAndDate();
    setInterval(() => updateTimeAndDate(), 1000);
    setInterval(() => { if (navigator.geolocation) navigator.geolocation.getCurrentPosition((pos) => fetchZmanim(pos.coords.latitude, pos.coords.longitude), () => fetchZmanim(40.7128, -74.0060)); }, 30*60000);
    initGeolocationAndZmanim();
  }

  gearBtn.addEventListener('click', openModalWithCurrentSettings);
  saveBtn.addEventListener('click', saveAndClose);
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  advBtn.addEventListener('click', toggleAdvanced);
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
  document.body.addEventListener('click', (e) => {
    const isModalOpen = modal.style.display === 'flex';
    const insidePanel = e.target.closest('.panel');
    const isGear = e.target.id === 'gear' || e.target.closest('#gear');
    if (isModalOpen) return;
    if (insidePanel || isGear) return;
    document.body.classList.toggle('hidden-ui');
  });
  weekdaySizeSelect.addEventListener('change', livePreviewAdvanced);
  showTimeExtrasSelect.addEventListener('change', livePreviewAdvanced);
  zmanDisplayTypeSelect.addEventListener('change', livePreviewAdvanced);
  showNextZmanPrefixSelect.addEventListener('change', livePreviewAdvanced);
  zmanColorPresetSelect.addEventListener('change', livePreviewAdvanced);
  zmanCustomColorInput.addEventListener('input', livePreviewAdvanced);
  fontSelect.addEventListener('change', livePreviewAdvanced);
  layoutSelect.addEventListener('change', livePreviewAdvanced);
  weatherFmtSelect.addEventListener('change', livePreviewAdvanced);
  initializeApp();
</script>
