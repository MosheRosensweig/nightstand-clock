<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nightstand Clock V5 | Zmanim Ambient Clock</title>
<!-- Load @hebcal/core for local zmanim calculation (prevents rate limiting) -->
<script src="https://cdn.jsdelivr.net/npm/@hebcal/core@latest/dist/bundle.min.js"></script>
<style>
  /* ----- GLOBAL RESET & DESIGN SYSTEM ----- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }

  :root {
    --fg: #00e5ff;
    --bg: #000000;
    --transition-smooth: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    --card-radius: 28px;
    --btn-radius: 44px;
    --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.5);
    /* dynamic sizes */
    --weekday-scale: 1.2;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', 'SF Mono', 'Fira Code', monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: background 0.25s ease, color 0.2s ease;
    padding: 0;
  }

  /* gear icon */
  #gear {
    position: fixed;
    top: 22px;
    right: 24px;
    font-size: 28px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 60px;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
    transition: var(--transition-smooth);
    z-index: 200;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  }

  #gear:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.03) rotate(8deg);
    border-color: var(--fg);
  }

  .hidden-ui #gear {
    display: none;
  }

  /* main clock container */
  #clock {
    text-align: center;
    width: 100%;
    height: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2vh;
    box-sizing: border-box;
  }

  /* TIME LINE */
  .time-line {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 0.15em;
  }
  .main-hour-minute {
    font-size: 1em;
    font-weight: inherit;
    line-height: 0.8;
    display: block;
  }
  .time-extras {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.35em; 
    text-align: left;
    margin: 0;
    padding: 0;
  }
  .ampm-indicator {
    opacity: 1;
    font-weight: 500;
    line-height: 0.7;
  }
  .seconds-sm {
    opacity: 1;
    font-weight: 400;
    line-height: 0.7;
  }
  .time-extras.hide-extras {
    display: none;
  }

  .weekday {
    font-size: calc(2.2vw * var(--weekday-scale));
    font-weight: 500;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-transform: uppercase;
    transition: font-size 0.1s ease;
  }

  /* Layout styles */
  .retro .time-line { font-size: 18vw; }
  .retro .main-hour-minute, .retro .time-extras, .retro .date, .retro .weekday { font-weight: 700; text-shadow: 0 0 8px currentColor; }
  .simple .time-line { font-size: 14vw; }
  .simple .main-hour-minute { font-weight: 400; }
  .minimal .time-line { font-size: 12vw; }
  .minimal .main-hour-minute { font-weight: 300; }
  .split .time-line { font-size: 13vw; }
  .split .main-hour-minute, .split .time-extras, .split .date, .split .weekday {
    font-weight: 500;
    background: linear-gradient(135deg, var(--fg) 30%, #aaffff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: none;
  }
  
  /* Sidebar Hub Layout */
  .sidebar#clock {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: 1fr 0 auto 0 1fr;
    grid-template-areas: 
      ". . ."
      ". weekday ."
      "weather timeline zmanim"
      ". date ."
      "hourly hourly hourly";
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 0;
    margin: 0;
    gap: 0;
  }
  .sidebar .weekday { grid-area: weekday; transform: translateY(-3vh); font-size: min(4vw, 5vh); justify-self: center; line-height: 0; }
  .sidebar .time-line { 
    grid-area: timeline; 
    font-size: min(15vw, 25vh); 
    justify-self: center; 
    display: flex;
    position: relative;
    align-items: center;
  }
  .sidebar .main-hour-minute { line-height: 0.8; }
  .sidebar .time-extras {
    position: absolute;
    left: 100%;
    margin-left: 0.1em;
    height: 70%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.35em;
  }
  .sidebar #date { grid-area: date; transform: translateY(3vh); font-size: min(3.5vw, 4vh); justify-self: center; line-height: 0; }
  .sidebar #weather { 
    grid-area: weather; 
    justify-self: end; 
    margin-right: 3vw;
    flex-direction: column; 
    align-items: center; 
    background: rgba(255,255,255,0.05); 
    padding: 3vh 2vw; 
    border-radius: 32px;
    font-size: min(2.5vw, 3.5vh);
    gap: 12px;
    height: auto;
    justify-content: center;
    max-width: 25vw;
  }
  .sidebar #nextZman { 
    grid-area: zmanim; 
    justify-self: start; 
    margin-left: 3vw;
    display: flex;
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    background: rgba(255,255,255,0.05); 
    padding: 3vh 2vw; 
    border-radius: 32px;
    font-size: min(2.5vw, 3.5vh);
    gap: 10px;
    height: auto;
    border: none;
    text-align: center;
    max-width: 25vw;
  }
  .sidebar .weather-timeline { 
    grid-area: hourly; 
    position: absolute; 
    bottom: 2vh; 
    left: 2vw; 
    right: 2vw; 
    width: auto; 
    margin: 0;
  }
  .sidebar .weather-stack { border-left: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 8px 0 0 0; margin: 0; align-items: center; width: 100%; }
  .sidebar .weather-rain { border-left: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 8px 0 0 0; margin: 0; width: 100%; text-align: center; }

  /* Phone View Layout */
  .phone#clock {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: auto auto auto auto;
    grid-template-areas: 
      "weekday weekday weekday"
      "weather timeline zmanim"
      "date date date"
      "hourly hourly hourly";
    align-items: center;
    justify-items: center;
    width: 100vw;
    height: 100vh;
    padding: 2vh;
    gap: 15px;
  }
  .phone .weekday { grid-area: weekday; font-size: min(5vw, 4vh); margin-bottom: 0; }
  .phone .time-line { grid-area: timeline; font-size: min(18vw, 15vh); position: relative; }
  .phone .main-hour-minute { line-height: 1; }
  .phone .time-extras {
    position: absolute;
    left: 100%;
    margin-left: 0.2em;
    height: 80%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.3em;
  }
  .phone #date { grid-area: date; font-size: min(4vw, 3vh); margin-top: 0; }
  .phone #weather { 
    grid-area: weather; 
    flex-direction: column; 
    background: rgba(255,255,255,0.05); 
    padding: 10px; 
    border-radius: 20px; 
    font-size: min(3vw, 2.5vh);
    max-width: 28vw;
    width: 100%;
    gap: 5px;
  }
  .phone #nextZman { 
    grid-area: zmanim; 
    flex-direction: column; 
    background: rgba(255,255,255,0.05); 
    padding: 10px; 
    border-radius: 20px; 
    font-size: min(3vw, 2.5vh);
    max-width: 28vw;
    width: 100%;
    gap: 5px;
    border: none;
    text-align: left;
    align-items: flex-start;
  }
  .phone .weather-timeline { grid-area: hourly; display: block; margin: 0; width: 100%; }
  .phone .weather-stack { border: none; padding: 0; margin: 0; }
  .phone .weather-rain { border: none; padding: 0; margin: 0; font-size: 0.8em; }

  /* Theme filter for icons */
  .theme-icon-filter {
    filter: grayscale(100%) brightness(1.5) sepia(1) hue-rotate(170deg) saturate(10);
  }

  @media (max-width: 640px) {
    .sidebar#clock {
      grid-template-columns: 1fr 1fr;
      grid-template-areas: 
        "weekday weekday"
        "timeline timeline"
        "date date"
        "weather zmanim"
        "hourly hourly";
      font-size: 3.5vw;
      gap: 10px;
    }
    .sidebar #weather, .sidebar #nextZman { font-size: 3.8vw; padding: 15px; height: auto; }
    .sidebar .time-line { font-size: 18vw; margin: 0; }
  }
  
  .date {
    font-size: 2.8vw;
    margin-top: 18px;
    font-weight: 400;
  }
  .weather {
    margin-top: 24px;
    font-size: 2.2vw;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(8px);
    display: inline-flex;
    align-items: center;
    padding: 10px 28px;
    border-radius: 60px;
    gap: 12px;
    color: var(--weather-fg, var(--fg));
  }
  .weather-stack {
    display: flex;
    flex-direction: column;
    font-size: 0.7em;
    line-height: 1.1;
    text-align: left;
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
  }
  .weather-rain {
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
  }

  .next-zman {
    margin-top: 20px;
    font-size: 2.2vw;
    background: rgba(0, 150, 200, 0.2);
    backdrop-filter: blur(8px);
    display: inline-block;
    padding: 10px 28px;
    border-radius: 60px;
    font-weight: 500;
    letter-spacing: 0.3px;
    border: 1px solid rgba(0, 229, 255, 0.3);
    transition: all 0.2s;
    color: var(--zman-fg, var(--fg));
  }

  /* MODAL */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(12px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .panel {
    background: #11141fcc;
    backdrop-filter: blur(24px);
    border-radius: 48px;
    padding: 28px 26px;
    width: 90%;
    max-width: 580px;
    max-height: 85vh;
    overflow-y: auto;
    color: #f0f3ff;
    border: 1px solid rgba(0, 230, 255, 0.3);
    box-shadow: var(--shadow-soft);
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-track { background: #1e2335; border-radius: 10px; }
  .panel::-webkit-scrollbar-thumb { background: var(--fg); border-radius: 10px; }

  .panel h2 { font-size: 1.8rem; font-weight: 500; margin-bottom: 20px; border-left: 4px solid var(--fg); padding-left: 16px; }

  label { display: block; margin-top: 18px; margin-bottom: 8px; font-weight: 500; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #bbd4ff; }

  select, input[type="color"] { width: 100%; padding: 12px 16px; background: rgba(20, 25, 40, 0.9); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 60px; color: white; cursor: pointer; transition: var(--transition-smooth); }

  .zmanim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; background: rgba(20, 25, 40, 0.5); border-radius: 28px; padding: 14px; }
  .zman-check { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 0.9rem; }
  .zman-check input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--fg); }

  .button-group { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; justify-content: space-between; }
  button { background: rgba(30, 35, 55, 0.9); border: 1px solid rgba(0, 229, 255, 0.3); padding: 12px 20px; border-radius: 60px; font-size: 0.9rem; font-weight: 500; color: #eef5ff; cursor: pointer; transition: var(--transition-smooth); flex: 1; text-align: center; }
  button:hover { background: #1f2a46; border-color: var(--fg); transform: translateY(-2px); }
  #save { background: #00b8d4cc; border-color: #00e5ff; font-weight: 600; }

  #advanced { display: none; }
  .tabs { display: flex; gap: 10px; margin-top: 20px; border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; }
  .tab { padding: 8px 16px; cursor: pointer; border-radius: 12px; transition: var(--transition-smooth); font-size: 0.9rem; font-weight: 500; color: #bbd4ff; }
  .tab.active { background: rgba(0, 229, 255, 0.2); color: var(--fg); border: 1px solid rgba(0, 229, 255, 0.4); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* WEATHER TIMELINE BAR */
  .weather-timeline {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    display: none;
    padding: 15px 0;
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .weather-timeline::-webkit-scrollbar { display: none; }
  .weather-timeline-inner { display: flex; gap: 20px; padding: 0 20px; width: max-content; }
  .timeline-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.9rem; min-width: 60px; }
  .timeline-time { opacity: 0.6; font-size: 0.75rem; }
  .timeline-temp { font-weight: 600; }
  .timeline-icon { font-size: 1.2rem; }
  .night-moon { filter: grayscale(100%) brightness(1000%); display: inline-block; }

  /* ALARMS */
  .alarm-item { background: rgba(20, 25, 40, 0.5); border-radius: 20px; padding: 16px; margin-top: 12px; border: 1px solid rgba(0, 229, 255, 0.1); }
  .alarm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .alarm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .alarm-input-group { display: flex; flex-direction: column; gap: 4px; }
  .alarm-input-group input { padding: 8px 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 10px; color: white; }
  .remove-alarm { color: #ff3b30; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; font-weight: 600; }

  @keyframes alarmFlash { 0%, 49% { background: #000000; color: #ffffff; } 50%, 100% { background: #ffffff; color: #000000; } }
  .alarm-active { animation: alarmFlash var(--flash-speed, 0.5s) infinite; }

  @media (max-width: 640px) {
    .date { font-size: 6vw; }
    .weather { font-size: 4vw; padding: 1vh 4vw; margin-top: 2vh; }
    .next-zman { font-size: 4vw; padding: 1vh 4vw; margin-top: 2vh; }
    .weekday { font-size: calc(6vw * var(--weekday-scale)); margin-bottom: 2vh; }
    .retro .time-line { font-size: 22vw; }
    .simple .time-line { font-size: 18vw; }
    .minimal .time-line { font-size: 14vw; }
    .split .time-line { font-size: 16vw; }
  }
</style>
</head>
<body>

<button id="gear" aria-label="settings">⚙️</button>

<div id="clock" class="sidebar">
  <div class="weekday" id="weekday"></div>
  <div class="time-line">
    <span class="main-hour-minute" id="mainTime"></span>
    <div class="time-extras">
      <span class="ampm-indicator" id="ampmIndicator"></span>
      <div class="time-spacer"></div>
      <span class="seconds-sm" id="secondsSmall"></span>
    </div>
  </div>
  <div class="date" id="date"></div>
  <div class="weather" id="weather">loading forecast...</div>
  <div class="weather-timeline" id="weatherTimeline">
    <div class="weather-timeline-inner" id="timelineInner"></div>
  </div>
  <div class="next-zman" id="nextZman">🕯️ Next Zman: --</div>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <h2>✨ Ambient Control + Zmanim</h2>
    <label>🖌️ Layout Style</label>
    <select id="layout">
      <option value="retro">Retro LED</option>
      <option value="simple">Simple & Clean</option>
      <option value="minimal">Minimal pure</option>
      <option value="split">Split Chroma</option>
      <option value="sidebar">Sidebar Hub (Desktop)</option>
      <option value="phone">Phone View</option>
    </select>
    <label>🎨 Theme Color</label>
    <select id="colorPreset"><option value="#00e5ff">Retro Cyan</option><option value="#00ff66">Coding Green</option><option value="#ff3b30">Red Ember</option><option value="custom">Custom (picker)</option></select>
    <input type="color" id="customColor" value="#00e5ff">
    <label>🌑 Background</label>
    <select id="bgPreset"><option value="#000000">Pure Black</option><option value="#222222">Dark Graphite</option><option value="#001133">Deep Navy</option><option value="custom">Custom Color</option></select>
    <input type="color" id="customBg" value="#000000">

    <button id="advBtn" type="button">⚡ Advanced Display & Zmanim</button>
    <div id="advanced">
      <div class="tabs">
        <div class="tab active" data-tab="tab-zmanim">🕯️ Zmanim</div>
        <div class="tab" data-tab="tab-alarms">⏰ Alarms</div>
        <div class="tab" data-tab="tab-weather">🌤️ Weather</div>
        <div class="tab" data-tab="tab-display">🖥️ Display</div>
      </div>

      <div id="tab-zmanim" class="tab-content active">
        <label>🕯️ Zmanim Selection (Hebrew names)</label>
        <div id="zmanimChecklist" class="zmanim-grid"></div>
        <label>⏳ Zman Display Type</label>
        <select id="zmanDisplayType"><option value="time">At time (10:30 PM)</option><option value="countdown">Countdown (in 2h 15m)</option></select>
        <label>🏷️ Show "Next Zman:" prefix</label>
        <select id="showNextZmanPrefix"><option value="true">Show</option><option value="false">Hide</option></select>
        <label>🎨 Zman Text Color</label>
        <select id="zmanColorPreset"><option value="theme">Same as theme</option><option value="custom">Custom Color</option></select>
        <input type="color" id="zmanCustomColor" value="#00e5ff">
      </div>

      <div id="tab-alarms" class="tab-content">
        <div id="alarmList"></div>
        <button id="addAlarm" style="margin-top: 15px; background: rgba(0, 229, 255, 0.2);">➕ Add Alarm (max 10)</button>
      </div>

      <div id="tab-weather" class="tab-content">
        <label>🌤️ Weather format</label>
        <select id="weatherFmt">
          <option value="extended">📊 Extended (High/Low + Rain)</option>
          <option value="words">🌡️ 72°F · Clear sky</option>
          <option value="numbers">🌤️ 72°F</option>
        </select>
        <label>🎨 Weather Icon</label>
        <select id="weatherIconColor">
          <option value="default">Natural Colors</option>
          <option value="theme">Theme Match</option>
        </select>
        <label>📈 Weather Timeline Bar</label>
        <select id="showWeatherTimeline"><option value="true">Show (Hourly)</option><option value="false">Hide</option></select>
        <label>🎨 Weather Text Color</label>
        <select id="weatherColorPreset"><option value="theme">Same as theme</option><option value="custom">Custom Color</option></select>
        <input type="color" id="weatherCustomColor" value="#00e5ff">
      </div>

      <div id="tab-display" class="tab-content">
        <label>📆 Weekday Text Size</label>
        <select id="weekdaySize"><option value="0.8">Small (0.8x)</option><option value="1.0">Normal (1x)</option><option value="1.2">Big (1.2x)</option><option value="1.5">Extra Large (1.5x)</option><option value="1.8">Huge (1.8x)</option></select>
        <label>⏲️ Time Extras (Seconds & AM/PM)</label>
        <select id="showTimeExtras"><option value="true">Show unit</option><option value="false">Hide unit</option></select>
        <label>📅 Date format</label>
        <select id="dateFmt"><option value="long">Monday, June 1, 2026</option><option value="medium">Mon, Jun 1</option><option value="numeric">6/1/2026</option></select>
        <label>✍️ Clock font family</label>
        <select id="font"><option value="'Inter', 'SF Mono', monospace">Digital Mono</option><option value="'Segoe UI', 'Inter', sans-serif">Modern Sans</option><option value="'Cormorant Garamond', serif">Classic Serif</option></select>
      </div>
    </div>
    <div class="button-group">
      <button id="fullscreen">🖥️ Fullscreen</button>
      <button id="save">💾 Save & Close</button>
    </div>
  </div>
</div>

<script>
  const ZMANIM_DB = {
    alotHaShachar: { he: "עלות השחר", icon: "🌄", default: true, display: "Alot Hashachar" },
    misheyakir: { he: "משיכיר", icon: "👕", default: true, display: "Mi Sheyakir" },
    sunrise: { he: "נץ החמה", icon: "🌅", default: true, display: "Netz" },
    sofZmanShmaMGA: { he: "סוף ק\"ש (מג\"א)", icon: "📜", default: false, display: "Sof Zman Shma MGA" },
    sofZmanShma: { he: "סוף ק\"ש (גר\"א)", icon: "📜", default: true, display: "Sof Zman Shma GRA" },
    sofZmanTfilla: { he: "סוף תפילה (גר\"א)", icon: "🙏", default: true, display: "Sof Zman Tfila" },
    chatzot: { he: "חצות", icon: "🕛", default: true, display: "Chatzot" },
    minchaGedola: { he: "מנחה גדולה", icon: "☀️", default: true, display: "Mincha Gedola" },
    plagHaMincha: { he: "פלג המנחה", icon: "🌤️", default: false, display: "Plag HaMincha" },
    sunset: { he: "שקיעה", icon: "🌇", default: true, display: "Shkiya" },

  function getWeatherIcon(code, hour = -1) {
    let isNight = false;
    const now = new Date();
    if (currentZmanimData.sunset && currentZmanimData.sunrise) {
      if (hour === -1) {
        isNight = now >= currentZmanimData.sunset || now < currentZmanimData.sunrise;
      } else {
        const sHour = currentZmanimData.sunset.getHours();
        const rHour = currentZmanimData.sunrise.getHours();
        isNight = hour >= sHour || hour < rHour;

    } else {
      if (hour === -1) hour = now.getHours();
      isNight = hour >= 19 || hour <= 6;
    }

    let icon = "";
    if (code >= 95) icon = "⛈️";
    else if (code >= 71 && code <= 77) icon = "❄️";
    else if (code >= 80 && code <= 82) icon = "🌧️";
    else if (code >= 61 && code <= 67) icon = "🌧️";
    else if (code >= 51 && code <= 55) icon = "🌦️";
    else if (code >= 45 && code <= 48) icon = "🌫️";

    if (useTheme) classes.push('theme-icon-filter');
    if (isNight && icon === '🌙') classes.push('night-moon');

  let lastTemp = null, lastCode = 0, conditionTxt = "Clear", todayH = null, todayL = null, rainInf = "No rain today";

  function updateRainInfo() {
    if (!hourlyPrecipitation.length) return;
    const now = new Date();
    const currentHour = now.getHours();
    let rToday = false;
    let currentlyRaining = hourlyPrecipitation[currentHour] > 0;
    
    let firstRainHour = -1;
    let lastRainHour = -1;
    for (let i = 0; i < 24; i++) {
      if (hourlyPrecipitation[i] > 0) {
        rToday = true;
        if (firstRainHour === -1) firstRainHour = i;
        lastRainHour = i;
      }
    }

    if (!rToday) {
      rainInf = "No rain today";
    } else if (currentlyRaining) {
      rainInf = "Raining Now";
    } else if (currentHour < firstRainHour) {
      const displayTime = firstRainHour > 12 ? (firstRainHour - 12) + ":00 PM" : (firstRainHour === 12 ? "12:00 PM" : (firstRainHour === 0 ? "12:00 AM" : firstRainHour + ":00 AM"));
      rainInf = `Rain starting at ${displayTime}`;
    } else if (currentHour > lastRainHour) {
      rainInf = "No more rain today";
    } else {
      let nextRainHour = -1;
      for (let i = currentHour + 1; i < 24; i++) {
        if (hourlyPrecipitation[i] > 0) {
          nextRainHour = i;
          break;
        }
      }
      if (nextRainHour !== -1) {
        const displayTime = nextRainHour > 12 ? (nextRainHour - 12) + ":00 PM" : (nextRainHour === 12 ? "12:00 PM" : (nextRainHour === 0 ? "12:00 AM" : nextRainHour + ":00 AM"));
        rainInf = `Rain starting at ${displayTime}`;
      } else {
        rainInf = "No more rain today";
      }
    }
    updateWeatherDisplay();
  }

  async function fetchWeather(lat, lon) {
    try {
      const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min&hourly=temperature_2m,weathercode,precipitation&temperature_unit=fahrenheit&timezone=auto`);
      const data = await resp.json();
      if (data.current) {
        lastTemp = data.current.temperature_2m; lastCode = data.current.weathercode;
        if (data.daily) { todayH = data.daily.temperature_2m_max[0]; todayL = data.daily.temperature_2m_min[0]; }
        updateWeatherTimeline(data);
        if (data.hourly) { hourlyPrecipitation = data.hourly.precipitation; updateRainInfo(); }
        const c = lastCode;
        conditionTxt = c === 0 ? "Clear sky" : (c <= 2 ? "Mainly clear" : (c === 3 ? "Overcast" : (c <= 48 ? "Foggy" : (c <= 55 ? "Drizzle" : (c <= 67 ? "Rain" : (c <= 77 ? "Snow" : (c <= 82 ? "Showers" : "Thunderstorm")))))));
        updateWeatherDisplay();
      }
    } catch(e) { weatherEl.textContent = "🌡️ offline"; }
  }

  let lastFetchedLat = null, lastFetchedLon = null;

  async function fetchZmanim(lat, lon, specificDate = null) {
    const latNum = parseFloat(lat);
    const lonNum = parseFloat(lon);
    
    if (isNaN(latNum) || isNaN(lonNum)) {
      console.warn("Invalid coordinates for zmanim:", lat, lon);
      return;
    }

    const h = window.hebcal || hebcal;
    if (typeof h === 'undefined') {
      zmanimError = "⚠️ Library loading...";
      nextZmanEl.textContent = zmanimError;
      return;
    }

    try {
      const d = specificDate || new Date();
      const tzid = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      
      const gloc = new h.Location(latNum, lonNum, false, tzid);
      const zmanim = new h.Zmanim(gloc, d);
      
      const safeGet = (methodName, ...args) => {
        try {
          if (typeof zmanim[methodName] !== 'function') return null;
          const res = zmanim[methodName](...args);
          return res ? new Date(res) : null;
        } catch(e) {
          console.warn(`Zmanim method ${methodName} failed:`, e);
          return null;
        }
      };

      currentZmanimData = {
        alotHaShachar: safeGet('alotHaShachar'),
        misheyakir: safeGet('misheyakir'),
        sunrise: safeGet('sunrise'),
        sofZmanShmaMGA: safeGet('sofZmanShmaMGA'),
        sofZmanShma: safeGet('sofZmanShma'),
        sofZmanTfilla: safeGet('sofZmanTfilla'),
        chatzot: safeGet('chatzot'),
        minchaGedola: safeGet('minchaGedola'),
        plagHaMincha: safeGet('plagHaMincha'),
        sunset: safeGet('shkiah'),
        earliestShemaSchachter: safeGet('tzeit', 6.0), // 6.0 degrees corresponds to 24 minutes as degrees in Jerusalem at equinox
        candleLighting: safeGet('candleLighting'),
        tzeit85deg: safeGet('tzeit')
      };

      zmanimError = null;
      updateNextZmanDisplay();
    } catch (e) { 
      console.error("Local Zmanim calculation failed:", e);
      zmanimError = "⚠️ Calculation error";
      nextZmanEl.textContent = zmanimError; 
    }
  }

  function updateNextZmanDisplay() {
    if (zmanimError) {
      nextZmanEl.textContent = zmanimError;
      return;
    }
    if (!Object.keys(currentZmanimData).length) { 
      if (!isFetchingZmanim) nextZmanEl.textContent = "📅 Loading..."; 
      return; 
    }
    const now = new Date();
    const layout = localStorage.layout || 'sidebar';
    const isSidebar = layout === 'sidebar';
    const isPhone = layout === 'phone';
    const sortedKeys = Object.keys(currentZmanimData)
      .filter(k => currentZmanimData[k] !== null)
      .sort((a,b) => currentZmanimData[a] - currentZmanimData[b]);
      
    const upcomingZmanim = sortedKeys.filter(k => enabledZmanKeys.has(k) && currentZmanimData[k] > now);

    if (upcomingZmanim.length > 0) {
      if (isSidebar || isPhone) {
        let html = "";
        const count = isPhone ? 4 : 6;
        upcomingZmanim.slice(0, count).forEach(k => {
          const m = ZMANIM_DB[k];
          const timeStr = currentZmanimData[k].toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
          html += `<div>${timeStr}: ${m.he}</div>`;
        });
        nextZmanEl.innerHTML = html;
        nextZmanEl.style.alignItems = "flex-start";
        nextZmanEl.style.textAlign = "left";
      } else {
        const upK = upcomingZmanim[0];
        const up = currentZmanimData[upK];
        const diff = up - now;
        const h_cd = Math.floor(diff/3600000);
        const m_cd = Math.floor((diff%3600000)/60000);
        const s_cd = Math.floor((diff%60000)/1000);
        
        const m = ZMANIM_DB[upK], dt = localStorage.zmanDisplayType || 'time', p = (localStorage.showNextZmanPrefix !== 'false') ? "Next Zman: " : "";
        const txt = dt === 'countdown' ? `${p}${m.he} in ${h_cd}h ${m_cd}m ${s_cd}s` : `${p}${m.he} at ${up.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
        nextZmanEl.innerHTML = `${m.icon} ${txt}`;
        nextZmanEl.style.alignItems = "center";
        nextZmanEl.style.textAlign = "center";
      }
    } else {
      const tom = new Date(); tom.setDate(now.getDate()+1);
      const isDataForTomorrow = Object.values(currentZmanimData).some(d => d && d.toDateString() === tom.toDateString());
      
      if (!isDataForTomorrow) {
        nextZmanEl.textContent = "🌙 Fetching tomorrow...";
        const lat = localStorage.getItem('lastLat') || 40.7128;
        const lon = localStorage.getItem('lastLon') || -74.0060;
        fetchZmanim(lat, lon, tom);
      } else {
        nextZmanEl.textContent = "🌙 End of today's zmanim";
      }
    }
  }

  function initGeolocationAndZmanim() {
    const cachedLat = localStorage.getItem('lastLat');
    const cachedLon = localStorage.getItem('lastLon');
    if (cachedLat && cachedLon) {
      fetchZmanim(cachedLat, cachedLon);
      fetchWeather(cachedLat, cachedLon);
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(p => {
        const { latitude, longitude } = p.coords;
        localStorage.setItem('lastLat', latitude);
        localStorage.setItem('lastLon', longitude);
        fetchZmanim(latitude, longitude);
        fetchWeather(latitude, longitude);
      }, () => {
        if (!cachedLat) { fetchZmanim(40.7128, -74.0060); fetchWeather(40.7128, -74.0060); }
      });
    } else if (!cachedLat) {
      fetchZmanim(40.7128, -74.0060); fetchWeather(40.7128, -74.0060);
    }
  }

    }

    }
    applyThemeAndStyle(); updateTimeAndDate(); setInterval(updateTimeAndDate, 1000);
    setInterval(initGeolocationAndZmanim, 10*60000); initGeolocationAndZmanim();
  }

  async function toggleFullscreen() {
    const doc = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (doc.requestFullscreen) doc.requestFullscreen();
      else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitFullscreen();
    }
  }

  gearBtn.addEventListener('click', openModalWithCurrentSettings);
  saveBtn.addEventListener('click', saveAndClose);
  document.getElementById('addAlarm').addEventListener('click', window.addAlarm);
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  advBtn.addEventListener('click', () => { advancedDiv.style.display = (advancedDiv.style.display === 'block' ? 'none' : 'block'); advBtn.textContent = (advancedDiv.style.display === 'block' ? '▲ Hide' : '⚡ Advanced'); });
  modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
  document.body.addEventListener('click', e => { if (document.body.classList.contains('alarm-active')) { document.body.classList.remove('alarm-active'); if (activeAlarmTimeout) clearTimeout(activeAlarmTimeout); return; } if (modal.style.display !== 'flex' && !e.target.closest('.panel') && !e.target.closest('#gear')) document.body.classList.toggle('hidden-ui'); });
  [weekdaySizeSelect, showTimeExtrasSelect, zmanColorPresetSelect, weatherColorPresetSelect, showWeatherTimelineSelect, layoutSelect, weatherFmtSelect, fontSelect, weatherIconColorSelect].forEach(s => s.addEventListener('change', livePreviewAdvanced));
  [zmanCustomColorInput, weatherCustomColorInput].forEach(i => i.addEventListener('input', livePreviewAdvanced));
  initializeApp();
</script>
</body>
</html>
