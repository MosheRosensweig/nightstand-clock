<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightstand Weather Clock</title>

<style>
:root {
    --bg-color: #000000;
    --text-color: #ff3b30;
    --glow-strength: 10px;
    --glow-color: rgba(255,59,48,0.6);
    --font-family: 'Courier New', Courier, monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: var(--font-family);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: color 0.3s ease;
}

.container {
    text-align: center;
    width: 100%;
    padding: 20px;
}

.time-display {
    font-size: 15vw;
    font-weight: bold;
    line-height: 1;
    text-shadow: 0 0 var(--glow-strength) var(--glow-color);
}

.date-display {
    font-size: 4vw;
    margin-top: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.weather-display {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 30px;
    font-size: 5vw;
}

.weather-icon {
    font-size: 7vw;
}

.settings-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    color: var(--text-color);
    font-size: 28px;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.3s;
    z-index: 20;
}

.settings-btn:hover {
    opacity: 1;
}

.controls-hidden .settings-btn {
    opacity: 0;
    pointer-events: none;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.modal-content {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 30px;
    width: 90%;
    max-width: 420px;
    color: white;
    font-family: sans-serif;
}

.modal-title {
    font-size: 22px;
    margin-bottom: 20px;
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
}

.setting-group {
    margin-bottom: 16px;
}

.setting-group label {
    display: block;
    margin-bottom: 6px;
    color: #aaa;
}

.setting-group select {
    width: 100%;
    padding: 10px;
    background: #2a2a2a;
    border: 1px solid #444;
    color: white;
    border-radius: 6px;
    font-size: 16px;
}

.close-btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #333;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

.close-btn:hover {
    background: #444;
}

@media (min-width:1024px) {
    .time-display { font-size: 12rem; }
    .date-display { font-size: 2.5rem; }
    .weather-display { font-size: 3rem; }
}

@media (max-width:480px) {
    .time-display { font-size: 18vw; }
    .date-display { font-size: 5vw; }
    .weather-display {
        flex-direction: column;
        gap: 5px;
    }
}
</style>
</head>

<body>

<button class="settings-btn" id="openSettings">⚙️</button>

<div class="container">
    <div class="time-display" id="time">00:00:00</div>
    <div class="date-display" id="date">Loading...</div>

    <div class="weather-display">
        <span class="weather-icon" id="wxIcon">⏳</span>
        <span id="wxTemp">--°F</span>
        <span id="wxDesc">Loading Weather...</span>
    </div>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">

        <div class="modal-title">
            Clock Preferences
        </div>

        <div class="setting-group">
            <label>Text Glow Color</label>
            <select id="colorSelect">
                <option value="#ff3b30">Nightstand Red</option>
                <option value="#ff9500">Amber</option>
                <option value="#34c759">Green</option>
                <option value="#007aff">Blue</option>
                <option value="#af52de">Purple</option>
            </select>
        </div>

        <div class="setting-group">
            <label>Font Style</label>
            <select id="fontSelect">
                <option value="'Courier New', Courier, monospace">
                    Digital Terminal
                </option>
                <option value="sans-serif">
                    Modern Minimalist
                </option>
                <option value="serif">
                    Classic
                </option>
            </select>
        </div>

        <div class="setting-group">
            <label>Glow Intensity</label>
            <select id="glowSelect">
                <option value="5px">Subtle</option>
                <option value="15px">Medium</option>
                <option value="30px">Strong</option>
                <option value="0px">None</option>
            </select>
        </div>

        <div class="setting-group">
            <button class="close-btn" id="fullscreenBtn">
                Enter Fullscreen
            </button>
        </div>

        <button class="close-btn" id="closeSettings">
            Save & Close
        </button>

    </div>
</div>

<script>

const timeEl = document.getElementById('time');
const dateEl = document.getElementById('date');

const wxIconEl = document.getElementById('wxIcon');
const wxTempEl = document.getElementById('wxTemp');
const wxDescEl = document.getElementById('wxDesc');

const modal = document.getElementById('settingsModal');
const openBtn = document.getElementById('openSettings');
const closeBtn = document.getElementById('closeSettings');
const fullscreenBtn = document.getElementById('fullscreenBtn');

const colorSelect = document.getElementById('colorSelect');
const fontSelect = document.getElementById('fontSelect');
const glowSelect = document.getElementById('glowSelect');

let controlsVisible = true;

function tick() {
    const now = new Date();

    timeEl.textContent =
        now.toLocaleTimeString([], {
            hour: 'numeric',
            minute: '2-digit',
            second: '2-digit'
        });

    dateEl.textContent =
        now.toLocaleDateString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric'
        });
}

setInterval(tick, 1000);
tick();

function interpretWeather(code) {
    const map = {
        0:{icon:"☀️",desc:"Clear"},
        1:{icon:"🌤️",desc:"Mostly Clear"},
        2:{icon:"⛅",desc:"Partly Cloudy"},
        3:{icon:"☁️",desc:"Cloudy"},
        45:{icon:"🌫️",desc:"Fog"},
        61:{icon:"🌧️",desc:"Rain"},
        71:{icon:"🌨️",desc:"Snow"},
        80:{icon:"🌦️",desc:"Showers"},
        95:{icon:"⛈️",desc:"Thunderstorm"}
    };

    return map[code] || {
        icon:"🌡️",
        desc:"Weather"
    };
}

async function fetchWeather() {

    async function loadWeather(lat, lon) {

        try {

            const response = await fetch(
                `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`
            );

            const data = await response.json();

            const weather =
                interpretWeather(
                    data.current.weather_code
                );

            wxTempEl.textContent =
                Math.round(data.current.temperature_2m) + "°F";

            wxIconEl.textContent = weather.icon;
            wxDescEl.textContent = weather.desc;

        } catch(err) {
            wxDescEl.textContent =
                "Weather Unavailable";
        }
    }

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(
            pos => loadWeather(
                pos.coords.latitude,
                pos.coords.longitude
            ),
            () => loadWeather(40.7128,-74.0060)
        );

    } else {
        loadWeather(40.7128,-74.0060);
    }
}

fetchWeather();
setInterval(fetchWeather, 15 * 60 * 1000);

function hexToRgbA(hex, alpha) {

    let c;

    if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {

        c = hex.substring(1).split('');

        if(c.length === 3) {
            c = [
                c[0],c[0],
                c[1],c[1],
                c[2],c[2]
            ];
        }

        c = '0x' + c.join('');

        return `rgba(${
            (c>>16)&255
        },${
            (c>>8)&255
        },${
            c&255
        },${alpha})`;
    }

    return hex;
}

function applySettings(color,font,glow) {

    document.documentElement
        .style.setProperty(
            '--text-color',
            color
        );

    document.documentElement
        .style.setProperty(
            '--font-family',
            font
        );

    document.documentElement
        .style.setProperty(
            '--glow-strength',
            glow
        );

    document.documentElement
        .style.setProperty(
            '--glow-color',
            hexToRgbA(color,0.6)
        );

    openBtn.style.color = color;

    localStorage.setItem(
        'ns-color',
        color
    );

    localStorage.setItem(
        'ns-font',
        font
    );

    localStorage.setItem(
        'ns-glow',
        glow
    );
}

async function toggleFullscreen() {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement
                .requestFullscreen();

            localStorage.setItem(
                'ns-fullscreen',
                'true'
            );

        } else {

            await document.exitFullscreen();

            localStorage.setItem(
                'ns-fullscreen',
                'false'
            );
        }

        updateFullscreenButton();

    } catch(err) {
        console.error(err);
    }
}

function updateFullscreenButton() {

    fullscreenBtn.textContent =
        document.fullscreenElement
            ? "Exit Fullscreen"
            : "Enter Fullscreen";
}

function toggleControls() {

    controlsVisible = !controlsVisible;

    if (controlsVisible) {

        document.body.classList
            .remove('controls-hidden');

    } else {

        document.body.classList
            .add('controls-hidden');
    }
}

openBtn.addEventListener(
    'click',
    () => modal.style.display = 'flex'
);

closeBtn.addEventListener(
    'click',
    () => {

        applySettings(
            colorSelect.value,
            fontSelect.value,
            glowSelect.value
        );

        modal.style.display = 'none';
    }
);

fullscreenBtn.addEventListener(
    'click',
    toggleFullscreen
);

document.addEventListener(
    'fullscreenchange',
    updateFullscreenButton
);

document.body.addEventListener(
    'click',
    (e) => {

        if (
            e.target.closest('.settings-btn')
        ) return;

        if (
            e.target.closest('.modal-content')
        ) return;

        if (
            modal.style.display === 'flex'
        ) return;

        toggleControls();
    }
);

window.addEventListener(
    'DOMContentLoaded',
    () => {

        const savedColor =
            localStorage.getItem(
                'ns-color'
            ) || '#ff3b30';

        const savedFont =
            localStorage.getItem(
                'ns-font'
            ) ||
            "'Courier New', Courier, monospace";

        const savedGlow =
            localStorage.getItem(
                'ns-glow'
            ) || '10px';

        colorSelect.value =
            savedColor;

        fontSelect.value =
            savedFont;

        glowSelect.value =
            savedGlow;

        applySettings(
            savedColor,
            savedFont,
            savedGlow
        );

        updateFullscreenButton();
    }
);

</script>

</body>
</html>
