<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nightstand Clock V5 | Zmanim Ambient Clock</title>
<script src="https://cdn.jsdelivr.net/npm/@hebcal/core@latest/dist/bundle.min.js"></script>
<style>
  /* ----- GLOBAL RESET & DESIGN SYSTEM ----- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }

  :root {
    --fg: #00e5ff;
    --bg: #000000;
    --transition-smooth: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    --card-radius: 28px;
    --btn-radius: 44px;
    --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.5);
    /* dynamic sizes */
    --weekday-scale: 1.2;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', 'SF Mono', 'Fira Code', monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: background 0.25s ease, color 0.2s ease;
    padding: 0;
  }

  /* gear icon */
  #gear {
    position: fixed;
    top: 22px;
    right: 24px;
    font-size: 28px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 60px;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
    transition: var(--transition-smooth);
    z-index: 200;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  }

  #gear:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.03) rotate(8deg);
    border-color: var(--fg);
  }

  .hidden-ui #gear {
    display: none;
  }

  /* main clock container */
  #clock {
    text-align: center;
    width: 100%;
    height: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2vh;
    box-sizing: border-box;
  }

  /* TIME LINE */
  .time-line {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 0.15em;
  }
  .main-hour-minute {
    font-size: 1em;
    font-weight: inherit;
    line-height: 0.8;
    display: block;
  }
  .time-extras {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.35em;
    text-align: left;
    margin: 0;
    padding: 0;
  }
  .ampm-indicator {
    opacity: 1;
    font-weight: 500;
    line-height: 0.7;
  }
  .seconds-sm {
    opacity: 1;
    font-weight: 400;
    line-height: 0.7;
  }
  .time-extras.hide-extras {
    display: none;
  }

  /* Base styles replaced by .weekday-container */

  /* Layout styles */
  .retro .time-line { font-size: 18vw; }
  .retro .main-hour-minute, .retro .time-extras, .retro .date, .retro .weekday-container { font-weight: 700; }
  .glow-on .retro .main-hour-minute, .glow-on .retro .time-extras, .glow-on .retro .date, .glow-on .retro .weekday-container { text-shadow: 0 0 8px currentColor; }
  
  .simple .time-line { font-size: 14vw; }
  .simple .main-hour-minute { font-weight: 400; }
  .minimal .time-line { font-size: 12vw; }
  .minimal .main-hour-minute { font-weight: 300; }
  
  .split .time-line { font-size: 13vw; }
  .split .main-hour-minute, .split .time-extras, .split .date, .split .weekday-container {
    font-weight: 600;
    color: var(--fg);
    background: none;
    -webkit-background-clip: initial;
    background-clip: initial;
  }
  .glow-on .split .main-hour-minute, .glow-on .split .time-extras, .glow-on .split .date, .glow-on .split .weekday-container {
    text-shadow: 0 0 12px var(--fg), 0 0 24px rgba(0, 229, 255, 0.4);
  }
  .glow-on .split .time-extras {
    text-shadow: 0 0 8px var(--fg);
  }

  /* Split View Specific Layout (Mobile Landscape) */
  .split#clock {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    gap: 0;
  }
  .split .weekday-container {
    order: 1;
    margin-bottom: 3vh;
    margin-right: 20px;
  }
  .split .date {
    order: 2;
    margin-top: 0;
    margin-bottom: 3vh;
    font-size: calc(2.2vw * var(--weekday-scale));
  }
  .split .time-line {
    order: 3;
    width: 100%;
    margin-bottom: 4vh;
  }
  .split .weather, .split .next-zman, .split .weather-timeline {
    order: 4;
    margin-top: -1vh; /* Nudge up */
  }
  
  /* Sidebar Hub Layout */
  .sidebar#clock {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: 1fr 0 auto 0 1fr;
    grid-template-areas:
      ". . ."
      ". weekday ."
      "weather timeline zmanim"
      ". date ."
      "hourly hourly hourly";
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 0;
    margin: 0;
    gap: 0;
  }
  .sidebar .weekday-container {
    grid-area: weekday;
    transform: translateY(-3vh);
    justify-self: center;
    display: flex;
    align-items: center;
  }
  .sidebar .weekday-container span {
    font-size: min(4vw, 5vh);
  }
  .sidebar .time-line {
    grid-area: timeline;
    font-size: min(15vw, 25vh);
    justify-self: center;
    display: flex;
    position: relative;
    align-items: center;
  }
  .sidebar .main-hour-minute { line-height: 0.8; }
  .sidebar .time-extras {
    position: absolute;
    left: 100%;
    margin-left: 0.1em;
    height: 70%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.35em;
  }
  .sidebar #date { grid-area: date; transform: translateY(3vh); font-size: min(3.5vw, 4vh); justify-self: center; line-height: 0; }
  .sidebar #weather {
    grid-area: weather;
    justify-self: end;
    margin-right: 3vw;
    flex-direction: column;
    align-items: center;
    background: rgba(255,255,255,0.05);
    padding: 3vh 2vw;
    border-radius: 32px;
    font-size: min(2.5vw, 3.5vh);
    gap: 12px;
    height: auto;
    justify-content: center;
    max-width: 25vw;
  }
  .sidebar #nextZman {
    grid-area: zmanim;
    justify-self: start;
    margin-left: 3vw;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    background: rgba(255,255,255,0.05);
    padding: 3vh 2vw;
    border-radius: 32px;
    font-size: min(2vw, 3vh);
    gap: 8px;
    height: auto;
    border: none;
    text-align: left;
    max-width: 25vw;
    overflow: hidden;
  }
  .sidebar .weather-timeline {
    grid-area: hourly;
    position: absolute;
    bottom: 2vh;
    left: 2vw;
    right: 2vw;
    width: auto;
    margin: 0;
  }
  .sidebar .weather-stack { border-left: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 8px 0 0 0; margin: 0; align-items: center; width: 100%; }
  .sidebar .weather-rain { border-left: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 8px 0 0 0; margin: 0; width: 100%; text-align: center; }

  /* Phone View Layout */
  .phone#clock {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto auto auto auto;
    grid-template-areas:
      "weekday"
      "timeline"
      "date"
      "zmanim"
      "weather"
      "hourly";
    align-items: center;
    justify-items: center;
    width: 100vw;
    height: 100vh;
    padding: 1.5vh;
    gap: 8px;
    overflow-y: auto;
  }
  .phone .weekday-container {
    grid-area: weekday;
    margin-bottom: 0;
    display: flex;
    align-items: center;
  }
  .phone .weekday-container span {
    font-size: min(8vw, 5vh);
    line-height: 1.2;
  }
  .phone .time-line { grid-area: timeline; font-size: min(22vw, 18vh); position: relative; margin: 5px 0; }
  .phone .main-hour-minute { line-height: 0.9; }
  .phone .time-extras {
    position: absolute;
    left: 100%;
    margin-left: 0.2em;
    height: 80%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.25em;
  }
  .phone #date { grid-area: date; font-size: min(5vw, 3.5vh); margin: 0; }
  .phone #weather {
    grid-area: weather;
    flex-direction: row;
    background: rgba(255,255,255,0.05);
    padding: 12px 20px;
    border-radius: 60px;
    font-size: min(3.5vw, 2.5vh);
    max-width: 90vw;
    width: auto;
    gap: 15px;
    margin-top: 5px;
  }
  .phone #nextZman {
    grid-area: zmanim;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.4);
    padding: 12px 15px;
    border-radius: 24px;
    font-size: 1rem;
    max-width: 95vw;
    width: auto;
    border: 1px solid rgba(0, 229, 255, 0.15);
    text-align: left;
    align-items: center;
    overflow: hidden;
  }
  .phone .weather-timeline { grid-area: hourly; display: block; margin: 10px 0 0 0; width: 95vw; }
  .phone .weather-stack { border-left: 1px solid rgba(255,255,255,0.1); padding-left: 10px; margin-left: 0; flex-direction: column; display: flex; }
  .phone .weather-rain { border-left: 1px solid rgba(255,255,255,0.1); padding-left: 10px; margin-left: 0; font-size: 0.85em; display: flex; align-items: center; }

  /* Theme filter for icons */
  .theme-icon-filter {
    filter: grayscale(100%) brightness(1.5) sepia(1) hue-rotate(170deg) saturate(10);
  }

  .weather-icon-colored {
    color: transparent !important;
    text-shadow: 0 0 0 var(--weather-icon-color);
    display: inline-block;
  }

  @media (max-width: 640px) {
    .sidebar#clock {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "weekday weekday"
        "timeline timeline"
        "date date"
        "weather zmanim"
        "hourly hourly";
      font-size: 3.5vw;
      gap: 10px;
    }
    .sidebar #weather, .sidebar #nextZman { font-size: 3.5vw; padding: 12px; height: auto; }
    .sidebar .time-line { font-size: 18vw; margin: 0; }
  }
  
  .weekday-container {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: calc(2.2vw * var(--weekday-scale));
    font-weight: 500;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-transform: uppercase;
    transition: font-size 0.1s ease;
  }
  .weekday {
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
  }
  .weekday-container #location {
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
  }
  .date {
    font-size: 2.8vw;
    margin-top: 18px;
    font-weight: 400;
  }
  .weather {
    margin-top: 24px;
    font-size: 2.2vw;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(8px);
    display: inline-flex;
    align-items: center;
    padding: 10px 28px;
    border-radius: 60px;
    gap: 12px;
    color: var(--weather-fg, var(--fg));
  }
  .weather-stack {
    display: flex;
    flex-direction: column;
    font-size: 0.7em;
    line-height: 1.1;
    text-align: left;
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
  }
  .weather-rain {
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
  }

  .next-zman {
    margin-top: 20px;
    font-size: 2.2vw;
    background: rgba(0, 150, 200, 0.2);
    backdrop-filter: blur(8px);
    display: inline-block;
    padding: 10px 28px;
    border-radius: 60px;
    font-weight: 500;
    letter-spacing: 0.3px;
    border: 1px solid rgba(0, 229, 255, 0.3);
    transition: all 0.2s;
    color: var(--zman-fg, var(--fg));
  }

  /* MODAL */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(12px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .panel {
    background: #11141fcc;
    backdrop-filter: blur(24px);
    border-radius: 48px;
    padding: 28px 26px;
    width: 90%;
    max-width: 580px;
    max-height: 85vh;
    overflow-y: auto;
    color: #f0f3ff;
    border: 1px solid rgba(0, 230, 255, 0.3);
    box-shadow: var(--shadow-soft);
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-track { background: #1e2335; border-radius: 10px; }
  .panel::-webkit-scrollbar-thumb { background: var(--fg); border-radius: 10px; }

  .panel h2 { font-size: 1.8rem; font-weight: 500; margin-bottom: 20px; border-left: 4px solid var(--fg); padding-left: 16px; }

  label { display: block; margin-top: 18px; margin-bottom: 8px; font-weight: 500; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #bbd4ff; }

  select, input[type="color"], input[type="number"] { width: 100%; padding: 12px 16px; background: rgba(20, 25, 40, 0.9); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 60px; color: white; cursor: pointer; transition: var(--transition-smooth); }

  .zmanim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; background: rgba(20, 25, 40, 0.5); border-radius: 28px; padding: 14px; }
  .zman-check { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 0.9rem; }
  .zman-check input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--fg); }

  .button-group { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; justify-content: space-between; }
  button { background: rgba(30, 35, 55, 0.9); border: 1px solid rgba(0, 229, 255, 0.3); padding: 12px 20px; border-radius: 60px; font-size: 0.9rem; font-weight: 500; color: #eef5ff; cursor: pointer; transition: var(--transition-smooth); flex: 1; text-align: center; }
  button:hover { background: #1f2a46; border-color: var(--fg); transform: translateY(-2px); }
  #save { background: #00b8d4cc; border-color: #00e5ff; font-weight: 600; }

  #advanced { display: none; }
  .tabs { display: flex; gap: 10px; margin-top: 20px; border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; }
  .tab { padding: 8px 16px; cursor: pointer; border-radius: 12px; transition: var(--transition-smooth); font-size: 0.9rem; font-weight: 500; color: #bbd4ff; }
  .tab.active { background: rgba(0, 229, 255, 0.2); color: var(--fg); border: 1px solid rgba(0, 229, 255, 0.4); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* WEATHER TIMELINE BAR */
  .weather-timeline {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    display: none;
    padding: 15px 0;
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .weather-timeline::-webkit-scrollbar { display: none; }
  .weather-timeline-inner { display: flex; gap: 20px; padding: 0 20px; width: max-content; }
  .timeline-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.9rem; min-width: 60px; }
  .timeline-time { opacity: 1; font-size: 0.9rem; }
  .timeline-temp { font-weight: 600; }
  .timeline-icon { font-size: 1.2rem; }
  .night-moon { filter: grayscale(100%) brightness(1000%); display: inline-block; }

  /* ALARMS */
  .alarm-item { background: rgba(20, 25, 40, 0.5); border-radius: 20px; padding: 16px; margin-top: 12px; border: 1px solid rgba(0, 229, 255, 0.1); }
  .alarm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .alarm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .alarm-input-group { display: flex; flex-direction: column; gap: 4px; }
  .alarm-input-group input { padding: 8px 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 10px; color: white; }
  .remove-alarm { color: #ff3b30; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; font-weight: 600; }

  @keyframes alarmFlash { 0%, 49% { background: #000000; color: #ffffff; } 50%, 100% { background: #ffffff; color: #000000; } }
  .alarm-active { animation: alarmFlash var(--flash-speed, 0.5s) infinite; }

  @keyframes redWave {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes urgentFlash {
    0%, 49% { background-color: var(--urgent-c1, #ff0000); color: white; }
    50%, 100% { background-color: var(--urgent-c2, #000000); color: white; }
  }
  @keyframes urgentFade {
    0%, 100% {
      background-color: var(--urgent-c1, #ff0000);
      border-color: var(--urgent-c1);
      box-shadow: 0 0 20px var(--urgent-c1);
    }
    50% {
      background-color: var(--urgent-c2, #000000);
      border-color: var(--urgent-c2);
      box-shadow: 0 0 5px var(--urgent-c2);
    }
  }
  .urgent-zman {
    background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.3), transparent);
    background-size: 200% 100%;
    animation: redWave 4s infinite linear;
    border: 1px solid #ff3b30;
    box-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
    transition: background 0.3s, border-color 0.3s;
  }
  .urgent-zman.flash-mode {
    background: none;
    animation: urgentFlash var(--urgent-speed, 0.5s) step-end infinite !important;
    border: 1px solid var(--urgent-c1) !important;
  }
  .urgent-zman.fade-mode {
    background: none;
    animation: urgentFade var(--urgent-speed, 0.5s) ease-in-out infinite !important;
  }

  @media (max-width: 640px) {
    .date { font-size: 6vw; }
    .weather { font-size: 4vw; padding: 1vh 4vw; margin-top: 2vh; }
    .next-zman { font-size: 4vw; padding: 1vh 4vw; margin-top: 2vh; }
    .weekday-container { font-size: calc(6vw * var(--weekday-scale)); margin-bottom: 3vh; }
    .split .weekday-container { margin-bottom: 3vh; }
    .retro .time-line { font-size: 22vw; }
    .simple .time-line { font-size: 18vw; }
    .minimal .time-line { font-size: 14vw; }
    .split .time-line { font-size: 16vw; }
  }
</style>
</head>
<body>

<button id="gear" aria-label="settings">⚙️</button>

<div id="clock" class="sidebar">
  <div class="weekday-container" id="weekdayContainer">
    <span id="location"></span>
    <span id="weekdaySeparator" style="display: none; margin: 0 18px; opacity: 0.7;">·</span>
    <span class="weekday" id="weekday"></span>
  </div>
  <div class="time-line">
    <span class="main-hour-minute" id="mainTime"></span>
    <div class="time-extras">
      <span class="ampm-indicator" id="ampmIndicator"></span>
      <div class="time-spacer"></div>
      <span class="seconds-sm" id="secondsSmall"></span>
    </div>
  </div>
  <div class="date" id="date"></div>
  <div class="weather" id="weather">loading forecast...</div>
  <div class="weather-timeline" id="weatherTimeline">
    <div class="weather-timeline-inner" id="timelineInner"></div>
  </div>
  <div class="next-zman" id="nextZman">🕯️ Next Zman: --</div>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <h2>✨ Ambient Control + Zmanim</h2>
    <label>🖌️ Layout Style</label>
    <select id="layout">
      <option value="retro">Retro LED</option>
      <option value="simple">Simple & Clean</option>
      <option value="minimal">Minimal pure</option>
      <option value="split">Mobile Landscape</option>
      <option value="sidebar">Sidebar Hub (Desktop)</option>
      <option value="phone">Phone View</option>
    </select>
    <label>🎨 Theme Color</label>
    <select id="colorPreset"><option value="#00e5ff">Retro Cyan</option><option value="#00ff66">Coding Green</option><option value="#ff3b30">Red Ember</option><option value="custom">Custom (picker)</option></select>
    <input type="color" id="customColor" value="#00e5ff">
    <label>🌑 Background</label>
    <select id="bgPreset"><option value="#000000">Pure Black</option><option value="#222222">Dark Graphite</option><option value="#001133">Deep Navy</option><option value="custom">Custom Color</option></select>
    <input type="color" id="customBg" value="#000000">

    <button id="advBtn" type="button">⚡ Advanced Display & Zmanim</button>
    <div id="advanced">
      <div class="tabs">
        <div class="tab active" data-tab="tab-zmanim">🕯️ Zmanim</div>
        <div class="tab" data-tab="tab-alarms">⏰ Alarms</div>
        <div class="tab" data-tab="tab-weather">🌤️ Weather</div>
        <div class="tab" data-tab="tab-display">🖥️ Display</div>
      </div>

      <div id="tab-zmanim" class="tab-content active">
        <label>🕯️ Zmanim Selection (Hebrew names)</label>
        <div id="zmanimChecklist" class="zmanim-grid"></div>
        <label>⏳ Zman Display Type</label>
        <select id="zmanDisplayType"><option value="time">At time (10:30 PM)</option><option value="countdown">Countdown (in 2h 15m)</option></select>
        <label>🏷️ Show "Next Zman:" prefix</label>

<script>
  const ZMANIM_DB = {

    misheyakir: { he: "משיכיר", icon: "👕", default: true, display: "Mi Sheyakir" },

    sofZmanShma: { he: "סוף ק\"ש (גר\"א)", icon: "📜", default: true, display: "Sof Zman Shma GRA" },

    tzeit85deg: { he: "צאת הכוכבים", icon: "🌌", default: true, display: "Tzeit" }
  };

  let currentZmanimData = {}, enabledZmanKeys = new Set(), alarms = [], activeAlarmTimeout = null, lastFetchedDate = "";
  let minyanimData = [], lastMinyanFetch = 0, isFetchingMinyanim = false, fetchCounter = 0;
  let hourlyPrecipitation = [];
  let zmanimError = null;
  let lastWeatherData = null;

  const weekdayEl = document.getElementById('weekday'), mainTimeSpan = document.getElementById('mainTime'), secondsSmallSpan = document.getElementById('secondsSmall'), ampmSpan = document.getElementById('ampmIndicator'), dateEl = document.getElementById('date'), weatherEl = document.getElementById('weather'), nextZmanEl = document.getElementById('nextZman'), weatherTimeline = document.getElementById('weatherTimeline'), timelineInner = document.getElementById('timelineInner'), clockContainer = document.getElementById('clock'), gearBtn = document.getElementById('gear'), modal = document.getElementById('modal'), layoutSelect = document.getElementById('layout'), colorPreset = document.getElementById('colorPreset'), customColor = document.getElementById('customColor'), bgPreset = document.getElementById('bgPreset'), customBg = document.getElementById('customBg'), weatherFmtSelect = document.getElementById('weatherFmt'), dateFmtSelect = document.getElementById('dateFmt'), fontSelect = document.getElementById('font'), advBtn = document.getElementById('advBtn'), advancedDiv = document.getElementById('advanced'), fullscreenBtn = document.getElementById('fullscreen'), saveBtn = document.getElementById('save'), weekdaySizeSelect = document.getElementById('weekdaySize'), showTimeExtrasSelect = document.getElementById('showTimeExtras'), zmanDisplayTypeSelect = document.getElementById('zmanDisplayType'), showNextZmanPrefixSelect = document.getElementById('showNextZmanPrefix'), zmanColorPresetSelect = document.getElementById('zmanColorPreset'), zmanCustomColorInput = document.getElementById('zmanCustomColor'), showWeatherTimelineSelect = document.getElementById('showWeatherTimeline'), weatherColorPresetSelect = document.getElementById('weatherColorPreset'), weatherCustomColorInput = document.getElementById('weatherCustomColor'), weatherIconColorSelect = document.getElementById('weatherIconColor'), weatherIconCustomColorInput = document.getElementById('weatherIconCustomColor'), glowEnabledSelect = document.getElementById('glowEnabled'), autoFullscreenSelect = document.getElementById('autoFullscreen'), urgentStyleSelect = document.getElementById('urgentStyle'), urgentColor1Input = document.getElementById('urgentColor1'), urgentColor2Input = document.getElementById('urgentColor2'), urgentFlashSpeedInput = document.getElementById('urgentFlashSpeed'), urgentFlashSettings = document.getElementById('urgentFlashSettings'), showLocationSelect = document.getElementById('showLocation'), locationFmtSelect = document.getElementById('locationFmt');

  async function fetchYUMinyanim() {
    const currentFetchId = ++fetchCounter;
    isFetchingMinyanim = true;
    updateNextZmanDisplay();

    const now = new Date();
    const dateToday = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    const tom = new Date(now); tom.setDate(tom.getDate() + 1);
    const dateTom = tom.getFullYear() + '-' + String(tom.getMonth() + 1).padStart(2, '0') + '-' + String(tom.getDate()).padStart(2, '0');

    const configs = [
      { url: 'https://www.yuzmanim.com/shacharis', date: dateToday },
      { url: 'https://www.yuzmanim.com/mincha', date: dateToday },
      { url: 'https://www.yuzmanim.com/maariv', date: dateToday },
      { url: 'https://www.yuzmanim.com/shacharis?date=' + dateTom, date: dateTom },
      { url: 'https://www.yuzmanim.com/mincha?date=' + dateTom, date: dateTom },
      { url: 'https://www.yuzmanim.com/maariv?date=' + dateTom, date: dateTom }
    ];

    try {
      const fetchResults = await Promise.all(configs.map(async (c) => {
        try {
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(c.url)}`;
          const resp = await fetch(proxyUrl);
          if (!resp.ok) return [];
          const data = await resp.json();
          if (!data || !data.contents) return [];
          return parseMinyanimFromHTML(data.contents, c.date, now);
        } catch(e) { return []; }
      }));

      if (currentFetchId !== fetchCounter) return;

      let allMinyanim = [].concat(...fetchResults);
      let uniqueMinyanim = [];
      
      allMinyanim.forEach(m => {
        const locKey = m.location.toLowerCase().replace(/\s+/g, '');
        const typeKey = m.type.toLowerCase();
        const exists = uniqueMinyanim.some(u =>
          u.type.toLowerCase() === typeKey &&
          u.location.toLowerCase().replace(/\s+/g, '') === locKey &&
          Math.abs(u.parsedTime - m.parsedTime) < 60000
        );
        if (!exists) uniqueMinyanim.push(m);
      });

      uniqueMinyanim.sort((a, b) => a.parsedTime - b.parsedTime);

      const newDataStr = JSON.stringify(uniqueMinyanim);
      const oldDataStr = JSON.stringify(minyanimData);
      
      if (newDataStr !== oldDataStr) {
        minyanimData = uniqueMinyanim;
        localStorage.setItem('cachedMinyanim', newDataStr);
        localStorage.setItem('cachedMinyanimDate', dateToday);
      }

      lastMinyanFetch = Date.now();
      isFetchingMinyanim = false;
      updateNextZmanDisplay();
    } catch (e) {
      if (currentFetchId === fetchCounter) {
        isFetchingMinyanim = false;
        updateNextZmanDisplay();
      }
    }
  }

  function parseMinyanimFromHTML(html, pageDateStr, now) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    
    const dateParts = pageDateStr.split('-');
    const expectedDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
    const expectedDayName = expectedDate.toLocaleDateString('en-US', { weekday: 'long' });

    const passedSection = doc.getElementById('passed_events');
    const allRows = Array.from(doc.querySelectorAll('.event'));
    const results = [];
    
    const noiseWords = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "January", "February", "March", "April", "June", "July", "August", "September", "October", "November", "December", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const noiseRegex = new RegExp('\\b(' + noiseWords.join('|') + ')\\b', 'i');

    allRows.forEach(row => {
      if (passedSection && passedSection.contains(row)) return;
      if (row.style.color === 'rgb(108, 117, 125)' || row.getAttribute('style')?.includes('#6C757D')) return;

      const rowText = row.textContent || "";
      const mentionedDay = daysOfWeek.find(d => rowText.includes(d));
      if (mentionedDay && mentionedDay !== expectedDayName) return;

      try {
        const typeEl = row.querySelector('.type');
        const locEl = row.querySelector('.post-link') || row.querySelector('i');
        const timeEl = row.querySelector('b');
        
        if (typeEl && timeEl) {
          const type = typeEl.textContent.trim();
          const location = locEl ? locEl.textContent.trim() : "Unknown";
          const timeStr = timeEl.textContent.trim().toUpperCase();
          
          if (location.length < 2 || location.includes("Logout") || location.includes("Menu")) return;
          if (noiseRegex.test(location) && !daysOfWeek.includes(location)) return;

          const dateToUse = pageDateStr || (now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'));
          let parsedTime = parseTimeStringWithDate(timeStr, dateToUse);
          
          if (parsedTime) {
            results.push({ type, location, timeStr, parsedTime });
          }
        }
      } catch (e) {}
    });
    return results;
  }

  function parseTimeStringWithDate(timeStr, dateStr) {
    const match = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!match) return null;
    let [_, hours, minutes, modifier] = match;
    hours = parseInt(hours, 10);
    minutes = parseInt(minutes, 10);
    if (modifier.toUpperCase() === 'PM' && hours < 12) hours += 12;
    if (modifier.toUpperCase() === 'AM' && hours === 12) hours = 0;
    
    const parts = dateStr.split('-');
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const d = parseInt(parts[2], 10);
    
    return new Date(y, m - 1, d, hours, minutes, 0);
  }

  function isUrgent(date) {
    if (!date) return false;
    const now = new Date();
    const diff = (date - now) / 60000;
    const threshold = parseInt(localStorage.urgencyThreshold || 15);
    return diff >= 0 && diff <= threshold;
  }

  function getWeatherIcon(code, hour = -1) {
    let isNight = false;
    const now = new Date();
    if (currentZmanimData.sunset && currentZmanimData.sunrise) {
      if (hour === -1) {
        isNight = now >= currentZmanimData.sunset || now < currentZmanimData.sunrise;
      } else {
        const sHour = currentZmanimData.sunset.getHours();
        const rHour = currentZmanimData.sunrise.getHours();
        isNight = hour >= sHour || hour < rHour;
      }
    } else {
      if (hour === -1) hour = now.getHours();
      isNight = hour >= 19 || hour <= 6;
    }

    let icon = "";
    if (code >= 95) icon = "⛈️";
    else if (code >= 71 && code <= 77) icon = "❄️";
    else if (code >= 80 && code <= 82) icon = "🌧️";
    else if (code >= 61 && code <= 67) icon = "🌧️";
    else if (code >= 51 && code <= 55) icon = "🌦️";
    else if (code >= 45 && code <= 48) icon = "🌫️";
    else if (code >= 3) icon = "☁️";
    else icon = isNight ? '🌙' : (code >= 1 ? "🌤️" : "☀️");

    const iconColorMode = localStorage.weatherIconColor || 'default';
    let classes = [];
    if (iconColorMode !== 'default') {
      classes.push('weather-icon-colored');
    } else {
      if (isNight && icon === '🌙') classes.push('night-moon');
    }
    
    return `<span class="${classes.join(' ')}">${icon}</span>`;
  }

  function updateWeatherTimeline(data) {
    if (!data.hourly) return;
    timelineInner.innerHTML = '';
    const now = new Date(), currentHour = now.getHours();
    for (let i = currentHour; i < currentHour + 24; i++) {
      const temp = data.hourly.temperature_2m[i], code = data.hourly.weathercode[i], timeIndex = i % 24;
      const displayTime = timeIndex > 12 ? (timeIndex - 12) + "pm" : (timeIndex === 12 ? "12pm" : (timeIndex === 0 ? "12am" : timeIndex + "am"));
      const item = document.createElement('div');
      item.className = 'timeline-item';
      item.innerHTML = `<span class="timeline-time">${displayTime}</span><span class="timeline-icon">${getWeatherIcon(code, timeIndex)}</span><span class="timeline-temp">${Math.round(temp)}°</span>`;
      timelineInner.appendChild(item);
    }
    weatherTimeline.style.display = (localStorage.showWeatherTimeline === 'true') ? 'block' : 'none';
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    });
  });

  function createAlarmUI() {
    const list = document.getElementById('alarmList'); list.innerHTML = '';
    alarms.forEach((alarm, index) => {
      const item = document.createElement('div'); item.className = 'alarm-item';
      item.innerHTML = `<div class="alarm-header"><strong>Alarm #${index + 1}</strong><span class="remove-alarm" onclick="removeAlarm(${index})">🗑️ Remove</span></div><div class="alarm-grid"><div class="alarm-input-group"><label>Time</label><input type="time" value="${alarm.time}" onchange="updateAlarm(${index}, 'time', this.value)"></div><div class="alarm-input-group"><label>Enabled</label><select onchange="updateAlarm(${index}, 'enabled', this.value === 'true')"><option value="true" ${alarm.enabled ? 'selected' : ''}>ON</option><option value="false" ${!alarm.enabled ? 'selected' : ''}>OFF</option></select></div><div class="alarm-input-group"><label>Flash Speed (sec)</label><input type="number" step="0.1" min="0.1" value="${alarm.flashSpeed}" onchange="updateAlarm(${index}, 'flashSpeed', this.value)"></div><div class="alarm-input-group"><label>Duration (sec)</label><input type="number" min="1" value="${alarm.duration}" onchange="updateAlarm(${index}, 'duration', this.value)"></div></div>`;
      list.appendChild(item);
    });
  }
  window.addAlarm = () => { if (alarms.length < 10) { alarms.push({ time: "08:00", enabled: true, flashSpeed: 0.5, duration: 30 }); createAlarmUI(); } };
  window.removeAlarm = (index) => { alarms.splice(index, 1); createAlarmUI(); };
  window.updateAlarm = (index, field, value) => { alarms[index][field] = value; };

  function triggerAlarm(alarm) {
    if (activeAlarmTimeout) clearTimeout(activeAlarmTimeout);
    document.body.style.setProperty('--flash-speed', `${alarm.flashSpeed}s`);
    document.body.classList.add('alarm-active');
    activeAlarmTimeout = setTimeout(() => { document.body.classList.remove('alarm-active'); activeAlarmTimeout = null; }, alarm.duration * 1000);
  }

  function applyThemeAndStyle() {
    const fg = (localStorage.colorPreset === 'custom') ? (localStorage.customColor || '#00e5ff') : (localStorage.colorPreset || '#00e5ff');
    const bg = (localStorage.bgPreset === 'custom') ? (localStorage.customBg || '#000000') : (localStorage.bgPreset || '#000000');
    document.documentElement.style.setProperty('--fg', fg);
    document.documentElement.style.setProperty('--bg', bg);
    document.documentElement.style.setProperty('--zman-fg', (localStorage.zmanColorPreset === 'custom') ? (localStorage.zmanCustomColor || '#00e5ff') : fg);
    const weatherFg = (localStorage.weatherColorPreset === 'custom') ? (localStorage.weatherCustomColor || '#00e5ff') : fg;
    document.documentElement.style.setProperty('--weather-fg', weatherFg);
    
    let iconColor = 'inherit';
    const iconColorMode = localStorage.weatherIconColor || 'default';
    if (iconColorMode === 'theme') iconColor = fg;
    else if (iconColorMode === 'weather') iconColor = weatherFg;
    else if (iconColorMode === 'custom') iconColor = localStorage.weatherIconCustomColor || '#00e5ff';
    document.documentElement.style.setProperty('--weather-icon-color', iconColor);

    const defaultLayout = (window.innerWidth <= 1024) ? 'split' : 'retro';
    clockContainer.className = localStorage.layout || defaultLayout;
    document.body.style.fontFamily = localStorage.font || "'Inter', 'SF Mono', monospace";
    document.documentElement.style.setProperty('--weekday-scale', localStorage.weekdaySize || "1.2");
    document.querySelector('.time-extras').classList.toggle('hide-extras', localStorage.showTimeExtras === 'false');
    
    document.body.classList.toggle('glow-on', localStorage.glowEnabled !== 'false');

    const uSpeed = localStorage.urgentFlashSpeed || '0.5';
    const uC1 = localStorage.urgentColor1 || '#ff0000';
    const uC2 = localStorage.urgentColor2 || '#000000';
    document.documentElement.style.setProperty('--urgent-speed', (uSpeed * 2) + 's');
    document.documentElement.style.setProperty('--urgent-c1', uC1);
    document.documentElement.style.setProperty('--urgent-c2', uC2);
  }

  function updateTimeAndDate() {
    const now = new Date();
    if (now.toDateString() !== lastFetchedDate) { lastFetchedDate = now.toDateString(); initGeolocationAndZmanim(); }
    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    if (now.getSeconds() === 0) alarms.forEach(a => { if (a.enabled && a.time === timeStr) triggerAlarm(a); });

    let h = now.getHours(), m = now.getMinutes(), ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    mainTimeSpan.textContent = `${h}:${m.toString().padStart(2, '0')}`;
    secondsSmallSpan.textContent = now.getSeconds().toString().padStart(2, '0');
    ampmSpan.textContent = ampm;
    weekdayEl.textContent = now.toLocaleDateString([], { weekday: 'long' }).toUpperCase();
    
    try {
      const day = now.getDay();
      if (day === 5 && currentZmanimData.candleLighting && now >= currentZmanimData.candleLighting) {
        weekdayEl.textContent = "🕯️ שבת קודש 🕯️";
      } else if (day === 6 && currentZmanimData.tzeit85deg && now < currentZmanimData.tzeit85deg) {
        weekdayEl.textContent = "🕯️ שבת קודש 🕯️";
      }
    } catch(e) {}

    const df = localStorage.dateFmt || 'medium';
    const layout = localStorage.layout || (window.innerWidth <= 1024 ? 'split' : 'retro');
    const isSplit = layout === 'split';

    if (df === 'numeric') {
      dateEl.textContent = now.toLocaleDateString();
    } else if (df === 'long') {
      const opts = { year: 'numeric', month: 'long', day: 'numeric' };
      if (!isSplit) opts.weekday = 'long';
      dateEl.textContent = now.toLocaleDateString([], opts);
    } else {
      const opts = { month: 'short', day: 'numeric' };
      if (!isSplit) opts.weekday = 'short';
      dateEl.textContent = now.toLocaleDateString([], opts);
    }
    updateNextZmanDisplay();
    if (now.getMinutes() % 10 === 0 && now.getSeconds() === 0) updateRainInfo();
  }

  let lastTemp = null, lastCode = 0, conditionTxt = "Clear", todayH = null, todayL = null, rainInf = "No rain today";

  function updateRainInfo() {
    if (!hourlyPrecipitation.length) return;
    const now = new Date();
    const currentHour = now.getHours();
    let rToday = false;
    let currentlyRaining = hourlyPrecipitation[currentHour] > 0;
    
    let firstRainHour = -1;
    let lastRainHour = -1;
    for (let i = 0; i < 24; i++) {
      if (hourlyPrecipitation[i] > 0) {
        rToday = true;
        if (firstRainHour === -1) firstRainHour = i;
        lastRainHour = i;
      }
    }

    if (!rToday) {
      rainInf = "No rain today";
    } else if (currentlyRaining) {
      rainInf = "Raining Now";
    } else if (currentHour < firstRainHour) {
      const displayTime = firstRainHour > 12 ? (firstRainHour - 12) + ":00 PM" : (firstRainHour === 12 ? "12:00 PM" : (firstRainHour === 0 ? "12:00 AM" : firstRainHour + ":00 AM"));
      rainInf = `Rain starting at ${displayTime}`;
    } else if (currentHour > lastRainHour) {
      rainInf = "No more rain today";
    } else {
      let nextRainHour = -1;
      for (let i = currentHour + 1; i < 24; i++) {
        if (hourlyPrecipitation[i] > 0) {
          nextRainHour = i;
          break;
        }
      }
      if (nextRainHour !== -1) {
        const displayTime = nextRainHour > 12 ? (nextRainHour - 12) + ":00 PM" : (nextRainHour === 12 ? "12:00 PM" : (nextRainHour === 0 ? "12:00 AM" : nextRainHour + ":00 AM"));
        rainInf = `Rain starting at ${displayTime}`;
      } else {
        rainInf = "No more rain today";
      }
    }
    updateWeatherDisplay();
  }

  function updateWeatherDisplay() {
    if (lastTemp === null) { weatherEl.textContent = "⛅ waiting..."; return; }
    const fmt = localStorage.weatherFmt || 'extended', icon = getWeatherIcon(lastCode);
    const layout = localStorage.layout || 'sidebar';
    const isSidebar = layout === 'sidebar';
    const isPhone = layout === 'phone';
    weatherTimeline.style.display = (localStorage.showWeatherTimeline === 'true') ? 'block' : 'none';
    if (lastWeatherData) updateWeatherTimeline(lastWeatherData);
    
    if (isSidebar || isPhone) {
      weatherEl.innerHTML = `
        <div style="font-weight: 600;">${icon} ${Math.round(lastTemp)}°F</div>
        <div style="font-size: 0.9em;">${conditionTxt}</div>
        <div class="weather-stack">
          <span>High: ${Math.round(todayH)}°</span>
          <span>Low: ${Math.round(todayL)}°</span>
        </div>
        <div class="weather-rain">${rainInf}</div>
      `;
    } else {
      if (fmt === 'numbers') weatherEl.innerHTML = `${icon} ${Math.round(lastTemp)}°F`;
      else if (fmt === 'words') weatherEl.innerHTML = `${icon} ${Math.round(lastTemp)}°F · ${conditionTxt}`;
      else weatherEl.innerHTML = `<span>${icon} ${Math.round(lastTemp)}°F</span> <span>${conditionTxt}</span> <div class="weather-stack"><span>High: ${Math.round(todayH)}°</span><span>Low: ${Math.round(todayL)}°</span></div> <div class="weather-rain">${rainInf}</div>`;

  async function fetchWeather(lat, lon) {
    try {
      const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min&hourly=temperature_2m,weathercode,precipitation&temperature_unit=fahrenheit&timezone=auto`);
      const data = await resp.json();
      lastWeatherData = data;
      if (data.current) {
        lastTemp = data.current.temperature_2m; lastCode = data.current.weathercode;
        if (data.daily) { todayH = data.daily.temperature_2m_max[0]; todayL = data.daily.temperature_2m_min[0]; }
        updateWeatherTimeline(data);
        if (data.hourly) { hourlyPrecipitation = data.hourly.precipitation; updateRainInfo(); }
        const c = lastCode;
        conditionTxt = c === 0 ? "Clear sky" : (c <= 2 ? "Mainly clear" : (c === 3 ? "Overcast" : (c <= 48 ? "Foggy" : (c <= 55 ? "Drizzle" : (c <= 67 ? "Rain" : (c <= 77 ? "Snow" : (c <= 82 ? "Showers" : "Thunderstorm")))))));
        updateWeatherDisplay();
      }
    } catch(e) { weatherEl.textContent = "🌡️ offline"; }
  }

  function fetchZmanim(lat, lon, specificDate = null) {
    const latNum = parseFloat(lat);
    const lonNum = parseFloat(lon);
    
    if (isNaN(latNum) || isNaN(lonNum)) {
      console.warn("Invalid coordinates for zmanim:", lat, lon);
      return;
    }

    const h = window.hebcal || (typeof hebcal !== 'undefined' ? hebcal : undefined);
    if (!h || !h.Location || !h.Zmanim) {
      zmanimError = "⚠️ Library loading...";
      nextZmanEl.textContent = zmanimError;
      return;
    }

    try {
      const d = specificDate || new Date();
      const tzid = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Jerusalem";
      
      const gloc = new h.Location(latNum, lonNum, false, tzid);
      const zmanim = new h.Zmanim(gloc, d);
      
      const safeGet = (methodName, ...args) => {
        try {
          if (typeof zmanim[methodName] !== 'function') return null;
          const res = zmanim[methodName](...args);
          return res ? new Date(res) : null;
        } catch(e) {
          return null;
        }
      };

      currentZmanimData = {
        alotHaShachar: safeGet('alotHaShachar'),
        misheyakir: safeGet('misheyakir'),
        sunrise: safeGet('sunrise'),
        sofZmanShmaMGA: safeGet('sofZmanShmaMGA'),
        sofZmanShma: safeGet('sofZmanShma'),
        sofZmanTfilla: safeGet('sofZmanTfilla'),
        chatzot: safeGet('chatzot'),
        minchaGedola: safeGet('minchaGedola'),
        plagHaMincha: safeGet('plagHaMincha'),
        sunset: safeGet('shkiah'),
        earliestShemaSchachter: safeGet('tzeit', 6.0),
        candleLighting: safeGet('candleLighting'),
        tzeit85deg: safeGet('tzeit')
      };

      zmanimError = null;
      updateNextZmanDisplay();
    } catch (e) {
      zmanimError = "⚠️ Calculation error";
      nextZmanEl.textContent = zmanimError;
    }
  }

        } else {

      } else {

    } else if (upcomingZmanim.length > 0) {

          if (urgentClass) {
            if (uStyle === 'flash') urgentClass += ' flash-mode';
            else if (uStyle === 'fade') urgentClass += ' fade-mode';
          }
          html += `<div class="${urgentClass}" style="padding: 4px 8px; border-radius: 8px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;">${ZMANIM_DB[key].icon} ${timeStr}: ${ZMANIM_DB[key].he}</div>`;
        });

        nextZmanEl.style.flexDirection = "column";
        nextZmanEl.style.alignItems = "flex-start";
        nextZmanEl.style.textAlign = "left";
        nextZmanEl.style.background = "rgba(0, 0, 0, 0.45)";

        nextZmanEl.classList.toggle('urgent-zman', isUrg);
        nextZmanEl.classList.toggle('flash-mode', isUrg && uStyle === 'flash');
        nextZmanEl.classList.toggle('fade-mode', isUrg && uStyle === 'fade');
        const diff = time - now;
        const h_cd = Math.floor(diff/3600000);

        const dt = localStorage.zmanDisplayType || 'time', p = (localStorage.showNextZmanPrefix !== 'false') ? "Next: " : "";
        const txt = dt === 'countdown' ? `${p}${ZMANIM_DB[item].he} in ${h_cd}h ${m_cd}m ${s_cd}s` : `${p}${ZMANIM_DB[item].he} at ${time.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;

      const tom = new Date(); tom.setDate(now.getDate()+1);

      if (!isDataForTomorrow && Object.keys(currentZmanimData).length > 0) {

  function renderMinyanimList(list, count, fSize, currNow, style, zmanimList) {
    let listHtml = "";
    for (let i = 0; i < count; i++) {
      const item = list[i];
      if (item) {
        const timeStr = item.parsedTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        const isTom = item.parsedTime.getDate() !== currNow.getDate();
        const tomTxt = isTom ? ' <span style="font-size: 0.8em; opacity: 0.8;">(Tom)</span>' : '';
        let urgentClass = isUrgent(item.parsedTime) ? 'urgent-zman' : '';
        if (urgentClass) {
          if (style === 'flash') urgentClass += ' flash-mode';
          else if (style === 'fade') urgentClass += ' fade-mode';
        }
        listHtml += `<div class="${urgentClass}" style="padding: 2px 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: ${fSize};" title="${item.type}: ${item.location}">${timeStr}${tomTxt}: ${item.type} <span style="opacity: 0.7; font-size: 0.9em;">(${item.location})</span></div>`;
      } else if (i < zmanimList.length && i < count) {
        listHtml += `<div style="padding: 2px 8px; opacity: 0; font-size: ${fSize};">--</div>`;
      }
    }
    return listHtml;
  }

  async function fetchLocationName(lat, lon) {
    try {
      const resp = await fetch(`https://api-bdc.io/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
      if (resp.ok) {
        const data = await resp.json();
        let longName = "";
        let shortName = "";
        
        const cityOrLocality = data.city || data.locality;
        if (cityOrLocality) {
          shortName = cityOrLocality;
          const statePart = data.principalSubdivisionCode ? data.principalSubdivisionCode.split('-')[1] : null;
          if (statePart) {
            longName = `${cityOrLocality}, ${statePart}`;
          } else if (data.principalSubdivision) {
            longName = `${cityOrLocality}, ${data.principalSubdivision}`;
          } else {
            longName = cityOrLocality;
          }
        } else if (data.principalSubdivision) {
          shortName = data.principalSubdivision;
          longName = data.principalSubdivision;
        }
        
        if (longName && shortName) {
          localStorage.setItem('locationLong', longName);
          localStorage.setItem('locationShort', shortName);
          updateLocationDisplay();
        }
      }
    } catch (e) {
      console.error("Error fetching location name:", e);
    }
  }

  function updateLocationDisplay() {
    const locEl = document.getElementById('location');
    const sepEl = document.getElementById('weekdaySeparator');
    if (!locEl) return;

    const showLoc = localStorage.showLocation !== 'false';
    if (!showLoc) {
      locEl.textContent = "";
      if (sepEl) sepEl.style.display = 'none';
      return;
    }

    const fmt = localStorage.locationFmt || 'long';
    let name = fmt === 'short' ? localStorage.getItem('locationShort') : localStorage.getItem('locationLong');
    if (!name) {
      const legacy = localStorage.getItem('locationName');
      if (legacy) {
        if (fmt === 'short') {
          name = legacy.split(',')[0].trim();
        } else {
          name = legacy;
        }
      }
    }

    locEl.textContent = name || "";
    if (sepEl) {
      sepEl.style.display = name ? 'inline-block' : 'none';
    }
  }

  function initGeolocationAndZmanim() {
    // Default to Tiberias coordinates if everything fails
    const defaultLat = 32.7940, defaultLon = 35.5312;
    const cachedLat = localStorage.getItem('lastLat');
    const cachedLon = localStorage.getItem('lastLon');

    let startLat = defaultLat, startLon = defaultLon;
    if (cachedLat && !isNaN(parseFloat(cachedLat))) startLat = parseFloat(cachedLat);
    if (cachedLon && !isNaN(parseFloat(cachedLon))) startLon = parseFloat(cachedLon);
    
    fetchZmanim(startLat, startLon);
    fetchWeather(startLat, startLon);
    fetchLocationName(startLat, startLon);

    const updateLocation = (latitude, longitude) => {
      if (!cachedLat || Math.abs(parseFloat(cachedLat) - latitude) > 0.01) {
        localStorage.setItem('lastLat', latitude);
        localStorage.setItem('lastLon', longitude);
        fetchZmanim(latitude, longitude);
        fetchWeather(latitude, longitude);
        fetchLocationName(latitude, longitude);
      }
    };

    // Attempt browser Geolocation first
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(p => {
        updateLocation(p.coords.latitude, p.coords.longitude);
      }, (err) => {
        console.warn("Browser Geolocation failed:", err.message, "- Attempting IP fallback");
        // Fallback to IP-based Geolocation if browser denies/fails (common for local files)
        fetch('https://get.geojs.io/v1/ip/geo.json')
          .then(res => res.json())
          .then(data => {
            if (data && data.latitude && data.longitude) {
              updateLocation(parseFloat(data.latitude), parseFloat(data.longitude));
              let longName = "";
              let shortName = "";
              if (data.city) {
                shortName = data.city;
                if (data.region) {
                  longName = `${data.city}, ${data.region}`;
                } else {
                  longName = data.city;
                }
              }
              if (longName && shortName) {
                localStorage.setItem('locationLong', longName);
                localStorage.setItem('locationShort', shortName);
                updateLocationDisplay();
              }
            }
          }).catch(e => console.error("IP Fallback failed:", e));
      }, { timeout: 10000 });
    } else {
      // Fallback for strict context blocks
      fetch('https://get.geojs.io/v1/ip/geo.json')
        .then(res => res.json())
        .then(data => {
          if (data && data.latitude && data.longitude) {
            updateLocation(parseFloat(data.latitude), parseFloat(data.longitude));
            let longName = "";
            let shortName = "";
            if (data.city) {
              shortName = data.city;
              if (data.region) {
                longName = `${data.city}, ${data.region}`;
              } else {
                longName = data.city;
              }
            }
            if (longName && shortName) {
              localStorage.setItem('locationLong', longName);
              localStorage.setItem('locationShort', shortName);
              updateLocationDisplay();
            }
          }
        }).catch(e => console.error("IP Fallback failed:", e));
    }
  }

  function buildZmanimChecklist() {
    const c = document.getElementById('zmanimChecklist'); if (!c) return; c.innerHTML = '';
    const toggleBtn = document.createElement('button');
    toggleBtn.type = "button";
    toggleBtn.textContent = "Enable/Disable All";
    toggleBtn.style.gridColumn = "1 / -1";
    toggleBtn.style.marginBottom = "10px";
    toggleBtn.onclick = (e) => {
      e.stopPropagation();
      const allEnabled = enabledZmanKeys.size === Object.keys(ZMANIM_DB).length;
      if (allEnabled) enabledZmanKeys.clear();
      else enabledZmanKeys = new Set(Object.keys(ZMANIM_DB));
      localStorage.setItem('enabledZmanim', JSON.stringify([...enabledZmanKeys]));
      buildZmanimChecklist();
      updateNextZmanDisplay();
    };
    c.appendChild(toggleBtn);

    for (const [k, m] of Object.entries(ZMANIM_DB)) {
      const l = document.createElement('label');
      l.className = 'zman-check';
      
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = enabledZmanKeys.has(k);
      cb.addEventListener('change', e => {
        if (e.target.checked) enabledZmanKeys.add(k);
        else enabledZmanKeys.delete(k);
        localStorage.setItem('enabledZmanim', JSON.stringify([...enabledZmanKeys]));
        updateNextZmanDisplay();
      });
      
      const s = document.createElement('span');
      s.textContent = `${m.he} (${m.display})`;
      
      l.appendChild(cb);
      l.appendChild(s);
      c.appendChild(l);
    }
  }

  function saveAndClose() {
    localStorage.layout = layoutSelect.value; localStorage.weatherFmt = weatherFmtSelect.value; localStorage.dateFmt = dateFmtSelect.value; localStorage.font = fontSelect.value;
    localStorage.colorPreset = colorPreset.value; localStorage.customColor = customColor.value; localStorage.bgPreset = bgPreset.value; localStorage.customBg = customBg.value;
    localStorage.weekdaySize = weekdaySizeSelect.value; localStorage.showTimeExtras = showTimeExtrasSelect.value; localStorage.zmanDisplayType = zmanDisplayTypeSelect.value;
    localStorage.showNextZmanPrefix = showNextZmanPrefixSelect.value; localStorage.zmanColorPreset = zmanColorPresetSelect.value; localStorage.zmanCustomColor = zmanCustomColorInput.value;
    localStorage.weatherColorPreset = weatherColorPresetSelect.value; localStorage.weatherCustomColor = weatherCustomColorInput.value; localStorage.showWeatherTimeline = showWeatherTimelineSelect.value;
    localStorage.weatherIconColor = weatherIconColorSelect.value;
    localStorage.weatherIconCustomColor = weatherIconCustomColorInput.value;
    localStorage.glowEnabled = glowEnabledSelect.value;
    localStorage.autoFullscreen = autoFullscreenSelect.value;
    localStorage.urgentStyle = urgentStyleSelect.value;
    localStorage.urgentColor1 = urgentColor1Input.value;
    localStorage.urgentColor2 = urgentColor2Input.value;
    localStorage.urgentFlashSpeed = urgentFlashSpeedInput.value;
    localStorage.showLocation = showLocationSelect.value;
    localStorage.locationFmt = locationFmtSelect.value;
    localStorage.setItem('alarms', JSON.stringify(alarms));
    
    localStorage.showYUMinyanim = document.getElementById('showYUMinyanim').checked;
    localStorage.minyanCount = document.getElementById('minyanCount').value;
    localStorage.urgencyThreshold = document.getElementById('urgencyThreshold').value;
    
    applyThemeAndStyle(); updateTimeAndDate(); updateWeatherDisplay(); fetchYUMinyanim(); updateLocationDisplay(); modal.style.display = 'none';
  }

  function openModalWithCurrentSettings() {
    const defaultLayout = (window.innerWidth <= 1024) ? 'split' : 'retro';
    layoutSelect.value = localStorage.layout || defaultLayout;
    weatherFmtSelect.value = localStorage.weatherFmt || 'extended';
    dateFmtSelect.value = localStorage.dateFmt || 'medium'; fontSelect.value = localStorage.font || "'Inter', 'SF Mono', monospace";
    colorPreset.value = localStorage.colorPreset || '#00e5ff'; customColor.value = localStorage.customColor || '#00e5ff';
    bgPreset.value = localStorage.bgPreset || '#000000'; customBg.value = localStorage.customBg || '#000000';
    weekdaySizeSelect.value = localStorage.weekdaySize || '1.2'; showTimeExtrasSelect.value = localStorage.showTimeExtras || 'true';
    zmanDisplayTypeSelect.value = localStorage.zmanDisplayType || 'time'; showNextZmanPrefixSelect.value = localStorage.showNextZmanPrefix || 'true';
    zmanColorPresetSelect.value = localStorage.zmanColorPreset || 'theme'; zmanCustomColorInput.value = localStorage.zmanCustomColor || '#00e5ff';
    weatherColorPresetSelect.value = localStorage.weatherColorPreset || 'theme'; weatherCustomColorInput.value = localStorage.weatherCustomColor || '#00e5ff';
    showWeatherTimelineSelect.value = localStorage.showWeatherTimeline || 'true';
    weatherIconColorSelect.value = localStorage.weatherIconColor || 'default';
    weatherIconCustomColorInput.value = localStorage.weatherIconCustomColor || '#00e5ff';
    weatherIconCustomColorInput.style.display = (weatherIconColorSelect.value === 'custom') ? 'block' : 'none';
    glowEnabledSelect.value = localStorage.glowEnabled || 'true';
    autoFullscreenSelect.value = localStorage.autoFullscreen || 'true';
    urgentStyleSelect.value = localStorage.urgentStyle || 'flash';
    urgentColor1Input.value = localStorage.urgentColor1 || '#ff0000';
    urgentColor2Input.value = localStorage.urgentColor2 || '#000000';
    urgentFlashSpeedInput.value = localStorage.urgentFlashSpeed || '0.5';
    urgentFlashSettings.style.display = (urgentStyleSelect.value === 'flash' || urgentStyleSelect.value === 'fade') ? 'block' : 'none';
    
    showLocationSelect.value = localStorage.showLocation || 'true';
    locationFmtSelect.value = localStorage.locationFmt || 'long';
    
    document.getElementById('showYUMinyanim').checked = localStorage.showYUMinyanim === 'true';
    document.getElementById('minyanCount').value = localStorage.minyanCount || 3;
    document.getElementById('urgencyThreshold').value = localStorage.urgencyThreshold || 15;

    const s = localStorage.getItem('alarms'); if (s) alarms = JSON.parse(s); createAlarmUI();
    const ez = localStorage.getItem('enabledZmanim');
    if (ez) {
      const parsed = JSON.parse(ez);
      enabledZmanKeys = new Set(parsed.length > 0 ? parsed : Object.keys(ZMANIM_DB));
    } else {
      enabledZmanKeys = new Set(Object.keys(ZMANIM_DB));
    }
    buildZmanimChecklist(); modal.style.display = 'flex';
  }

  function livePreviewAdvanced() {
    if (modal.style.display !== 'flex') return;
    localStorage.weekdaySize = weekdaySizeSelect.value; localStorage.showTimeExtras = showTimeExtrasSelect.value;
    localStorage.zmanColorPreset = zmanColorPresetSelect.value; localStorage.zmanCustomColor = zmanCustomColorInput.value;
    localStorage.weatherColorPreset = weatherColorPresetSelect.value; localStorage.weatherCustomColor = weatherCustomColorInput.value;
    localStorage.showWeatherTimeline = showWeatherTimelineSelect.value; localStorage.layout = layoutSelect.value;
    localStorage.weatherFmt = weatherFmtSelect.value; localStorage.font = fontSelect.value;
    localStorage.dateFmt = dateFmtSelect.value;
    localStorage.zmanDisplayType = zmanDisplayTypeSelect.value;
    localStorage.showNextZmanPrefix = showNextZmanPrefixSelect.value;
    localStorage.weatherIconColor = weatherIconColorSelect.value;
    localStorage.weatherIconCustomColor = weatherIconCustomColorInput.value;
    localStorage.glowEnabled = glowEnabledSelect.value;
    localStorage.autoFullscreen = autoFullscreenSelect.value;
    localStorage.urgentStyle = urgentStyleSelect.value;
    localStorage.urgentColor1 = urgentColor1Input.value;
    localStorage.urgentColor2 = urgentColor2Input.value;
    localStorage.urgentFlashSpeed = urgentFlashSpeedInput.value;
    localStorage.showLocation = showLocationSelect.value;
    localStorage.locationFmt = locationFmtSelect.value;
    
    localStorage.showYUMinyanim = document.getElementById('showYUMinyanim').checked;
    localStorage.minyanCount = document.getElementById('minyanCount').value;
    localStorage.urgencyThreshold = document.getElementById('urgencyThreshold').value;

    weatherIconCustomColorInput.style.display = (weatherIconColorSelect.value === 'custom') ? 'block' : 'none';
    urgentFlashSettings.style.display = (urgentStyleSelect.value === 'flash' || urgentStyleSelect.value === 'fade') ? 'block' : 'none';
    applyThemeAndStyle(); updateNextZmanDisplay(); updateWeatherDisplay(); updateLocationDisplay();
  }

  function initializeApp() {
    updateLocationDisplay();

    const cached = localStorage.getItem('cachedMinyanim');
    const cachedDate = localStorage.getItem('cachedMinyanimDate');
    const todayStr = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0') + '-' + String(new Date().getDate()).padStart(2, '0');
    if (cached && cachedDate === todayStr) {
      try {
        minyanimData = JSON.parse(cached, (key, value) => {
          if (key === 'parsedTime') return new Date(value);
          return value;
        });
      } catch(e) {}
    }

    fetchYUMinyanim();
    const ez = localStorage.getItem('enabledZmanim');
    if (ez) {
      const parsed = JSON.parse(ez);
      enabledZmanKeys = new Set(parsed.length > 0 ? parsed : Object.keys(ZMANIM_DB));
    } else {
      enabledZmanKeys = new Set(Object.keys(ZMANIM_DB));
    }
    applyThemeAndStyle(); updateTimeAndDate(); setInterval(updateTimeAndDate, 1000);
    setInterval(() => { initGeolocationAndZmanim(); }, 10*60000);
    setInterval(fetchYUMinyanim, 15*60000);
    initGeolocationAndZmanim();

    const autoFsHandler = () => {
      if (localStorage.autoFullscreen !== 'false' && !document.fullscreenElement && !document.webkitFullscreenElement) {
        toggleFullscreen();
      }
      document.removeEventListener('click', autoFsHandler);
    };
    document.addEventListener('click', autoFsHandler);
  }

  async function toggleFullscreen() {
    const doc = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (doc.requestFullscreen) doc.requestFullscreen();
      else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitFullscreen();
    }
  }

  gearBtn.addEventListener('click', openModalWithCurrentSettings);
  saveBtn.addEventListener('click', saveAndClose);
  document.getElementById('addAlarm').addEventListener('click', window.addAlarm);
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  advBtn.addEventListener('click', () => { advancedDiv.style.display = (advancedDiv.style.display === 'block' ? 'none' : 'block'); advBtn.textContent = (advancedDiv.style.display === 'block' ? '▲ Hide' : '⚡ Advanced'); });
  modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
  document.body.addEventListener('click', e => { if (document.body.classList.contains('alarm-active')) { document.body.classList.remove('alarm-active'); if (activeAlarmTimeout) clearTimeout(activeAlarmTimeout); return; } if (modal.style.display !== 'flex' && !e.target.closest('.panel') && !e.target.closest('#gear')) document.body.classList.toggle('hidden-ui'); });
  [weekdaySizeSelect, showTimeExtrasSelect, zmanColorPresetSelect, weatherColorPresetSelect, showWeatherTimelineSelect, layoutSelect, weatherFmtSelect, fontSelect, weatherIconColorSelect, glowEnabledSelect, autoFullscreenSelect, urgentStyleSelect, dateFmtSelect, zmanDisplayTypeSelect, showNextZmanPrefixSelect, document.getElementById('showYUMinyanim'), showLocationSelect, locationFmtSelect].forEach(s => s.addEventListener('change', livePreviewAdvanced));
  [zmanCustomColorInput, weatherCustomColorInput, weatherIconCustomColorInput, urgentColor1Input, urgentColor2Input, urgentFlashSpeedInput, document.getElementById('minyanCount'), document.getElementById('urgencyThreshold')].forEach(i => i.addEventListener('input', livePreviewAdvanced));
  initializeApp();
</script>
</body>
</html>
