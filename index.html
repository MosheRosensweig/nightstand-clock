<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nightstand Clock V5 | Zmanim Ambient Clock</title>
<script src="https://cdn.jsdelivr.net/npm/@hebcal/core@latest/dist/bundle.min.js"></script>
<style>
  /* ----- GLOBAL RESET & DESIGN SYSTEM ----- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }

  :root {
    --fg: #00e5ff;
    --bg: #000000;
    --transition-smooth: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    --card-radius: 28px;
    --btn-radius: 44px;
    --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.5);
    /* dynamic sizes */
    --weekday-scale: 1.2;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', 'SF Mono', 'Fira Code', monospace;
    height: 100vh;
    display: flex;
    justify-content: safe center;
    align-items: safe center;
    overflow: hidden;
    transition: background 0.25s ease, color 0.2s ease;
    padding: 0;
  }

  /* gear icon */
  #gear {
    position: fixed;
    top: 22px;
    right: 24px;
    font-size: 28px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 60px;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
    transition: var(--transition-smooth);
    z-index: 200;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  }

  #gear:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.03) rotate(8deg);
    border-color: var(--fg);
  }

  .hidden-ui #gear {
    display: none;
  }

  /* main clock container */
  #clock {
    text-align: center;
    width: 100%;
    height: 100%;
    max-width: 1400px;
    max-height: 100vh;
    max-height: 100dvh;
    overflow-y: auto;
    scrollbar-width: none;
    display: flex;
    flex-direction: column;
    justify-content: safe center;
    align-items: center;
    padding: 2vh;
    box-sizing: border-box;
    transform-origin: center center;
    transition: transform 0.1s ease-out;
  }
  #clock::-webkit-scrollbar { display: none; }

  /* TIME LINE */
  .time-line {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 0.15em;
  }
  .main-hour-minute {
    font-size: 1em;
    font-weight: inherit;
    line-height: 0.8;
    display: block;
  }
  .time-extras {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.35em;
    text-align: left;
    margin: 0;
    padding: 0;
  }
  .ampm-indicator {
    opacity: 1;
    font-weight: 500;
    line-height: 0.7;
  }
  .seconds-sm {
    opacity: 1;
    font-weight: 400;
    line-height: 0.7;
  }
  .time-extras.hide-extras {
    display: none;
  }

  /* Base styles replaced by .weekday-container */

  /* Layout styles */
  .retro .time-line { font-size: 18vw; }
  .retro .main-hour-minute, .retro .time-extras, .retro .date, .retro .weekday-container { font-weight: 700; }
  .glow-on .retro .main-hour-minute, .glow-on .retro .time-extras, .glow-on .retro .date, .glow-on .retro .weekday-container { text-shadow: 0 0 8px currentColor; }
  
  .simple .time-line { font-size: 14vw; }
  .simple .main-hour-minute { font-weight: 400; }
  .minimal .time-line { font-size: 12vw; }
  .minimal .main-hour-minute { font-weight: 300; }
  
  .split .time-line, .custom .time-line { font-size: 13vw; }
  .split .main-hour-minute, .split .time-extras, .split .date, .split .weekday-container,
  .custom .main-hour-minute, .custom .time-extras, .custom .date, .custom .weekday-container {
    font-weight: 600;
    color: var(--fg);
    background: none;
    -webkit-background-clip: initial;
    background-clip: initial;
  }
  .glow-on .split .main-hour-minute, .glow-on .split .time-extras, .glow-on .split .date, .glow-on .split .weekday-container,
  .glow-on .custom .main-hour-minute, .glow-on .custom .time-extras, .glow-on .custom .date, .glow-on .custom .weekday-container {
    text-shadow: 0 0 12px var(--fg), 0 0 24px rgba(0, 229, 255, 0.4);
  }
  .glow-on .split .time-extras, .glow-on .custom .time-extras {
    text-shadow: 0 0 8px var(--fg);
  }

  /* Split View Specific Layout (Mobile Landscape) & Custom Layout */
  .split#clock, .custom#clock {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    gap: 0;
  }
  .split .weekday-container, .custom .weekday-container {
    order: 1;
    margin-bottom: 3vh;
    margin-right: 20px;
  }
  .split .date, .custom .date {
    order: 2;
    margin-top: 0;
    margin-bottom: 3vh;
    font-size: calc(2.2vw * var(--weekday-scale));
  }
  .split .time-line, .custom .time-line {
    order: 3;
    width: 100%;
    margin-bottom: 4vh;
  }
  .split .weather, .split .next-zman, .split .weather-timeline,
  .custom .weather, .custom .next-zman, .custom .weather-timeline {
    order: 4;
    margin-top: -1vh; /* Nudge up */
  }
  
  /* Sidebar Hub Layout */
  .sidebar#clock {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: 1fr 0 auto 0 1fr;
    grid-template-areas:
      ". . ."
      ". weekday ."
      "weather timeline zmanim"
      ". date ."
      "hourly hourly hourly";
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 0;
    margin: 0;
    gap: 0;
  }
  .sidebar .weekday-container {
    grid-area: weekday;
    transform: translateY(-3vh);
    justify-self: center;
    display: flex;
    align-items: center;
  }
  .sidebar .weekday-container span {
    font-size: min(4vw, 5vh);
  }
  .sidebar .time-line {
    grid-area: timeline;
    font-size: min(15vw, 25vh);
    justify-self: center;
    display: flex;
    position: relative;
    align-items: center;
  }
  .sidebar .main-hour-minute { line-height: 0.8; }
  .sidebar .time-extras {
    position: absolute;
    left: 100%;
    margin-left: 0.1em;
    height: 70%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.35em;
  }
  .sidebar #date { grid-area: date; transform: translateY(3vh); font-size: min(3.5vw, 4vh); justify-self: center; line-height: 0; }
  .sidebar #weather {
    grid-area: weather;
    justify-self: end;
    margin-right: 3vw;
    flex-direction: column;
    align-items: center;
    background: rgba(255,255,255,0.05);
    padding: 3vh 2vw;
    border-radius: 32px;
    font-size: min(2.5vw, 3.5vh);
    gap: 12px;
    height: auto;
    justify-content: center;
    max-width: 25vw;
  }
  .sidebar #nextZman {
    grid-area: zmanim;
    justify-self: start;
    margin-left: 3vw;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    background: rgba(255,255,255,0.05);
    padding: 3vh 2vw;
    border-radius: 32px;
    font-size: min(2vw, 3vh);
    gap: 8px;
    height: auto;
    border: none;
    text-align: left;
    max-width: 25vw;
    overflow: hidden;
  }
  .sidebar .weather-timeline {
    grid-area: hourly;
    position: absolute;
    bottom: 2vh;
    left: 2vw;
    right: 2vw;
    width: auto;
    margin: 0;
  }
  .sidebar .weather-stack { border-left: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 8px 0 0 0; margin: 0; align-items: center; width: 100%; }
  .sidebar .weather-rain { border-left: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 8px 0 0 0; margin: 0; width: 100%; text-align: center; }
  /* sidebar middle columns: hard cap so tall boxes (weather details) can never
     reach the absolute-pinned hourly timeline bar at the bottom */
  .sidebar #nextZman, .sidebar #yuMinyanim {
    max-height: 58vh;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .sidebar #nextZman::-webkit-scrollbar, .sidebar #yuMinyanim::-webkit-scrollbar { width: 4px; }
  .sidebar #nextZman::-webkit-scrollbar-thumb, .sidebar #yuMinyanim::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }

  /* Phone View Layout */
  .phone#clock {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto auto auto auto;
    grid-template-areas:
      "weekday"
      "timeline"
      "date"
      "zmanim"
      "weather"
      "hourly";
    align-items: center;
    justify-items: center;
    width: 100vw;
    height: 100vh;
    padding: 1.5vh;
    gap: 8px;
    overflow-y: auto;
  }
  .phone .weekday-container {
    grid-area: weekday;
    margin-bottom: 0;
    display: flex;
    align-items: center;
  }
  .phone .weekday-container span {
    font-size: min(8vw, 5vh);
    line-height: 1.2;
  }
  .phone .time-line { grid-area: timeline; font-size: min(22vw, 18vh); position: relative; margin: 5px 0; }
  .phone .main-hour-minute { line-height: 0.9; }
  .phone .time-extras {
    position: absolute;
    left: 100%;
    margin-left: 0.2em;
    height: 80%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.25em;
  }
  .phone #date { grid-area: date; font-size: min(5vw, 3.5vh); margin: 0; }
  .phone #weather {
    grid-area: weather;
    flex-direction: row;
    background: rgba(255,255,255,0.05);
    padding: 12px 20px;
    border-radius: 60px;
    font-size: min(3.5vw, 2.5vh);
    max-width: 90vw;
    width: auto;
    gap: 15px;
    margin-top: 5px;
  }
  .phone #nextZman {
    grid-area: zmanim;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.4);
    padding: 12px 15px;
    border-radius: 24px;
    font-size: 1rem;
    max-width: 95vw;
    width: auto;
    border: 1px solid rgba(0, 229, 255, 0.15);
    text-align: left;
    align-items: center;
    overflow: hidden;
  }
  .phone .weather-timeline { grid-area: hourly; display: block; margin: 10px 0 0 0; width: 95vw; }
  .phone .weather-stack { border-left: 1px solid rgba(255,255,255,0.1); padding-left: 10px; margin-left: 0; flex-direction: column; display: flex; }
  .phone .weather-rain { border-left: 1px solid rgba(255,255,255,0.1); padding-left: 10px; margin-left: 0; font-size: 0.85em; display: flex; align-items: center; }

  /* Theme filter for icons */
  .theme-icon-filter {
    filter: grayscale(100%) brightness(1.5) sepia(1) hue-rotate(170deg) saturate(10);
  }

  .weather-icon-colored {
    color: transparent !important;
    text-shadow: 0 0 0 var(--weather-icon-color);
    display: inline-block;
  }

  @media (max-width: 640px) {
    .sidebar#clock {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "weekday weekday"
        "timeline timeline"
        "date date"
        "weather zmanim"
        "hourly hourly";
      font-size: 3.5vw;
      gap: 10px;
    }
    .sidebar #weather, .sidebar #nextZman { font-size: 3.5vw; padding: 12px; height: auto; }
    .sidebar .time-line { font-size: 18vw; margin: 0; }
  }
  
  .weekday-container {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: calc(2.2vw * var(--weekday-scale));
    font-weight: 500;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-transform: uppercase;
    transition: font-size 0.1s ease;
  }
  .weekday {
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
  }
  .weekday-container #location {
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
  }
  .date {
    font-size: 2.8vw;
    margin-top: 18px;
    font-weight: 400;
  }
  .weather {
    margin-top: 24px;
    font-size: 2.2vw;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(8px);
    display: inline-flex;
    align-items: center;
    padding: 10px 28px;
    border-radius: 60px;
    gap: 12px;
    color: var(--weather-fg, var(--fg));
  }
  .weather-stack {
    display: flex;
    flex-direction: column;
    font-size: 0.7em;
    line-height: 1.1;
    text-align: left;
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
  }
  .weather-rain {
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .rain-gauge {
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
  }
  .rain-gauge svg { display: block; }
  .chag-icon {
    display: inline-flex;
    width: 1.15em;
    height: 1.15em;
    vertical-align: -0.2em;
  }
  .chag-icon svg { width: 100%; height: 100%; display: block; }
  /* weather-details box: hard cap so it can never push widgets off-screen */
  .wx-box {
    max-height: 42vh;
    max-width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    width: 100%;
  }
  .wx-box::-webkit-scrollbar { width: 4px; }
  .wx-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }
  .wx-hours {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  /* location-change toast */
  #toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(10, 15, 30, 0.92);
    border: 1px solid var(--fg);
    color: #fff;
    padding: 10px 22px;
    border-radius: 60px;
    font-size: 0.95rem;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 500;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .next-zman {
    margin-top: 20px;
    font-size: 2.2vw;
    background: rgba(0, 150, 200, 0.2);
    backdrop-filter: blur(8px);
    display: inline-block;
    padding: 10px 28px;
    border-radius: 60px;
    font-weight: 500;
    letter-spacing: 0.3px;
    border: 1px solid rgba(0, 229, 255, 0.3);
    transition: all 0.2s;
    color: var(--zman-fg, var(--fg));
  }

  /* MODAL */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(12px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .panel {
    background: #11141fcc;
    backdrop-filter: blur(24px);
    border-radius: 48px;
    padding: 28px 26px;
    width: 90%;
    max-width: 580px;
    max-height: 85vh;
    overflow-y: auto;
    color: #f0f3ff;
    border: 1px solid rgba(0, 230, 255, 0.3);
    box-shadow: var(--shadow-soft);
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-track { background: #1e2335; border-radius: 10px; }
  .panel::-webkit-scrollbar-thumb { background: var(--fg); border-radius: 10px; }

  .panel h2 { font-size: 1.8rem; font-weight: 500; margin-bottom: 20px; border-left: 4px solid var(--fg); padding-left: 16px; }

  label { display: block; margin-top: 18px; margin-bottom: 8px; font-weight: 500; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #bbd4ff; }

  select, input[type="color"], input[type="number"] { width: 100%; padding: 12px 16px; background: rgba(20, 25, 40, 0.9); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 60px; color: white; cursor: pointer; transition: var(--transition-smooth); }

  .zmanim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; background: rgba(20, 25, 40, 0.5); border-radius: 28px; padding: 14px; }
  .zman-check { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 0.9rem; }
  .zman-check input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--fg); }

  .button-group { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; justify-content: space-between; }
  button { background: rgba(30, 35, 55, 0.9); border: 1px solid rgba(0, 229, 255, 0.3); padding: 12px 20px; border-radius: 60px; font-size: 0.9rem; font-weight: 500; color: #eef5ff; cursor: pointer; transition: var(--transition-smooth); flex: 1; text-align: center; }
  button:hover { background: #1f2a46; border-color: var(--fg); transform: translateY(-2px); }
  #save { background: #00b8d4cc; border-color: #00e5ff; font-weight: 600; }

  #advanced { display: none; }
  .tabs { display: flex; gap: 10px; margin-top: 20px; border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; }
  .tab { padding: 8px 16px; cursor: pointer; border-radius: 12px; transition: var(--transition-smooth); font-size: 0.9rem; font-weight: 500; color: #bbd4ff; }
  .tab.active { background: rgba(0, 229, 255, 0.2); color: var(--fg); border: 1px solid rgba(0, 229, 255, 0.4); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* WEATHER TIMELINE BAR */
  .weather-timeline {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    display: none;
    padding: 15px 0;
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .weather-timeline::-webkit-scrollbar { display: none; }
  .weather-timeline-inner { display: flex; gap: 20px; padding: 0 20px; width: max-content; }
  .timeline-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.9rem; min-width: 60px; }
  .timeline-time { opacity: 1; font-size: 0.9rem; }
  .timeline-temp { font-weight: 600; }
  .timeline-icon { font-size: 1.2rem; }
  .night-moon { filter: grayscale(100%) brightness(1000%); display: inline-block; }

  /* ALARMS */
  .alarm-item { background: rgba(20, 25, 40, 0.5); border-radius: 20px; padding: 16px; margin-top: 12px; border: 1px solid rgba(0, 229, 255, 0.1); }
  .alarm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .alarm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .alarm-input-group { display: flex; flex-direction: column; gap: 4px; }
  .alarm-input-group input { padding: 8px 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 10px; color: white; }
  .remove-alarm { color: #ff3b30; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; font-weight: 600; }

  @keyframes alarmFlash { 0%, 49% { background: #000000; color: #ffffff; } 50%, 100% { background: #ffffff; color: #000000; } }
  .alarm-active { animation: alarmFlash var(--flash-speed, 0.5s) infinite; }

  @keyframes redWave {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes urgentFlash {
    0%, 49% { background-color: var(--urgent-c1, #ff0000); color: white; }
    50%, 100% { background-color: var(--urgent-c2, #000000); color: white; }
  }
  @keyframes urgentFade {
    0%, 100% {
      background-color: var(--urgent-c1, #ff0000);
      border-color: var(--urgent-c1);
      box-shadow: 0 0 20px var(--urgent-c1);
    }
    50% {
      background-color: var(--urgent-c2, #000000);
      border-color: var(--urgent-c2);
      box-shadow: 0 0 5px var(--urgent-c2);
    }
  }
  .urgent-zman {
    background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.3), transparent);
    background-size: 200% 100%;
    animation: redWave 4s infinite linear;
    border: 1px solid #ff3b30;
    box-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
    transition: background 0.3s, border-color 0.3s;
  }
  .urgent-zman.flash-mode {
    background: none;
    animation: urgentFlash var(--urgent-speed, 0.5s) step-end infinite !important;
    border: 1px solid var(--urgent-c1) !important;
  }
  .urgent-zman.fade-mode {
    background: none;
    animation: urgentFade var(--urgent-speed, 0.5s) ease-in-out infinite !important;
  }

  @media (max-width: 640px) {
    .date { font-size: 6vw; }
    .weather { font-size: 4vw; padding: 1vh 4vw; margin-top: 2vh; }
    .next-zman { font-size: 4vw; padding: 1vh 4vw; margin-top: 2vh; }
    .weekday-container { font-size: calc(6vw * var(--weekday-scale)); margin-bottom: 3vh; }
    .split .weekday-container, .custom .weekday-container { margin-bottom: 3vh; }
    .retro .time-line { font-size: 22vw; }
    .simple .time-line { font-size: 18vw; }
    .minimal .time-line { font-size: 14vw; }
    .split .time-line, .custom .time-line { font-size: 16vw; }
  }

  /* Draggable highlight style for custom view elements during drag-and-drop operations */
  .draggable-highlight {
    outline: 2px dashed var(--fg);

  const draggableIds = ['weekdayContainer', 'timeLine', 'date', 'weather', 'weatherMain', 'weatherHiLo', 'weatherRain', 'weatherTimeline', 'nextZman', 'yuMinyanim'];
  let pressTimer = null;
  let activeDraggedEl = null;
  let isDraggingComponent = false;
  let dragStartPos = { x: 0, y: 0 };
  let elemStartOffset = { x: 0, y: 0 };

  function initDragHandlers() {
    draggableIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;

      const onStart = (e) => {
        const layout = localStorage.layout || 'retro';
        if (layout !== 'custom') return;
        if (modal.style.display === 'flex') return;

        if (e.type === 'mousedown' && e.button !== 0) return;

        const touch = e.touches && e.touches[0];
        const clientX = touch ? touch.clientX : e.clientX;
        const clientY = touch ? touch.clientY : e.clientY;

        dragStartPos = { x: clientX, y: clientY };
        elemStartOffset = { x: componentOffsets[id].x, y: componentOffsets[id].y };

        if (pressTimer) clearTimeout(pressTimer);

        pressTimer = setTimeout(() => {
          activeDraggedEl = el;
          isDraggingComponent = true;
          el.classList.add('draggable-highlight');
          el.style.cursor = 'grabbing';
          el.style.transform = `translate(${componentOffsets[id].x}px, ${componentOffsets[id].y}px) scale(1.03)`;
          if (navigator.vibrate) navigator.vibrate(50);
        }, 500);
      };

      const onMove = (e) => {
        const touch = e.touches && e.touches[0];
        const clientX = touch ? touch.clientX : e.clientX;
        const clientY = touch ? touch.clientY : e.clientY;

        if (pressTimer && !isDraggingComponent) {
          const dx = clientX - dragStartPos.x;
          const dy = clientY - dragStartPos.y;
          if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        }

        if (isDraggingComponent && activeDraggedEl === el) {
          if (e.cancelable) e.preventDefault();
          const dx = clientX - dragStartPos.x;
          const dy = clientY - dragStartPos.y;

          const scaleAdjustedDx = dx / clockScale;
          const scaleAdjustedDy = dy / clockScale;

          componentOffsets[id].x = elemStartOffset.x + scaleAdjustedDx;
          componentOffsets[id].y = elemStartOffset.y + scaleAdjustedDy;

          el.style.transform = `translate(${componentOffsets[id].x}px, ${componentOffsets[id].y}px) scale(1.03)`;
        }
      };

      const onEnd = () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }

        if (isDraggingComponent && activeDraggedEl === el) {
          el.classList.remove('draggable-highlight');
          el.style.cursor = 'grab';
          el.style.transform = `translate(${componentOffsets[id].x}px, ${componentOffsets[id].y}px)`;
          isDraggingComponent = false;
          activeDraggedEl = null;
          localStorage.setItem('custom_component_positions', JSON.stringify(componentOffsets));
        }
      };

      el.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      el.addEventListener('touchstart', onStart, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
      window.addEventListener('touchcancel', onEnd);
    });
  }

  async function fetchYUMinyanim() {
    const currentFetchId = ++fetchCounter;
    isFetchingMinyanim = true;
    updateNextZmanDisplay();

    const now = new Date();
    const dateToday = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    const tom = new Date(now); tom.setDate(tom.getDate() + 1);
    const dateTom = tom.getFullYear() + '-' + String(tom.getMonth() + 1).padStart(2, '0') + '-' + String(tom.getDate()).padStart(2, '0');

    const configs = [
      { url: 'https://www.yuzmanim.com/shacharis', date: dateToday },
      { url: 'https://www.yuzmanim.com/mincha', date: dateToday },
      { url: 'https://www.yuzmanim.com/maariv', date: dateToday },
      { url: 'https://www.yuzmanim.com/shacharis?date=' + dateTom, date: dateTom },
      { url: 'https://www.yuzmanim.com/mincha?date=' + dateTom, date: dateTom },
      { url: 'https://www.yuzmanim.com/maariv?date=' + dateTom, date: dateTom }
    ];

    try {
      const fetchResults = await Promise.all(configs.map(async (c) => {
        // Primary proxy, then fallback proxy (no public YU API exists — see YUZMANIM_API.md)
        const proxies = [
          `https://api.allorigins.win/get?url=${encodeURIComponent(c.url)}`,
          `https://corsproxy.io/?url=${encodeURIComponent(c.url)}`
        ];
        for (const proxyUrl of proxies) {
          try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 15000);
            const resp = await fetch(proxyUrl, { signal: ctrl.signal });
            clearTimeout(timer);
            if (!resp.ok) continue;
            if (proxyUrl.includes('allorigins')) {
              const data = await resp.json();
              if (!data || !data.contents) continue;
              return parseMinyanimFromHTML(data.contents, c.date, now);
            }
            const html = await resp.text();
            if (!html || html.length < 500) continue;
            return parseMinyanimFromHTML(html, c.date, now);
          } catch (e) { /* try next proxy */ }
        }
        return [];
      }));

      if (currentFetchId !== fetchCounter) return;

      let allMinyanim = [].concat(...fetchResults);
      let uniqueMinyanim = [];
      
      allMinyanim.forEach(m => {
        const locKey = m.location.toLowerCase().replace(/\s+/g, '');
        const typeKey = m.type.toLowerCase();
        const notesKey = (m.notes || '').toLowerCase();
        const exists = uniqueMinyanim.some(u =>
          u.type.toLowerCase() === typeKey &&
          u.location.toLowerCase().replace(/\s+/g, '') === locKey &&
          (u.notes || '').toLowerCase() === notesKey &&
          Math.abs(u.parsedTime - m.parsedTime) < 60000
        );
        if (!exists) uniqueMinyanim.push(m);
      });

      uniqueMinyanim.sort((a, b) => a.parsedTime - b.parsedTime);

      const newDataStr = JSON.stringify(uniqueMinyanim);
      const oldDataStr = JSON.stringify(minyanimData);
      
      if (newDataStr !== oldDataStr) {
        minyanimData = uniqueMinyanim;
        localStorage.setItem('cachedMinyanim', newDataStr);
        localStorage.setItem('cachedMinyanimDate', dateToday);
      }

      lastMinyanFetch = Date.now();
      isFetchingMinyanim = false;
      updateNextZmanDisplay();
    } catch (e) {
      if (currentFetchId === fetchCounter) {
        isFetchingMinyanim = false;
        updateNextZmanDisplay();
      }
    }
  }

  function escHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function parseMinyanimFromHTML(html, pageDateStr, now) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    
    const dateParts = pageDateStr.split('-');
    const expectedDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
    const expectedDayName = expectedDate.toLocaleDateString('en-US', { weekday: 'long' });

    const passedSection = doc.getElementById('passed_events');
    const allRows = Array.from(doc.querySelectorAll('.event'));
    const results = [];
    
    const noiseWords = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "January", "February", "March", "April", "June", "July", "August", "September", "October", "November", "December", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const noiseRegex = new RegExp('\\b(' + noiseWords.join('|') + ')\\b', 'i');

    allRows.forEach(row => {
      if (passedSection && passedSection.contains(row)) return;
      if (row.style.color === 'rgb(108, 117, 125)' || row.getAttribute('style')?.includes('#6C757D')) return;

      const rowText = row.textContent || "";
      const mentionedDay = daysOfWeek.find(d => rowText.includes(d));
      if (mentionedDay && mentionedDay !== expectedDayName) return;

      try {
        const typeEl = row.querySelector('.type');
        const locEl = row.querySelector('.post-link') || row.querySelector('i');
        const timeEl = row.querySelector('b');
        
        if (typeEl && timeEl) {
          const type = typeEl.textContent.trim();
          const location = locEl ? locEl.textContent.trim() : "Unknown";
          const timeStr = timeEl.textContent.trim().toUpperCase();
          
          if (location.length < 2 || location.includes("Logout") || location.includes("Menu")) return;
          if (noiseRegex.test(location) && !daysOfWeek.includes(location)) return;

          const dateToUse = pageDateStr || (now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'));
          let parsedTime = parseTimeStringWithDate(timeStr, dateToUse);

          // 4th column holds notes (Haneitz, Ashkenaz, Edot HaMizrach, Selichos…)
          let notes = "";
          try {
            const cols = row.querySelectorAll(':scope > div');
            if (cols.length >= 1) {
              notes = (cols[cols.length - 1].textContent || "").replace(/\s+/g, ' ').trim();
              notes = notes.replace(/\b([\w'’]+)(?:\s+\1\b)+/gi, '$1'); // site repeats notes in nested divs
              if (notes === type || notes === location) notes = "";
              if (notes.length > 60) notes = notes.slice(0, 57) + '…';
            }
          } catch (e) { notes = ""; }
          
          if (parsedTime) {
            results.push({ type, location, timeStr, parsedTime, notes });
          }
        }
      } catch (e) {}
    });
    return results;
  }

  function parseTimeStringWithDate(timeStr, dateStr) {
    const match = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!match) return null;
    let [_, hours, minutes, modifier] = match;
    hours = parseInt(hours, 10);
    minutes = parseInt(minutes, 10);
    if (modifier.toUpperCase() === 'PM' && hours < 12) hours += 12;
    if (modifier.toUpperCase() === 'AM' && hours === 12) hours = 0;
    
    const parts = dateStr.split('-');
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const d = parseInt(parts[2], 10);
    
    return new Date(y, m - 1, d, hours, minutes, 0);
  }

  function isUrgent(date) {
    if (!date) return false;
    const now = new Date();
    const diff = (date - now) / 60000;
    const threshold = parseInt(localStorage.urgencyThreshold || 15);
    return diff >= 0 && diff <= threshold;
  }

  function getWeatherIcon(code, hour = -1, precip = 0, wind = 0) {
    let isNight = false;
    const now = new Date();
    if (currentZmanimData.sunset && currentZmanimData.sunrise) {
      if (hour === -1) {
        isNight = now >= currentZmanimData.sunset || now < currentZmanimData.sunrise;
      } else {
        const sHour = currentZmanimData.sunset.getHours();
        const rHour = currentZmanimData.sunrise.getHours();
        isNight = hour >= sHour || hour < rHour;
      }
    } else {
      if (hour === -1) hour = now.getHours();
      isNight = hour >= 19 || hour <= 6;
    }

    const inten = precipIntensity(precip);
    let icon = "";
    if (code >= 95) icon = "⛈️";
    else if (code >= 71 && code <= 77) icon = (inten.key === 'heavy') ? "❄️❄️" : "❄️";
    else if (code >= 80 && code <= 82) icon = inten.key === 'light' ? "🌦️" : (inten.key === 'heavy' ? "🌧️💧" : "🌧️");
    else if (code >= 61 && code <= 67) icon = inten.key === 'light' ? "🌦️" : (inten.key === 'heavy' ? "🌧️💧" : "🌧️");
    else if (code >= 51 && code <= 55) icon = inten.key === 'heavy' ? "🌧️" : "🌦️";
    else if (code >= 45 && code <= 48) icon = "🌫️";
    else if (code >= 3) icon = "☁️";
    else icon = isNight ? '🌙' : (code >= 1 ? "🌤️" : "☀️");

    icon += windSuffix(wind);

    const iconColorMode = localStorage.weatherIconColor || 'default';
    let classes = [];
    if (iconColorMode !== 'default') {
      classes.push('weather-icon-colored');
    } else {
      if (isNight && icon === '🌙') classes.push('night-moon');
    }
    
    return `<span class="${classes.join(' ')}">${icon}</span>`;
  }

  function updateWeatherTimeline(data) {
    if (!data.hourly) return;
    timelineInner.innerHTML = '';
    const now = new Date(), currentHour = now.getHours();
    for (let i = currentHour; i < currentHour + 24; i++) {
      const temp = data.hourly.temperature_2m[i], code = data.hourly.weathercode[i], timeIndex = i % 24;
      const precip = (data.hourly.precipitation && data.hourly.precipitation[i] != null) ? data.hourly.precipitation[i] : 0;
      const wind = (data.hourly.windspeed_10m && data.hourly.windspeed_10m[i] != null) ? data.hourly.windspeed_10m[i] : 0;
      const displayTime = timeIndex > 12 ? (timeIndex - 12) + "pm" : (timeIndex === 12 ? "12pm" : (timeIndex === 0 ? "12am" : timeIndex + "am"));
      const item = document.createElement('div');
      item.className = 'timeline-item';
      item.innerHTML = `<span class="timeline-time">${displayTime}</span><span class="timeline-icon">${getWeatherIcon(code, timeIndex, precip, wind)}</span><span class="timeline-temp">${Math.round(temp)}°</span>`;
      timelineInner.appendChild(item);
    }
    weatherTimeline.style.display = (localStorage.showWeatherTimeline === 'true') ? 'block' : 'none';
  }

    if (now.getSeconds() === 0) alarms.forEach(a => { if (a.enabled && a.time === timeStr) triggerAlarm(a); });

    let h = now.getHours(), m = now.getMinutes(), ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    mainTimeSpan.textContent = `${h}:${m.toString().padStart(2, '0')}`;
    secondsSmallSpan.textContent = now.getSeconds().toString().padStart(2, '0');
    ampmSpan.textContent = ampm;
    weekdayEl.textContent = now.toLocaleDateString([], { weekday: 'long' }).toUpperCase();
    
    try {
      const chagState = getChagState(now);

      if (chagState.active) {

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371, toRad = d => d * Math.PI / 180;
    const a = Math.sin(toRad(lat2 - lat1) / 2) ** 2
      + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(toRad(lon2 - lon1) / 2) ** 2;

  function precipIntensity(mm) {
    mm = parseFloat(mm) || 0;
    if (mm <= 0) return { key: 'none', label: '', fill: 0 };
    if (mm < 0.5) return { key: 'light', label: 'Light', fill: 0.2 };
    if (mm < 2.5) return { key: 'moderate', label: 'Moderate', fill: 0.5 };
    return { key: 'heavy', label: 'Heavy', fill: 0.95 };
  }

  // Short description of precip type for a given hour (Light rain, Thunderstorm…)
  function precipTypeDesc(code, mm) {
    mm = parseFloat(mm) || 0;
    const q = precipIntensity(mm).label;
    code = parseInt(code, 10);
    if (isNaN(code)) return mm > 0 && q ? `${q} rain` : '';
    if (code >= 95) return q ? `Thunderstorm (${q.toLowerCase()} rain)` : 'Thunderstorm';
    if (code >= 71 && code <= 77) return q ? `${q} snow` : 'Snow';
    if (code >= 80 && code <= 82) return q ? `${q} showers` : 'Showers';
    if (code >= 61 && code <= 67) return q ? `${q} rain` : 'Rain';
    if (code >= 51 && code <= 55) return q ? `${q} drizzle` : 'Drizzle';
    return mm > 0 && q ? `${q} rain` : '';
  }

  function rainStartText(hour) {
    const displayTime = hour > 12 ? (hour - 12) + ":00 PM" : (hour === 12 ? "12:00 PM" : (hour === 0 ? "12:00 AM" : hour + ":00 AM"));

      let endHour = -1;
      for (let i = hour + 1; i < 24; i++) {
        if (!(hourlyPrecipitation[i] > 0)) { endHour = i; break; }

      if (endHour !== -1) {

        txt += ` until ${displayEnd}`;

    if (desc) txt += ` (${desc})`;
    return txt;
  }

  function getHebrewDateParts(d) {

      const g = t => { const p = parts.find(x => x.type === t); return p ? p.value : ''; };
      return { day: parseInt(g('day'), 10) || -1, month: (g('month') || '').trim() };
    } catch (e) { return { day: -1, month: '' }; }
  }

  // kind: 'yomtov' | 'chol' (Chol HaMoed/Hoshana Rabbah) | 'minor'
  function chagForHebrewDate(hd, israel) {
    const m = hd.month, d = hd.day;
    if (!m || d < 0) return null;
    if (m === 'Tishri') {
      if (d === 1 || d === 2) return { kind: 'yomtov', key: 'rh', name: 'Rosh Hashanah', hebrew: 'ראש השנה', iconKey: 'rosh_hashanah' };
      if (d === 10) return { kind: 'yomtov', key: 'yk', name: 'Yom Kippur', hebrew: 'יום כיפור', iconKey: 'yom_kippur' };
      if (d === 15) return { kind: 'yomtov', key: 'sukkos', name: 'Sukkos', hebrew: 'סוכות', iconKey: 'sukkos' };
      if (d === 16) return israel
        ? { kind: 'chol', key: 'cm', name: 'Chol HaMoed Sukkos', hebrew: 'חול המועד', iconKey: 'sukkos_chol' }
        : { kind: 'yomtov', key: 'sukkos', name: 'Sukkos', hebrew: 'סוכות', iconKey: 'sukkos' };
      if (d >= 17 && d <= 20) return { kind: 'chol', key: 'cm', name: 'Chol HaMoed Sukkos', hebrew: 'חול המועד', iconKey: 'sukkos_chol' };
      if (d === 21) return { kind: 'chol', key: 'hr', name: 'Hoshana Rabbah', hebrew: 'הושענא רבה', iconKey: 'hoshana_rabbah' };
      if (d === 22) return israel
        ? { kind: 'yomtov', key: 'st', name: 'Shemini Atzeret / Simchas Torah', hebrew: 'שמיני עצרת', iconKey: 'simchas_torah' }
        : { kind: 'yomtov', key: 'sa', name: 'Shemini Atzeret', hebrew: 'שמיני עצרת', iconKey: 'simchas_torah' };
      if (d === 23 && !israel) return { kind: 'yomtov', key: 'st', name: 'Simchas Torah', hebrew: 'שמחת תורה', iconKey: 'simchas_torah' };
      return null;
    }
    if (m === 'Nisan') {
      if (d === 15) return { kind: 'yomtov', key: 'pesach', name: 'Pesach', hebrew: 'פסח', iconKey: 'pesach' };
      if (d === 16) return israel
        ? { kind: 'chol', key: 'cmp', name: 'Chol HaMoed Pesach', hebrew: 'חול המועד', iconKey: 'pesach_chol' }
        : { kind: 'yomtov', key: 'pesach', name: 'Pesach', hebrew: 'פסח', iconKey: 'pesach' };
      if (d >= 17 && d <= 20) return { kind: 'chol', key: 'cmp', name: 'Chol HaMoed Pesach', hebrew: 'חול המועד', iconKey: 'pesach_chol' };
      if (d === 21) return { kind: 'yomtov', key: 'pesach', name: 'Pesach', hebrew: 'פסח', iconKey: 'pesach' };
      if (d === 22 && !israel) return { kind: 'yomtov', key: 'pesach', name: 'Pesach', hebrew: 'פסח', iconKey: 'pesach' };
      return null;
    }
    if (m === 'Sivan') {
      if (d === 6) return { kind: 'yomtov', key: 'shavuos', name: 'Shavuos', hebrew: 'שבועות', iconKey: 'shavuos' };
      if (d === 7 && !israel) return { kind: 'yomtov', key: 'shavuos', name: 'Shavuos', hebrew: 'שבועות', iconKey: 'shavuos' };
      return null;
    }
    if (m === 'Kislev' && d >= 25) return { kind: 'minor', key: 'chanukah', name: 'Chanukah', hebrew: 'חנוכה', iconKey: 'chanukah' };
    if (m === 'Tevet' && d <= 3) return { kind: 'minor', key: 'chanukah', name: 'Chanukah', hebrew: 'חנוכה', iconKey: 'chanukah' };
    if ((m === 'Adar' || m === 'Adar II') && d === 14) return { kind: 'minor', key: 'purim', name: 'Purim', hebrew: 'פורים', iconKey: 'purim' };
    if ((m === 'Adar' || m === 'Adar II') && d === 15) return { kind: 'minor', key: 'purim', name: 'Shushan Purim', hebrew: 'פורים', iconKey: 'purim' };
    if (m === 'Iyar' && d === 18) return { kind: 'minor', key: 'lag', name: 'Lag BaOmer', hebrew: 'ל״ג בעומר', iconKey: 'lag_baomer' };
    if (m === 'Av' && (d === 9 || d === 10)) return { kind: 'minor', key: 'tisha', name: "Tisha B'Av", hebrew: 'תשעה באב', iconKey: 'tisha_bav' };
    if (m === 'Shevat' && d === 15) return { kind: 'minor', key: 'tubshvat', name: 'Tu BiShvat', hebrew: 'ט״ו בשבט', iconKey: 'tubshevat' };
    if (m === 'Iyar' && (d === 5 || d === 6)) return { kind: 'minor', key: 'atzmaut', name: 'Yom HaAtzmaut', hebrew: 'יום העצמאות', iconKey: 'yom_haatzmaut' };
    return null;
  }

  // Yom Tov / Chol HaMoed currently in effect (sunset-to-nightfall boundaries).
  function getChagState(now) {
    now = now || new Date();
    try {
      const israel = isIsraelTZ();
      const today = chagForHebrewDate(getHebrewDateParts(now), israel);
      const tom = chagForHebrewDate(getHebrewDateParts(new Date(now.getTime() + 24 * 3600 * 1000)), israel);
      const sk = currentZmanimData.sunset;
      const hz = currentZmanimData.tzeit85deg;
      const major = c => c && (c.kind === 'yomtov' || c.kind === 'chol');
      if (major(today)) {
        if (!major(tom)) {
          const end = hz || (sk ? new Date(sk.getTime() + 72 * 60000) : null);
          if (end && now >= end) return { active: false };
        }
        return Object.assign({ active: true, eve: false }, today);
      }
      if (major(tom) && sk && now >= sk) {
        return Object.assign({ active: true, eve: true }, tom);
      }
    } catch (e) {}
    return { active: false };
  }

  // Minor holiday of the current Hebrew day (for the weekday banner only).
  function getMinorTheme(now) {
    try {
      const c = chagForHebrewDate(getHebrewDateParts(now || new Date()), isIsraelTZ());
      return (c && c.kind === 'minor') ? c : null;
    } catch (e) { return null; }
  }

  // ----- Shabbat detection: Fri after shkiah until Sat shkiah + 1 shaah zmanis -----
  function getShaahZmanisMs() {
    try {
      const r = currentZmanimData.sunrise, s = currentZmanimData.sunset;
      if (r && s && s > r) return (s - r) / 12;
    } catch (e) {}
    return 60 * 60 * 1000;
  }

  function getShabbosState(now) {
    now = now || new Date();
    try {
      const day = now.getDay();
      const sk = currentZmanimData.sunset;
      if (day === 5) return { active: !!(sk && now >= sk) };
      if (day === 6) {
        if (!sk) return { active: false };
        return { active: now < new Date(sk.getTime() + getShaahZmanisMs()) };
      }
    } catch (e) {}
    return { active: false };
  }

  function chagBannerHTML(chag) {
    return `<div style="padding: 2px 8px; font-size: 1.1em; color: #ffcc00; font-weight: bold; text-align: center; width: 100%;">${chagIcon(chag.iconKey)} It's ${chag.name} now!</div>`;
  }

  function shabbosBannerHTML() {
    return `<div style="padding: 2px 8px; font-size: 1.1em; color: #ffcc00; font-weight: bold; text-align: center; width: 100%;">🕯️ It's Shabbos now!</div>`;
  }

  // Weather-details box replaces the YU Minyanim box when enabled, or
  // automatically on Shabbos / Yom Tov / Chol HaMoed.
  function shouldShowWeatherDetails(now) {
    now = now || new Date();
    if (localStorage.weatherDetailsBox === 'true') return true;
    try {
      if (getShabbosState(now).active) return true;
      const c = getChagState(now);
      if (c && c.active && (c.kind === 'yomtov' || c.kind === 'chol')) return true;
    } catch (e) {}
    return false;
  }

  function renderWeatherDetails(fSize) {
    const fs = fSize || '0.8em';
    if (lastTemp === null || !lastWeatherData || !lastWeatherData.hourly) {
      return `<div style="padding: 2px 8px; font-size: 0.7em; opacity: 0.6; font-style: italic;">🌤️ Loading weather details...</div>`;
    }
    const H = lastWeatherData.hourly;
    const ch = new Date().getHours();
    const feels = (typeof lastFeelsLike === 'number') ? ` · feels ${Math.round(lastFeelsLike)}°` : '';
    const hum = (typeof lastHumidity === 'number') ? ` · Humidity ${Math.round(lastHumidity)}%` : '';
    let html = `<div style="padding: 2px 8px; border-radius: 8px; font-size: ${fs}; white-space: nowrap;">`
      + `${getWeatherIcon(lastCode, -1, lastPrecip, lastWind)} ${Math.round(lastTemp)}°F${feels}<br>`
      + `<span style="opacity: 0.8;">${conditionTxt}${hum} · 💨 ${Math.round(lastWind)} km/h</span></div>`;
    const nHrs = getWeatherDetailsHours();
    let rows = '';
    for (let k = 0; k < nHrs; k++) {
      const i = ch + k;
      if (!H.temperature_2m || H.temperature_2m[i] == null) break;
      const t = H.temperature_2m[i];
      const code = (H.weathercode && H.weathercode[i] != null) ? H.weathercode[i] : lastCode;
      const pr = (H.precipitation && H.precipitation[i] != null) ? H.precipitation[i] : 0;
      const w = (H.windspeed_10m && H.windspeed_10m[i] != null) ? H.windspeed_10m[i] : 0;
      const pp = (H.precipitation_probability && H.precipitation_probability[i] != null) ? Math.round(H.precipitation_probability[i]) : null;
      const hh = i % 24;
      const label = k === 0 ? 'Now' : (hh > 12 ? (hh - 12) + 'pm' : (hh === 12 ? '12pm' : (hh === 0 ? '12am' : hh + 'am')));
      rows += `<div style="padding: 2px 8px; border-radius: 8px; font-size: ${fs}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${label}: ${getWeatherIcon(code, hh, pr, w)} ${Math.round(t)}°${pp != null ? ` · ${pp}% rain` : ''}</div>`;
    }
    if (rows) html += `<div class="wx-hours">${rows}</div>`;
    return `<div class="wx-box">${html}</div>`;
  }

  // Auto mode sizes the hour count to the viewport so the box never pushes
  // other widgets off-screen (recomputed every refresh; .wx-box caps overflow).
  // When the hourly timeline bar is visible it owns bottom-screen space, so
  // Auto reserves room for it (sidebar pins it absolute at the bottom).
  function getWeatherDetailsHours() {
    const v = localStorage.weatherDetailsHours || 'auto';
    if (v !== 'auto') {
      const n = parseInt(v, 10);
      if (!isNaN(n)) return Math.max(1, Math.min(12, n));
    }
    const h = (typeof window !== 'undefined' && window.innerHeight) || 800;
    let n = h < 500 ? 2 : h < 700 ? 3 : h < 900 ? 4 : 6;
    try {
      const tl = document.getElementById('weatherTimeline');
      if (tl && getComputedStyle(tl).display !== 'none' && tl.offsetHeight > 40) {
        n = Math.max(1, n - (tl.offsetHeight > 110 ? 2 : 1));
      }
    } catch (e) {}
    return n;
  }

  function updateRainInfo() {
    if (!hourlyPrecipitation.length) return;
    const now = new Date();
    const currentHour = now.getHours();
    let rToday = false;
    let currentlyRaining = hourlyPrecipitation[currentHour] > 0;
    
    let firstRainHour = -1;
    let lastRainHour = -1;
    for (let i = 0; i < 24; i++) {
      if (hourlyPrecipitation[i] > 0) {
        rToday = true;
        if (firstRainHour === -1) firstRainHour = i;
        lastRainHour = i;
      }
    }

    if (!rToday) {
      rainInf = "No rain today";
    } else if (currentlyRaining) {
      const showEnd = localStorage.showRainEnd !== 'false';
      let endHour = -1;
      for (let i = currentHour + 1; i < 24; i++) {
        if (!(hourlyPrecipitation[i] > 0)) { endHour = i; break; }
      }
      if (showEnd) {
        if (endHour !== -1) {
          const displayEnd = endHour > 12 ? (endHour - 12) + ":00 PM" : (endHour === 12 ? "12:00 PM" : (endHour === 0 ? "12:00 AM" : endHour + ":00 AM"));
          rainInf = `Raining now until ${displayEnd}`;
        } else {
          const displayLast = lastRainHour > 12 ? (lastRainHour - 12) + ":00 PM" : (lastRainHour === 12 ? "12:00 PM" : (lastRainHour === 0 ? "12:00 AM" : lastRainHour + ":00 AM"));
          rainInf = `Raining now until ${displayLast}`;
        }
      } else {
        rainInf = "Raining Now";
      }
    } else if (currentHour < firstRainHour) {
      rainInf = rainStartText(firstRainHour);
    } else if (currentHour > lastRainHour) {
      rainInf = "No more rain today";
    } else {
      let nextRainHour = -1;
      for (let i = currentHour + 1; i < 24; i++) {
        if (hourlyPrecipitation[i] > 0) {
          nextRainHour = i;
          break;
        }
      }
      if (nextRainHour !== -1) {
        rainInf = rainStartText(nextRainHour);
      } else {
        rainInf = "No more rain today";
      }
    }
    updateWeatherDisplay();
  }

  function updateWeatherDisplay() {
    if (lastTemp === null) {
      if (weatherEl) weatherEl.textContent = "⛅ waiting...";
      if (weatherMainEl) weatherMainEl.textContent = "⛅ waiting...";
      return;
    }
    const fmt = localStorage.weatherFmt || 'extended', icon = getWeatherIcon(lastCode, -1, lastPrecip, lastWind);
    const layout = localStorage.layout || 'sidebar';
    const isSidebar = layout === 'sidebar';
    const isPhone = layout === 'phone';
    weatherTimeline.style.display = (localStorage.showWeatherTimeline !== 'false') ? 'block' : 'none';
    if (lastWeatherData) updateWeatherTimeline(lastWeatherData);
    const showGauge = localStorage.showRainGauge !== 'false';
    const nowH = new Date().getHours();
    const rainingNow = (hourlyPrecipitation.length ? (hourlyPrecipitation[nowH] > 0) : (lastPrecip > 0));
    const gaugeHTML = (showGauge && rainingNow) ? rainDropSVG(precipIntensity(lastPrecip).fill) : '';
    const rainHTML = `<span>${rainInf}</span>${gaugeHTML}`;
    const windHTML = (lastWind >= 15) ? `<span>💨 ${Math.round(lastWind)} km/h</span>` : '';

    if (isSidebar || isPhone) {
      weatherEl.innerHTML = `
        <div style="font-weight: 600;">${icon} ${Math.round(lastTemp)}°F</div>
        <div style="font-size: 0.9em;">${conditionTxt}</div>
        <div class="weather-stack">
          <span>High: ${Math.round(todayH)}°</span>
          <span>Low: ${Math.round(todayL)}°</span>
          ${windHTML}
        </div>
        <div class="weather-rain">${rainHTML}</div>
      `;
    } else {
      if (fmt === 'numbers') weatherEl.innerHTML = `${icon} ${Math.round(lastTemp)}°F`;
      else if (fmt === 'words') weatherEl.innerHTML = `${icon} ${Math.round(lastTemp)}°F · ${conditionTxt}`;
      else weatherEl.innerHTML = `<span>${icon} ${Math.round(lastTemp)}°F</span> <span>${conditionTxt}</span> <div class="weather-stack"><span>High: ${Math.round(todayH)}°</span><span>Low: ${Math.round(todayL)}°</span>${windHTML}</div> <div class="weather-rain">${rainHTML}</div>`;
    }

    if (weatherMainEl) {
      weatherMainEl.innerHTML = `<div style="font-weight: 600;">${icon} ${Math.round(lastTemp)}°F</div><div style="font-size: 0.9em; margin-left: 8px;">${conditionTxt}</div>`;
    }
    if (weatherHiLoEl) {
      weatherHiLoEl.innerHTML = `<div class="weather-stack" style="border-left: none; padding-left: 0; margin-left: 0;"><span>High: ${Math.round(todayH)}°</span><span>Low: ${Math.round(todayL)}°</span>${windHTML}</div>`;
    }
    if (weatherRainEl) {
      weatherRainEl.innerHTML = `<div class="weather-rain" style="border-left: none; padding-left: 0; margin-left: 0;">${rainHTML}</div>`;
    }

    updateWidgetVisibility();
  }

  async function fetchWeather(lat, lon) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 15000);
      const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,precipitation,windspeed_10m,apparent_temperature,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min&hourly=temperature_2m,weathercode,precipitation,windspeed_10m,apparent_temperature,precipitation_probability,relative_humidity_2m&temperature_unit=fahrenheit&timezone=auto`, { signal: ctrl.signal });
      clearTimeout(timer);
      const data = await resp.json();
      lastWeatherData = data;
      if (data.current) {
        lastTemp = data.current.temperature_2m; lastCode = data.current.weathercode;
        lastPrecip = parseFloat(data.current.precipitation) || 0;
        lastWind = parseFloat(data.current.windspeed_10m) || 0;
        lastFeelsLike = (data.current.apparent_temperature != null) ? parseFloat(data.current.apparent_temperature) : null;
        lastHumidity = (data.current.relative_humidity_2m != null) ? parseFloat(data.current.relative_humidity_2m) : null;
        if (data.daily) { todayH = data.daily.temperature_2m_max[0]; todayL = data.daily.temperature_2m_min[0]; }
        updateWeatherTimeline(data);
        if (data.hourly) {
          hourlyPrecipitation = data.hourly.precipitation || [];
          hourlyWind = data.hourly.windspeed_10m || [];
          hourlyCodes = data.hourly.weathercode || [];
          // Prefer current-hour precip so gauge/icon match the rain line
          const ch = new Date().getHours();
          if (hourlyPrecipitation[ch] != null) lastPrecip = parseFloat(hourlyPrecipitation[ch]) || lastPrecip;
          if (hourlyWind[ch] != null) lastWind = parseFloat(hourlyWind[ch]) || lastWind;
          updateRainInfo();
        }
        const c = lastCode;
        const inten = precipIntensity(lastPrecip);
        const q = inten.label; // Light / Moderate / Heavy / ''
        if (c === 0) conditionTxt = "Clear sky";
        else if (c <= 2) conditionTxt = "Mainly clear";
        else if (c === 3) conditionTxt = "Overcast";
        else if (c <= 48) conditionTxt = "Foggy";
        else if (c <= 55) conditionTxt = q ? `${q} drizzle` : "Drizzle";
        else if (c <= 67) conditionTxt = q ? `${q} rain` : "Rain";
        else if (c <= 77) conditionTxt = q ? `${q} snow` : "Snow";
        else if (c <= 82) conditionTxt = q ? `${q} showers` : "Showers";
        else conditionTxt = q ? `Thunderstorm (${q.toLowerCase()} rain)` : "Thunderstorm";
        updateWeatherDisplay();
      }
    } catch(e) { weatherEl.textContent = "🌡️ offline"; }
  }

  function fetchZmanim(lat, lon, specificDate = null) {
    const latNum = parseFloat(lat);
    const lonNum = parseFloat(lon);
    
    if (isNaN(latNum) || isNaN(lonNum)) {
      console.warn("Invalid coordinates for zmanim:", lat, lon);
      return;
    }

    const h = window.hebcal || (typeof hebcal !== 'undefined' ? hebcal : undefined);
    if (!h || !h.Location || !h.Zmanim) {
      zmanimError = "⚠️ Library loading...";
      nextZmanEl.textContent = zmanimError;
      return;
    }

    try {
      const d = specificDate || new Date();
      const tzid = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Jerusalem";
      
      const gloc = new h.Location(latNum, lonNum, false, tzid);
      const zmanim = new h.Zmanim(gloc, d);
      
      const safeGet = (methodName, ...args) => {
        try {
          if (typeof zmanim[methodName] !== 'function') return null;
          const res = zmanim[methodName](...args);
          return res ? new Date(res) : null;
        } catch(e) {
          return null;
        }
      };

      currentZmanimData = {
        alotHaShachar: safeGet('alotHaShachar'),
        misheyakir: safeGet('misheyakir'),
        sunrise: safeGet('sunrise'),
        sofZmanShmaMGA: safeGet('sofZmanShmaMGA'),
        sofZmanShma: safeGet('sofZmanShma'),
        sofZmanTfilla: safeGet('sofZmanTfilla'),
        chatzot: safeGet('chatzot'),
        minchaGedola: safeGet('minchaGedola'),
        plagHaMincha: safeGet('plagHaMincha'),
        sunset: safeGet('shkiah'),
        earliestShemaSchachter: safeGet('tzeit', 6.0),
        candleLighting: safeGet('candleLighting'),
        tzeit85deg: safeGet('tzeit')
      };

      zmanimError = null;
      updateNextZmanDisplay();
    } catch (e) {
      zmanimError = "⚠️ Calculation error";
      nextZmanEl.textContent = zmanimError;
    }
  }

  function updateNextZmanDisplay() {
    const now = new Date();
    const day = now.getDay();
    const layout = localStorage.layout || (window.innerWidth <= 1024 ? 'split' : 'retro');
    const isSidebar = layout === 'sidebar';
    const isPhone = layout === 'phone';
    const isSplit = layout === 'split' || layout === 'custom';

    if (!Object.keys(currentZmanimData).length && minyanimData.length === 0 && !isFetchingMinyanim) {
      nextZmanEl.textContent = "📅 Preparing Zmanim...";
      return;
    }

    if (zmanimError && (!localStorage.showYUMinyanim || localStorage.showYUMinyanim !== 'true')) {
      nextZmanEl.textContent = zmanimError;
      return;
    }

    const mLimit = parseInt(localStorage.minyanCount) || 3;
    const sortedKeys = Object.keys(currentZmanimData)
      .filter(k => currentZmanimData[k] !== null)
      .sort((a,b) => currentZmanimData[a] - currentZmanimData[b]);
      
    const upcomingZmanim = sortedKeys.filter(k => enabledZmanKeys.has(k) && currentZmanimData[k] > now).slice(0, mLimit);
    
    const upcomingMinyanim = (localStorage.showYUMinyanim === 'true')
      ? minyanimData.filter(m => m.parsedTime > now).slice(0, mLimit)
      : [];

    const uStyle = localStorage.urgentStyle || 'flash';

    const isSepMinyanim = layout === 'custom' && localStorage.separateMinyanim === 'true';

    const wxBox = shouldShowWeatherDetails(now);

    if (localStorage.showYUMinyanim === 'true' && !isSepMinyanim && (upcomingZmanim.length > 0 || upcomingMinyanim.length > 0)) {
      const maxRows = isSplit ? 3 : Math.max(upcomingZmanim.length, upcomingMinyanim.length, 1);
      const rowCount = Math.min(maxRows, mLimit);
      
      const gridGap = isPhone || isSplit ? "8px" : "15px";
      const minWidth = isPhone ? "90vw" : (isSplit ? "350px" : "320px");
      const fontSize = isPhone || isSplit ? "0.7em" : "0.8em";
      
      let html = `<div style="display: grid; grid-template-columns: 1fr 1px 1.2fr; gap: ${gridGap}; align-items: start; min-width: ${minWidth};">`;
      
      html += `<div style="display: flex; flex-direction: column; gap: 2px;">`;
      if (!isSplit) html += `<div style="font-size: 0.55em; opacity: 0.5; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; text-align: left; padding-left: 8px;">🕯️ Zmanim</div>`;
      for (let i = 0; i < rowCount; i++) {
        const key = upcomingZmanim[i];
        if (key) {
          const time = currentZmanimData[key];
          const timeStr = time.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
          let urgentClass = isUrgent(time) ? 'urgent-zman' : '';
          if (urgentClass) {
            if (uStyle === 'flash') urgentClass += ' flash-mode';
            else if (uStyle === 'fade') urgentClass += ' fade-mode';
          }
          html += `<div class="${urgentClass}" style="padding: 2px 8px; border-radius: 8px; white-space: nowrap; font-size: ${fontSize};">${ZMANIM_DB[key].icon} ${timeStr}: ${ZMANIM_DB[key].he}</div>`;
        } else if (i < upcomingMinyanim.length && i < rowCount) {
          html += `<div style="padding: 2px 8px; opacity: 0; font-size: ${fontSize};">--</div>`;
        }
      }
      if (upcomingZmanim.length === 0) html += `<div style="padding: 2px 8px; font-size: 0.7em; opacity: 0.6;">No more zmanim</div>`;
      html += `</div>`;
      
      html += `<div style="background: rgba(255,255,255,0.1); align-self: stretch; margin: 2px 0;"></div>`;
      
      html += `<div style="display: flex; flex-direction: column; gap: 2px; overflow: hidden;">`;
      if (!isSplit) html += `<div style="font-size: 0.55em; opacity: 0.5; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; text-align: left; padding-left: 8px;">${wxBox ? '🌤️ Weather Details' : '🕍 YU Minyanim'}</div>`;

      const cl = currentZmanimData.candleLighting;
      const sk = currentZmanimData.sunset;
      const hz = currentZmanimData.tzeit85deg;
      const chagState = getChagState(now);
      const shabState = getShabbosState(now);
      const minyanListHTML = () => renderMinyanimList(upcomingMinyanim, rowCount, fontSize, now, uStyle, upcomingZmanim);
      const minyanEmptyHTML = () => {
        if (wxBox) return renderWeatherDetails(fontSize);
        const msg = lastMinyanFetch === 0 ? "Loading schedule..." : "No upcoming Minyanim found";
        return `<div style="padding: 2px 8px; font-size: 0.7em; opacity: 0.6; font-style: italic;">${msg}</div>`;
      };
      const minyanOrWxHTML = () => wxBox ? renderWeatherDetails(fontSize) : minyanListHTML();
      const wxManual = localStorage.weatherDetailsBox === 'true';

      if (wxManual) {
        html += renderWeatherDetails(fontSize);
      } else if (chagState.active) {
        html += chagBannerHTML(chagState);
      } else if (shabState.active && !(day === 6 && hz && now < hz)) {
        html += shabbosBannerHTML();
      } else if (day === 5) {
        const hasRegularMinyanim = !wxBox && upcomingMinyanim.some(m => m.parsedTime.getDate() === now.getDate());
        if (hasRegularMinyanim) {
          html += minyanListHTML();
        } else if (cl && now < cl) {
          html += `<div style="padding: 2px 8px; border-radius: 8px; white-space: nowrap; font-size: ${fontSize};">🕯️ ${cl.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}: Candle Lighting</div>`;
          if (sk && rowCount > 1) html += `<div style="padding: 2px 8px; border-radius: 8px; white-space: nowrap; font-size: ${fontSize};">🌇 ${sk.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}: Shkiya</div>`;
        } else if (wxBox || upcomingMinyanim.length > 0) {
          html += minyanOrWxHTML();
        } else {
          html += minyanEmptyHTML();
        }
      } else if (day === 6) {
        if (hz && now < hz) {
          html += `<div style="padding: 2px 8px; border-radius: 8px; white-space: nowrap; font-size: ${fontSize};">🌌 ${hz.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}: Havdala Time</div>`;
        } else {
          html += minyanOrWxHTML();
        }
      } else if (upcomingMinyanim.length > 0 || wxBox) {
        html += minyanOrWxHTML();
      } else {
        html += minyanEmptyHTML();
      }
      
      html += `</div>`;
      html += `</div>`;
      
      nextZmanEl.innerHTML = html;
      nextZmanEl.style.display = "inline-block";
      nextZmanEl.style.background = "rgba(0, 0, 0, 0.45)";
      nextZmanEl.style.backdropFilter = "blur(12px)";
      nextZmanEl.style.border = "1px solid rgba(0, 229, 255, 0.25)";
      nextZmanEl.style.padding = isSplit ? "10px 16px" : "14px 20px";

  function renderMinyanimList(list, count, fSize, currNow, style, zmanimList) {
    let listHtml = "";
    for (let i = 0; i < count; i++) {
      const item = list[i];
      if (item) {
        const timeStr = item.parsedTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        const isTom = item.parsedTime.getDate() !== currNow.getDate();
        const tomTxt = isTom ? ' <span style="font-size: 0.8em; opacity: 0.8;">(Tom)</span>' : '';
        const notesTxt = item.notes ? ` <span style="opacity: 0.55; font-size: 0.85em;">· ${escHtml(item.notes)}</span>` : '';
        let urgentClass = isUrgent(item.parsedTime) ? 'urgent-zman' : '';
        if (urgentClass) {
          if (style === 'flash') urgentClass += ' flash-mode';
          else if (style === 'fade') urgentClass += ' fade-mode';
        }
        listHtml += `<div class="${urgentClass}" style="padding: 2px 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: ${fSize};" title="${escHtml(item.type)}: ${escHtml(item.location)}">${escHtml(timeStr)}${tomTxt}: ${escHtml(item.type)} <span style="opacity: 0.7; font-size: 0.9em;">(${escHtml(item.location)})</span>${notesTxt}</div>`;
      } else if (i < zmanimList.length && i < count) {
        listHtml += `<div style="padding: 2px 8px; opacity: 0; font-size: ${fSize};">--</div>`;
      }
    }
    return listHtml;
  }

  async function fetchLocationName(lat, lon) {
    try {
      const resp = await fetch(`https://api-bdc.io/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
      if (resp.ok) {
        const data = await resp.json();
        let longName = "";
        let shortName = "";
        
        const cityOrLocality = data.city || data.locality;
        if (cityOrLocality) {
          shortName = cityOrLocality;
          const statePart = data.principalSubdivisionCode ? data.principalSubdivisionCode.split('-')[1] : null;
          if (statePart) {
            longName = `${cityOrLocality}, ${statePart}`;
          } else if (data.principalSubdivision) {
            longName = `${cityOrLocality}, ${data.principalSubdivision}`;
          } else {
            longName = cityOrLocality;
          }
        } else if (data.principalSubdivision) {
          shortName = data.principalSubdivision;
          longName = data.principalSubdivision;
        }
        
        if (longName && shortName) {
          localStorage.setItem('locationLong', longName);
          localStorage.setItem('locationShort', shortName);
          updateLocationDisplay();
        }
      }
    } catch (e) {
      console.error("Error fetching location name:", e);
    }
  }

  function updateLocationDisplay() {
    const locEl = document.getElementById('location');
    const sepEl = document.getElementById('weekdaySeparator');
    if (!locEl) return;

    const showLoc = localStorage.showLocation !== 'false';
    if (!showLoc) {
      locEl.textContent = "";
      if (sepEl) sepEl.style.display = 'none';
      return;
    }

    const fmt = localStorage.locationFmt || 'long';
    let name = fmt === 'short' ? localStorage.getItem('locationShort') : localStorage.getItem('locationLong');
    if (!name) {
      const legacy = localStorage.getItem('locationName');
      if (legacy) {
        if (fmt === 'short') {
          name = legacy.split(',')[0].trim();
        } else {
          name = legacy;
        }
      }
    }

    locEl.textContent = name || "";
    if (sepEl) {
      sepEl.style.display = name ? 'inline-block' : 'none';
    }
  }

  function initGeolocationAndZmanim() {
    // Default to Tiberias coordinates if everything fails
    const defaultLat = 32.7940, defaultLon = 35.5312;
    const cachedLat = localStorage.getItem('lastLat');
    const cachedLon = localStorage.getItem('lastLon');

    let startLat = defaultLat, startLon = defaultLon;
    if (cachedLat && !isNaN(parseFloat(cachedLat))) startLat = parseFloat(cachedLat);
    if (cachedLon && !isNaN(parseFloat(cachedLon))) startLon = parseFloat(cachedLon);
    
    fetchZmanim(startLat, startLon);
    fetchWeather(startLat, startLon);
    fetchLocationName(startLat, startLon);

  function handleNewPosition(latitude, longitude) {
    const storedLat = parseFloat(localStorage.getItem('lastLat'));
    const storedLon = parseFloat(localStorage.getItem('lastLon'));
    if (isNaN(storedLat) || isNaN(storedLon)) {
      localStorage.setItem('lastLat', latitude);
      localStorage.setItem('lastLon', longitude);
      fetchZmanim(latitude, longitude);
      fetchWeather(latitude, longitude);
      fetchLocationName(latitude, longitude);
      return;
    }
    const movedKm = haversineKm(storedLat, storedLon, latitude, longitude);
    if (movedKm > LOCATION_CHANGE_KM) {
      localStorage.setItem('lastLat', latitude);
      localStorage.setItem('lastLon', longitude);
      fetchZmanim(latitude, longitude);
      fetchWeather(latitude, longitude);
      fetchLocationName(latitude, longitude);
      showToast(`📍 Location changed (~${Math.round(movedKm)} km) — times updated`);
    }
  }

  function ipLocationFallback() {
    // IP-based Geolocation fallback (common for local files / denied GPS)
    fetch('https://get.geojs.io/v1/ip/geo.json')
      .then(res => res.json())
      .then(data => {
        if (data && data.latitude && data.longitude) {
          handleNewPosition(parseFloat(data.latitude), parseFloat(data.longitude));
          let longName = "";
          let shortName = "";
          if (data.city) {
            shortName = data.city;
            if (data.region) {
              longName = `${data.city}, ${data.region}`;
            } else {
              longName = data.city;
            }
          }
          if (longName && shortName) {
            localStorage.setItem('locationLong', longName);
            localStorage.setItem('locationShort', shortName);
            updateLocationDisplay();
          }
        }
      }).catch(e => console.error("IP Fallback failed:", e));
  }

  function startGeoWatch() {
    if (!navigator.geolocation) {
      ipLocationFallback();
      return;
    }
    // One-shot fix (also used by the 10-min refresh)
    navigator.geolocation.getCurrentPosition(p => {
      handleNewPosition(p.coords.latitude, p.coords.longitude);
    }, (err) => {
      console.warn("Browser Geolocation failed:", err.message, "- Attempting IP fallback");
      ipLocationFallback();
    }, { timeout: 10000 });
    // Continuous tracking so travel updates times automatically
    if (geoWatchId === null) {
      try {
        geoWatchId = navigator.geolocation.watchPosition(p => {
          handleNewPosition(p.coords.latitude, p.coords.longitude);
        }, () => {}, { enableHighAccuracy: false, maximumAge: 60000, timeout: 15000 });
      } catch (e) { console.warn("watchPosition unavailable:", e); }
    }
  }

    startGeoWatch();
  }

    const c = document.getElementById('zmanimChecklist'); if (!c) return; c.innerHTML = '';

      else enabledZmanKeys = new Set(Object.keys(ZMANIM_DB));
      localStorage.setItem('enabledZmanim', JSON.stringify([...enabledZmanKeys]));
      buildZmanimChecklist();
      updateNextZmanDisplay();

    c.appendChild(toggleBtn);

    for (const [k, m] of Object.entries(ZMANIM_DB)) {
      const l = document.createElement('label');
      l.className = 'zman-check';
      
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = enabledZmanKeys.has(k);
      cb.addEventListener('change', e => {
        if (e.target.checked) enabledZmanKeys.add(k);
        else enabledZmanKeys.delete(k);
        localStorage.setItem('enabledZmanim', JSON.stringify([...enabledZmanKeys]));
        updateNextZmanDisplay();
      });
      
      const s = document.createElement('span');
      s.textContent = `${m.he} (${m.display})`;
      
      l.appendChild(cb);
      l.appendChild(s);
      c.appendChild(l);
    }
  }

  function initializeApp() {

    const todayStr = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0') + '-' + String(new Date().getDate()).padStart(2, '0');
    if (cached && cachedDate === todayStr) {
      try {
        minyanimData = JSON.parse(cached, (key, value) => {
          if (key === 'parsedTime') return new Date(value);
          return value;
        });
      } catch(e) {}
    }

    try { fetchYUMinyanim(); } catch(e) { console.error("fetchYUMinyanim error:", e); }

    try {
      const ez = localStorage.getItem('enabledZmanim');
      if (ez) {
        const parsed = JSON.parse(ez);
        enabledZmanKeys = new Set(parsed.length > 0 ? parsed : Object.keys(ZMANIM_DB));
      } else {
        enabledZmanKeys = new Set(Object.keys(ZMANIM_DB));
      }
    } catch(e) {
      console.error("enabledZmanim parse error:", e);
      enabledZmanKeys = new Set(Object.keys(ZMANIM_DB));
    }

    try {
      applyThemeAndStyle();
      clockScale = parseFloat(localStorage.getItem('clockScale')) || 1.0;
      clockTranslateY = parseFloat(localStorage.getItem('clockTranslateY')) || 0;
      clockTranslateX = parseFloat(localStorage.getItem('clockTranslateX')) || 0;
      applyClockTransform();
      loadComponentsPos();
      applyComponentsPos();
      initDragHandlers();
    } catch(e) { console.error("Theme/transform/drag init error:", e); }

    try { updateTimeAndDate(); } catch(e) { console.error("updateTimeAndDate error:", e); }
    setInterval(() => { try { updateTimeAndDate(); } catch(e) {} }, 1000);
    setInterval(() => { try { initGeolocationAndZmanim(); } catch(e) {} }, 10*60000);
    setInterval(() => { try { fetchYUMinyanim(); } catch(e) {} }, 15*60000);

    // Always attempt to fetch data, even if earlier steps fail
    try { initGeolocationAndZmanim(); } catch(e) { console.error("initGeolocationAndZmanim error:", e); }

    const autoFsHandler = () => {
      if (localStorage.autoFullscreen !== 'false' && !document.fullscreenElement && !document.webkitFullscreenElement) {
        toggleFullscreen();
      }
      document.removeEventListener('click', autoFsHandler);
    };
    document.addEventListener('click', autoFsHandler);
  }

  async function toggleFullscreen() {
    const doc = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (doc.requestFullscreen) doc.requestFullscreen();
      else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitFullscreen();
    }
  }

  gearBtn.addEventListener('click', openModalWithCurrentSettings);
  saveBtn.addEventListener('click', saveAndClose);
  document.getElementById('addAlarm').addEventListener('click', window.addAlarm);
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  advBtn.addEventListener('click', () => { advancedDiv.style.display = (advancedDiv.style.display === 'block' ? 'none' : 'block'); advBtn.textContent = (advancedDiv.style.display === 'block' ? '▲ Hide' : '⚡ Advanced'); });
  modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
  document.body.addEventListener('click', e => { if (document.body.classList.contains('alarm-active')) { document.body.classList.remove('alarm-active'); if (activeAlarmTimeout) clearTimeout(activeAlarmTimeout); return; } if (modal.style.display !== 'flex' && !e.target.closest('.panel') && !e.target.closest('#gear')) document.body.classList.toggle('hidden-ui'); });
  [weekdaySizeSelect, showTimeExtrasSelect, zmanColorPresetSelect, weatherColorPresetSelect, showWeatherTimelineSelect, layoutSelect, weatherFmtSelect, fontSelect, weatherIconColorSelect, glowEnabledSelect, autoFullscreenSelect, urgentStyleSelect, dateFmtSelect, zmanDisplayTypeSelect, showNextZmanPrefixSelect, document.getElementById('showYUMinyanim'), showLocationSelect, locationFmtSelect, keepAwakeSelect, showRainEndSelect, showRainGaugeSelect, weatherDetailsBoxSelect, showRainUntilSelect, weatherDetailsHoursSelect].filter(Boolean).forEach(s => s.addEventListener('change', livePreviewAdvanced));
  [zmanCustomColorInput, weatherCustomColorInput, weatherIconCustomColorInput, urgentColor1Input, urgentColor2Input, urgentFlashSpeedInput, document.getElementById('minyanCount'), document.getElementById('urgencyThreshold')].filter(Boolean).forEach(i => i.addEventListener('input', livePreviewAdvanced));
  if (zoomOutBtn) zoomOutBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockScale = Math.max(0.3, clockScale - 0.05);
    localStorage.setItem('clockScale', clockScale);
    applyClockTransform();
  });
  if (zoomInBtn) zoomInBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockScale = Math.min(3.0, clockScale + 0.05);
    localStorage.setItem('clockScale', clockScale);
    applyClockTransform();
  });
  if (resetZoomBtn) resetZoomBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockScale = 1.0;
    localStorage.setItem('clockScale', clockScale);
    applyClockTransform();
  });
  if (moveDownBtn) moveDownBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockTranslateY += 20;
    localStorage.setItem('clockTranslateY', clockTranslateY);
    applyClockTransform();
  });
  if (moveUpBtn) moveUpBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockTranslateY -= 20;
    localStorage.setItem('clockTranslateY', clockTranslateY);
    applyClockTransform();
  });
  if (resetYBtn) resetYBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockTranslateY = 0;
    localStorage.setItem('clockTranslateY', clockTranslateY);
    applyClockTransform();
  });
  if (moveLeftBtn) moveLeftBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockTranslateX -= 20;
    localStorage.setItem('clockTranslateX', clockTranslateX);
    applyClockTransform();
  });
  if (moveRightBtn) moveRightBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockTranslateX += 20;
    localStorage.setItem('clockTranslateX', clockTranslateX);
    applyClockTransform();
  });
  if (resetXBtn) resetXBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockTranslateX = 0;
    localStorage.setItem('clockTranslateX', clockTranslateX);
    applyClockTransform();
  });
  if (resetAllAdjBtn) resetAllAdjBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clockScale = 1.0;
    clockTranslateY = 0;
    clockTranslateX = 0;
    localStorage.setItem('clockScale', clockScale);
    localStorage.setItem('clockTranslateY', clockTranslateY);
    localStorage.setItem('clockTranslateX', clockTranslateX);
    applyClockTransform();
  });
  try { initializeApp(); } catch(e) { console.error("initializeApp crashed:", e); initGeolocationAndZmanim(); }
</script>
