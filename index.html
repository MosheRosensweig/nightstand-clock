<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nightstand Clock V5 | Zmanim Ambient Clock</title>
<style>
  /* ----- GLOBAL RESET & DESIGN SYSTEM (modern base) ----- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }

  :root {
    --fg: #00e5ff;
    --bg: #000000;
    --transition-smooth: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    --card-radius: 28px;
    --btn-radius: 44px;
    --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.5);
    /* dynamic sizes */
    --weekday-scale: 1.2;
    --seconds-scale: 0.5;
    --ampm-scale: 0.25;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', 'SF Mono', 'Fira Code', monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: background 0.25s ease, color 0.2s ease;
    padding: 0;
  }

  /* gear icon */
  #gear {
    position: fixed;
    top: 22px;
    right: 24px;
    font-size: 28px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 60px;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
    transition: var(--transition-smooth);
    z-index: 200;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  }

  #gear:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.03) rotate(8deg);
    border-color: var(--fg);
  }

  .hidden-ui #gear {
    display: none;
  }

  /* main clock container */
  #clock {
    text-align: center;
    width: 100%;
    height: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2vh;
    box-sizing: border-box;
  }

  /* TIME LINE */
  .time-line {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 0.15em;
  }
  .main-hour-minute {
    font-size: 1em;
    font-weight: inherit;
    line-height: 0.8;
    display: block;
  }
  .time-extras {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.35em; 
    text-align: left;
    margin: 0;
    padding: 0;
  }
  .ampm-indicator {
    opacity: 1;
    font-weight: 500;
    line-height: 0.7;
  }
  .seconds-sm {
    opacity: 1;
    font-weight: 400;
    line-height: 0.7;
  }
  .time-extras.hide-extras {
    display: none;
  }

  /* layout styles */
  .weekday {
    font-size: calc(2.2vw * var(--weekday-scale));
    font-weight: 500;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-transform: uppercase;
    transition: font-size 0.1s ease;
  }

  .retro .time-line { font-size: 18vw; }
  .retro .main-hour-minute, .retro .time-extras, .retro .date, .retro .weekday { font-weight: 700; text-shadow: 0 0 8px currentColor; }
  .simple .time-line { font-size: 14vw; }
  .simple .main-hour-minute { font-weight: 400; }
  .minimal .time-line { font-size: 12vw; }
  .minimal .main-hour-minute { font-weight: 300; }
  .split .time-line { font-size: 13vw; }
  .split .main-hour-minute, .split .time-extras, .split .date, .split .weekday {
    font-weight: 500;
    background: linear-gradient(135deg, var(--fg) 30%, #aaffff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: none;
  }
  
  .main-hour-minute { font-size: 1em; }

  .date {
    font-size: 2.8vw;
    margin-top: 18px;
    font-weight: 400;
    opacity: 1;
  }
  .weather {
    margin-top: 24px;
    font-size: 2.2vw;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(8px);
    display: inline-flex;
    align-items: center;
    padding: 10px 28px;
    border-radius: 60px;
    gap: 12px;
    color: var(--weather-fg, var(--fg));
  }
  .weather-stack {
    display: flex;
    flex-direction: column;
    font-size: 0.7em;
    line-height: 1.1;
    text-align: left;
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
  }
  .weather-rain {
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    padding-left: 12px;
    margin-left: 4px;
  }

  .next-zman {
    margin-top: 20px;
    font-size: 2.2vw;
    background: rgba(0, 150, 200, 0.2);
    backdrop-filter: blur(8px);
    display: inline-block;
    padding: 10px 28px;
    border-radius: 60px;
    font-weight: 500;
    letter-spacing: 0.3px;
    border: 1px solid rgba(0, 229, 255, 0.3);
    transition: all 0.2s;
    color: var(--zman-fg, var(--fg));
  }

  /* MODAL */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(12px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    animation: fadeInModal 0.2s ease;
  }

  .panel {
    background: #11141fcc;
    backdrop-filter: blur(24px);
    border-radius: 48px;
    padding: 28px 26px;
    width: 90%;
    max-width: 580px;
    max-height: 85vh;
    overflow-y: auto;
    color: #f0f3ff;
    border: 1px solid rgba(0, 230, 255, 0.3);
    box-shadow: var(--shadow-soft);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-track { background: #1e2335; border-radius: 10px; }
  .panel::-webkit-scrollbar-thumb { background: var(--fg); border-radius: 10px; }

  .panel h2 {
    font-size: 1.8rem;
    font-weight: 500;
    margin-bottom: 20px;
    border-left: 4px solid var(--fg);
    padding-left: 166px;
  }
  .panel h2 { padding-left: 16px; }

  label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #bbd4ff;
  }

  select, input[type="color"] {
    width: 100%;
    padding: 12px 16px;
    background: rgba(20, 25, 40, 0.9);
    border: 1px solid rgba(0, 229, 255, 0.4);
    border-radius: 60px;
    color: white;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: var(--transition-smooth);
  }

  .zmanim-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 12px;
    background: rgba(20, 25, 40, 0.5);
    border-radius: 28px;
    padding: 14px;
  }
  .zman-check {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .zman-check input {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: var(--fg);
  }

  .button-group {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 28px;
    justify-content: space-between;
  }
  button {
    background: rgba(30, 35, 55, 0.9);
    border: 1px solid rgba(0, 229, 255, 0.3);
    padding: 12px 20px;
    border-radius: 60px;
    font-size: 0.9rem;
    font-weight: 500;
    color: #eef5ff;
    cursor: pointer;
    transition: var(--transition-smooth);
    flex: 1;
    text-align: center;
  }
  button:hover {
    background: #1f2a46;
    border-color: var(--fg);
    transform: translateY(-2px);
  }
  #save { background: #00b8d4cc; border-color: #00e5ff; font-weight: 600; }

  #advanced { display: none; animation: fadeSlide 0.2s; }
  .tabs { display: flex; gap: 10px; margin-top: 20px; border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; }
  .tab { padding: 8px 16px; cursor: pointer; border-radius: 12px; transition: var(--transition-smooth); font-size: 0.9rem; font-weight: 500; color: #bbd4ff; }
  .tab.active { background: rgba(0, 229, 255, 0.2); color: var(--fg); border: 1px solid rgba(0, 229, 255, 0.4); }
  .tab-content { display: none; animation: fadeIn 0.2s ease; }
  .tab-content.active { display: block; }

  /* WEATHER TIMELINE BAR */
  .weather-timeline {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    display: none;
    padding: 15px 0;
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    color: var(--weather-fg, var(--fg));
  }
  .weather-timeline::-webkit-scrollbar { display: none; }
  .weather-timeline-inner { display: flex; gap: 20px; padding: 0 20px; width: max-content; }
  .timeline-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.9rem; min-width: 60px; }
  .timeline-time { opacity: 0.6; font-size: 0.75rem; }
  .timeline-temp { font-weight: 600; }
  .timeline-icon { font-size: 1.2rem; }
  .night-moon { filter: grayscale(100%) brightness(1000%); display: inline-block; }

  /* ALARMS */
  .alarm-item { background: rgba(20, 25, 40, 0.5); border-radius: 20px; padding: 16px; margin-top: 12px; border: 1px solid rgba(0, 229, 255, 0.1); }
  .alarm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .alarm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .alarm-input-group { display: flex; flex-direction: column; gap: 4px; }
  .alarm-input-group input { padding: 8px 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 10px; color: white; }
  .remove-alarm { color: #ff3b30; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; font-weight: 600; }

  @keyframes alarmFlash { 0%, 49% { background: #000000; color: #ffffff; } 50%, 100% { background: #ffffff; color: #000000; } }
  .alarm-active { animation: alarmFlash var(--flash-speed, 0.5s) infinite; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 640px) {
    .date { font-size: 6vw; }
    .weather { font-size: 4vw; padding: 1vh 4vw; margin-top: 2vh; }
    .next-zman { font-size: 4vw; padding: 1vh 4vw; margin-top: 2vh; }
    .weekday { font-size: calc(6vw * var(--weekday-scale)); margin-bottom: 2vh; }
    .retro .time-line { font-size: 22vw; }
    .simple .time-line { font-size: 18vw; }
    .minimal .time-line { font-size: 14vw; }
    .split .time-line { font-size: 16vw; }
  }
  @media (max-aspect-ratio: 1/1) {
    #clock { justify-content: center; }
  }
  @media (min-aspect-ratio: 1/1) {
    #clock { justify-content: space-evenly; }
    .weekday { font-size: calc(5vh * var(--weekday-scale)); }
    .date { font-size: 6vh; }
    .weather { font-size: 5vh; }
    .next-zman { font-size: 5vh; }
    .retro .time-line { font-size: 25vh; }
    .simple .time-line { font-size: 20vh; }
    .minimal .time-line { font-size: 16vh; }
    .split .time-line { font-size: 18vh; }
    .weather-timeline { margin-top: 2vh; }
  }
</style>
</head>
<body>

<button id="gear" aria-label="settings">⚙️</button>

<div id="clock" class="retro">
  <div class="weekday" id="weekday"></div>
  <div class="time-line">
    <span class="main-hour-minute" id="mainTime"></span>
    <div class="time-extras">
      <span class="ampm-indicator" id="ampmIndicator"></span>
      <div class="time-spacer"></div>
      <span class="seconds-sm" id="secondsSmall"></span>
    </div>
  </div>
  <div class="date" id="date"></div>
  <div class="weather" id="weather"><span class="night-moon">🌙</span> loading forecast...</div>
  <div class="weather-timeline" id="weatherTimeline">
    <div class="weather-timeline-inner" id="timelineInner"></div>
  </div>
  <div class="next-zman" id="nextZman">🕯️ Next Zman: --</div>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <h2>✨ Ambient Control + Zmanim</h2>
    <label>🖌️ Layout Style</label>
    <select id="layout"><option value="retro">Retro LED</option><option value="simple">Simple & Clean</option><option value="minimal">Minimal pure</option><option value="split">Split Chroma</option></select>
    <label>🎨 Theme Color</label>
    <select id="colorPreset"><option value="#00e5ff">Retro Cyan</option><option value="#00ff66">Coding Green</option><option value="#ff3b30">Red Ember</option><option value="custom">Custom (picker)</option></select>
    <input type="color" id="customColor" value="#00e5ff">
    <label>🌑 Background</label>
    <select id="bgPreset"><option value="#000000">Pure Black</option><option value="#222222">Dark Graphite</option><option value="#001133">Deep Navy</option><option value="custom">Custom Color</option></select>
    <input type="color" id="customBg" value="#000000">

    <button id="advBtn" type="button">⚡ Advanced Display & Zmanim</button>
    <div id="advanced">
      <div class="tabs">
        <div class="tab active" data-tab="tab-zmanim">🕯️ Zmanim</div>
        <div class="tab" data-tab="tab-alarms">⏰ Alarms</div>
        <div class="tab" data-tab="tab-weather">🌤️ Weather</div>
        <div class="tab" data-tab="tab-display">🖥️ Display</div>
      </div>

      <div id="tab-zmanim" class="tab-content active">
        <label>🕯️ Zmanim Selection (Hebrew names)</label>
        <div id="zmanimChecklist" class="zmanim-grid"></div>
        <label>⏳ Zman Display Type</label>
        <select id="zmanDisplayType"><option value="time">At time (10:30 PM)</option><option value="countdown">Countdown (in 2h 15m)</option></select>
        <label>🏷️ Show "Next Zman:" prefix</label>
        <select id="showNextZmanPrefix"><option value="true">Show</option><option value="false">Hide</option></select>
        <label>🎨 Zman Text Color</label>
        <select id="zmanColorPreset"><option value="theme">Same as theme</option><option value="custom">Custom Color</option></select>
        <input type="color" id="zmanCustomColor" value="#00e5ff">
      </div>

      <div id="tab-alarms" class="tab-content">
        <div id="alarmList"></div>
        <button id="addAlarm" style="margin-top: 15px; background: rgba(0, 229, 255, 0.2);">➕ Add Alarm (max 10)</button>
      </div>

      <div id="tab-weather" class="tab-content">
        <label>🌤️ Weather format</label>
        <select id="weatherFmt">
          <option value="words">🌡️ 72°F · Clear sky</option>
          <option value="numbers">🌤️ 72°F</option>
          <option value="extended">📊 Extended (High/Low + Rain)</option>
        </select>
        <label>📈 Weather Timeline Bar</label>
        <select id="showWeatherTimeline"><option value="true">Show (Hourly)</option><option value="false">Hide</option></select>
        <label>🎨 Weather Text Color</label>
        <select id="weatherColorPreset"><option value="theme">Same as theme</option><option value="custom">Custom Color</option></select>
        <input type="color" id="weatherCustomColor" value="#00e5ff">
      </div>

      <div id="tab-display" class="tab-content">
        <label>📆 Weekday Text Size</label>
        <select id="weekdaySize"><option value="0.8">Small (0.8x)</option><option value="1.0">Normal (1x)</option><option value="1.2">Big (1.2x)</option><option value="1.5">Extra Large (1.5x)</option><option value="1.8">Huge (1.8x)</option></select>
        <label>⏲️ Time Extras (Seconds & AM/PM)</label>
        <select id="showTimeExtras"><option value="true">Show unit</option><option value="false">Hide unit</option></select>
        <label>📅 Date format</label>
        <select id="dateFmt"><option value="long">Monday, June 1, 2026</option><option value="medium">Mon, Jun 1</option><option value="numeric">6/1/2026</option></select>
        <label>✍️ Clock font family</label>
        <select id="font"><option value="'Inter', 'SF Mono', monospace">Digital Mono</option><option value="'Segoe UI', 'Inter', sans-serif">Modern Sans</option><option value="'Cormorant Garamond', serif">Classic Serif</option></select>
      </div>
    </div>
    <div class="button-group">
      <button id="fullscreen">🖥️ Fullscreen</button>
      <button id="save">💾 Save & Close</button>
    </div>
  </div>
</div>

<script>
  const ZMANIM_DB = {
    alotHaShachar: { he: "עלות השחר", icon: "🌄", default: true, display: "Alot Hashachar" },
    sunrise: { he: "נץ החמה", icon: "🌅", default: true, display: "Netz" },
    misheyakir: { he: "משיכיר", icon: "👕", default: true, display: "Mi Sheyakir" },
    sofZmanShma: { he: "סוף ק\"ש (גר\"א)", icon: "📜", default: true, display: "Sof Zman Shma GRA" },
    sofZmanTfilla: { he: "סוף תפילה (גר\"א)", icon: "🙏", default: true, display: "Sof Zman Tfila" },
    chatzot: { he: "חצות", icon: "🕛", default: true, display: "Chatzot" },
    minchaGedola: { he: "מנחה גדולה", icon: "☀️", default: true, display: "Mincha Gedola" },
    sunset: { he: "שקיעה", icon: "🌇", default: true, display: "Shkiya" },
    tzeit85deg: { he: "צאת הכוכבים", icon: "🌌", default: true, display: "Tzeit" },
    plagHaMincha: { he: "פלג המנחה", icon: "🌤️", default: false, display: "Plag HaMincha" },
    candleLighting: { he: "הדלקת נרות", icon: "🕯️", default: false, display: "Candle Lighting" },
    sofZmanShmaMGA: { he: "סוף ק\"ש (מג\"א)", icon: "📜", default: false, display: "Sof Zman Shma MGA" }
  };

  let currentZmanimData = {}, enabledZmanKeys = new Set(), alarms = [], activeAlarmTimeout = null, lastFetchedDate = "";

  const weekdayEl = document.getElementById('weekday'), mainTimeSpan = document.getElementById('mainTime'), secondsSmallSpan = document.getElementById('secondsSmall'), ampmSpan = document.getElementById('ampmIndicator'), dateEl = document.getElementById('date'), weatherEl = document.getElementById('weather'), nextZmanEl = document.getElementById('nextZman'), weatherTimeline = document.getElementById('weatherTimeline'), timelineInner = document.getElementById('timelineInner'), clockContainer = document.getElementById('clock'), gearBtn = document.getElementById('gear'), modal = document.getElementById('modal'), layoutSelect = document.getElementById('layout'), colorPreset = document.getElementById('colorPreset'), customColor = document.getElementById('customColor'), bgPreset = document.getElementById('bgPreset'), customBg = document.getElementById('customBg'), weatherFmtSelect = document.getElementById('weatherFmt'), dateFmtSelect = document.getElementById('dateFmt'), fontSelect = document.getElementById('font'), advBtn = document.getElementById('advBtn'), advancedDiv = document.getElementById('advanced'), fullscreenBtn = document.getElementById('fullscreen'), saveBtn = document.getElementById('save'), weekdaySizeSelect = document.getElementById('weekdaySize'), showTimeExtrasSelect = document.getElementById('showTimeExtras'), zmanDisplayTypeSelect = document.getElementById('zmanDisplayType'), showNextZmanPrefixSelect = document.getElementById('showNextZmanPrefix'), zmanColorPresetSelect = document.getElementById('zmanColorPreset'), zmanCustomColorInput = document.getElementById('zmanCustomColor'), showWeatherTimelineSelect = document.getElementById('showWeatherTimeline'), weatherColorPresetSelect = document.getElementById('weatherColorPreset'), weatherCustomColorInput = document.getElementById('weatherCustomColor');

  function getWeatherIcon(code, hour = -1) {
    if (hour === -1) hour = new Date().getHours();
    const isNight = hour >= 19 || hour <= 6;
    if (code >= 95) return "⛈️";
    if (code >= 71 && code <= 77) return "❄️";
    if (code >= 80 && code <= 82) return "🌧️";
    if (code >= 61 && code <= 67) return "🌧️";
    if (code >= 51 && code <= 55) return "🌦️";
    if (code >= 45 && code <= 48) return "🌫️";
    if (code >= 3) return "☁️";
    return isNight ? '<span class="night-moon">🌙</span>' : (code >= 1 ? "🌤️" : "☀️");
  }

  function updateWeatherTimeline(data) {
    if (!data.hourly) return;
    timelineInner.innerHTML = '';
    const now = new Date(), currentHour = now.getHours();
    for (let i = currentHour; i < currentHour + 24; i++) {
      const temp = data.hourly.temperature_2m[i], code = data.hourly.weathercode[i], timeIndex = i % 24;
      const displayTime = timeIndex > 12 ? (timeIndex - 12) + "pm" : (timeIndex === 12 ? "12pm" : (timeIndex === 0 ? "12am" : timeIndex + "am"));
      const item = document.createElement('div');
      item.className = 'timeline-item';
      item.innerHTML = `<span class="timeline-time">${displayTime}</span><span class="timeline-icon">${getWeatherIcon(code, timeIndex)}</span><span class="timeline-temp">${Math.round(temp)}°</span>`;
      timelineInner.appendChild(item);
    }
    weatherTimeline.style.display = (localStorage.showWeatherTimeline === 'true') ? 'block' : 'none';
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    });
  });

  function createAlarmUI() {
    const list = document.getElementById('alarmList'); list.innerHTML = '';
    alarms.forEach((alarm, index) => {
      const item = document.createElement('div'); item.className = 'alarm-item';
      item.innerHTML = `<div class="alarm-header"><strong>Alarm #${index + 1}</strong><span class="remove-alarm" onclick="removeAlarm(${index})">🗑️ Remove</span></div><div class="alarm-grid"><div class="alarm-input-group"><label>Time</label><input type="time" value="${alarm.time}" onchange="updateAlarm(${index}, 'time', this.value)"></div><div class="alarm-input-group"><label>Enabled</label><select onchange="updateAlarm(${index}, 'enabled', this.value === 'true')"><option value="true" ${alarm.enabled ? 'selected' : ''}>ON</option><option value="false" ${!alarm.enabled ? 'selected' : ''}>OFF</option></select></div><div class="alarm-input-group"><label>Flash Speed (sec)</label><input type="number" step="0.1" min="0.1" value="${alarm.flashSpeed}" onchange="updateAlarm(${index}, 'flashSpeed', this.value)"></div><div class="alarm-input-group"><label>Duration (sec)</label><input type="number" min="1" value="${alarm.duration}" onchange="updateAlarm(${index}, 'duration', this.value)"></div></div>`;
      list.appendChild(item);
    });
  }
  window.addAlarm = () => { if (alarms.length < 10) { alarms.push({ time: "08:00", enabled: true, flashSpeed: 0.5, duration: 30 }); createAlarmUI(); } };
  window.removeAlarm = (index) => { alarms.splice(index, 1); createAlarmUI(); };
  window.updateAlarm = (index, field, value) => { alarms[index][field] = value; };

  function triggerAlarm(alarm) {
    if (activeAlarmTimeout) clearTimeout(activeAlarmTimeout);
    document.body.style.setProperty('--flash-speed', `${alarm.flashSpeed}s`);
    document.body.classList.add('alarm-active');
    activeAlarmTimeout = setTimeout(() => { document.body.classList.remove('alarm-active'); activeAlarmTimeout = null; }, alarm.duration * 1000);
  }

  function applyThemeAndStyle() {
    const fg = (localStorage.colorPreset === 'custom') ? (localStorage.customColor || '#00e5ff') : (localStorage.colorPreset || '#00e5ff');
    const bg = (localStorage.bgPreset === 'custom') ? (localStorage.customBg || '#000000') : (localStorage.bgPreset || '#000000');
    document.documentElement.style.setProperty('--fg', fg);
    document.documentElement.style.setProperty('--bg', bg);
    document.documentElement.style.setProperty('--zman-fg', (localStorage.zmanColorPreset === 'custom') ? (localStorage.zmanCustomColor || '#00e5ff') : fg);
    document.documentElement.style.setProperty('--weather-fg', (localStorage.weatherColorPreset === 'custom') ? (localStorage.weatherCustomColor || '#00e5ff') : fg);
    clockContainer.className = localStorage.layout || 'retro';
    document.body.style.fontFamily = localStorage.font || "'Inter', 'SF Mono', monospace";
    document.documentElement.style.setProperty('--weekday-scale', localStorage.weekdaySize || "1.2");
    document.querySelector('.time-extras').classList.toggle('hide-extras', localStorage.showTimeExtras === 'false');
  }

  function updateTimeAndDate() {
    const now = new Date();
    if (now.toDateString() !== lastFetchedDate) { lastFetchedDate = now.toDateString(); initGeolocationAndZmanim(); }
    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    if (now.getSeconds() === 0) alarms.forEach(a => { if (a.enabled && a.time === timeStr) triggerAlarm(a); });

    let h = now.getHours(), m = now.getMinutes(), ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    mainTimeSpan.textContent = `${h}:${m.toString().padStart(2, '0')}`;
    secondsSmallSpan.textContent = now.getSeconds().toString().padStart(2, '0');
    ampmSpan.textContent = ampm;
    weekdayEl.textContent = now.toLocaleDateString([], { weekday: 'long' }).toUpperCase();
    const df = localStorage.dateFmt || 'medium';
    dateEl.textContent = df === 'numeric' ? now.toLocaleDateString() : (df === 'long' ? now.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }));
    updateNextZmanDisplay();
  }

  let lastTemp = null, lastCode = 0, conditionTxt = "Clear", todayH = null, todayL = null, rainInf = "";
  function updateWeatherDisplay() {
    if (lastTemp === null) { weatherEl.textContent = "⛅ waiting..."; return; }
    const fmt = localStorage.weatherFmt || 'extended', icon = getWeatherIcon(lastCode);
    weatherTimeline.style.display = (localStorage.showWeatherTimeline === 'true') ? 'block' : 'none';
    if (fmt === 'numbers') weatherEl.innerHTML = `${icon} ${Math.round(lastTemp)}°F`;
    else if (fmt === 'words') weatherEl.innerHTML = `${icon} ${Math.round(lastTemp)}°F · ${conditionTxt}`;
    else weatherEl.innerHTML = `<span>${icon} ${Math.round(lastTemp)}°F</span> <span>${conditionTxt}</span> <div class="weather-stack"><span>High: ${Math.round(todayH)}°</span><span>Low: ${Math.round(todayL)}°</span></div> <div class="weather-rain">${rainInf}</div>`;
  }

  async function fetchWeather(lat, lon) {
    try {
      const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min&hourly=temperature_2m,weathercode,precipitation&temperature_unit=fahrenheit&timezone=auto`);
      const data = await resp.json();
      if (data.current) {
        lastTemp = data.current.temperature_2m; lastCode = data.current.weathercode;
        if (data.daily) { todayH = data.daily.temperature_2m_max[0]; todayL = data.daily.temperature_2m_min[0]; }
        updateWeatherTimeline(data);
        if (data.hourly) {
          let rs = -1, re = -1, rToday = false;
          for (let i = new Date().getHours(); i < 24; i++) { if (data.hourly.precipitation[i] > 0) { rToday = true; if (rs === -1) rs = i; re = i; } else if (rs !== -1) break; }
          rainInf = rToday ? `🌧️ Rain at ${rs > 12 ? (rs-12)+'pm' : (rs===12?'12pm':(rs===0?'12am':rs+'am'))} (${re-rs+1}h)` : "☀️ No rain today";
        }
        const c = lastCode;
        conditionTxt = c === 0 ? "Clear sky" : (c <= 2 ? "Mainly clear" : (c === 3 ? "Overcast" : (c <= 48 ? "Foggy" : (c <= 55 ? "Drizzle" : (c <= 67 ? "Rain" : (c <= 77 ? "Snow" : (c <= 82 ? "Showers" : "Thunderstorm")))))));
        updateWeatherDisplay();
      }
    } catch(e) { weatherEl.textContent = "🌡️ offline"; }
  }

  async function fetchZmanim(lat, lon, specificDate = null) {
    try {
      const d = specificDate || new Date(), ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const resp = await fetch(`https://www.hebcal.com/zmanim?cfg=json&latitude=${lat}&longitude=${lon}&tzid=${Intl.DateTimeFormat().resolvedOptions().timeZone}&date=${ds}`);
      const data = await resp.json();
      if (data.times) { currentZmanimData = {}; for (const [k, v] of Object.entries(data.times)) if (ZMANIM_DB[k]) currentZmanimData[k] = new Date(v); }
      updateNextZmanDisplay();
    } catch (e) { nextZmanEl.textContent = "⚠️ unavailable"; }
  }

  function updateNextZmanDisplay() {
    if (!Object.keys(currentZmanimData).length) { nextZmanEl.textContent = "📅 Loading..."; return; }
    const now = new Date(); let up = null, upK = null;
    Object.keys(currentZmanimData).sort((a,b)=>currentZmanimData[a]-currentZmanimData[b]).forEach(k => { if (enabledZmanKeys.has(k) && currentZmanimData[k] > now && (!up || currentZmanimData[k] < up)) { up = currentZmanimData[k]; upK = k; } });
    if (upK) {
      const m = ZMANIM_DB[upK], dt = localStorage.zmanDisplayType || 'time', p = (localStorage.showNextZmanPrefix !== 'false') ? "Next Zman: " : "";
      const txt = dt === 'countdown' ? `${p}${m.he} in ${Math.floor((up-now)/3600000)}h ${Math.floor(((up-now)%3600000)/60000)}m` : `${p}${m.he} at ${up.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
      nextZmanEl.innerHTML = `${m.icon} ${txt}`;
    } else {
      nextZmanEl.textContent = "🌙 Fetching tomorrow...";
      const tom = new Date(); tom.setDate(now.getDate()+1);
      if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => fetchZmanim(p.coords.latitude, p.coords.longitude, tom));
    }
  }

  function initGeolocationAndZmanim() {
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => { fetchZmanim(p.coords.latitude, p.coords.longitude); fetchWeather(p.coords.latitude, p.coords.longitude); }, () => { fetchZmanim(40.7128, -74.0060); fetchWeather(40.7128, -74.0060); });
    else { fetchZmanim(40.7128, -74.0060); fetchWeather(40.7128, -74.0060); }
  }

  function buildZmanimChecklist() {
    const c = document.getElementById('zmanimChecklist'); if (!c) return; c.innerHTML = '';
    for (const [k, m] of Object.entries(ZMANIM_DB)) {
      const l = document.createElement('label'); l.className = 'zman-check';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = enabledZmanKeys.has(k);
      cb.addEventListener('change', e => { if (e.target.checked) enabledZmanKeys.add(k); else enabledZmanKeys.delete(k); localStorage.setItem('enabledZmanim', JSON.stringify([...enabledZmanKeys])); updateNextZmanDisplay(); });
      l.appendChild(cb); l.innerHTML += `<span>${m.he} (${m.display})</span>`;
      c.appendChild(l);
    }
  }

  function saveAndClose() {
    localStorage.layout = layoutSelect.value; localStorage.weatherFmt = weatherFmtSelect.value; localStorage.dateFmt = dateFmtSelect.value; localStorage.font = fontSelect.value;
    localStorage.colorPreset = colorPreset.value; localStorage.customColor = customColor.value; localStorage.bgPreset = bgPreset.value; localStorage.customBg = customBg.value;
    localStorage.weekdaySize = weekdaySizeSelect.value; localStorage.showTimeExtras = showTimeExtrasSelect.value; localStorage.zmanDisplayType = zmanDisplayTypeSelect.value;
    localStorage.showNextZmanPrefix = showNextZmanPrefixSelect.value; localStorage.zmanColorPreset = zmanColorPresetSelect.value; localStorage.zmanCustomColor = zmanCustomColorInput.value;
    localStorage.weatherColorPreset = weatherColorPresetSelect.value; localStorage.weatherCustomColor = weatherCustomColorInput.value; localStorage.showWeatherTimeline = showWeatherTimelineSelect.value;
    localStorage.setItem('alarms', JSON.stringify(alarms));
    applyThemeAndStyle(); updateTimeAndDate(); updateWeatherDisplay(); modal.style.display = 'none';
  }

  function openModalWithCurrentSettings() {
    layoutSelect.value = localStorage.layout || 'retro'; weatherFmtSelect.value = localStorage.weatherFmt || 'extended';
    dateFmtSelect.value = localStorage.dateFmt || 'medium'; fontSelect.value = localStorage.font || "'Inter', 'SF Mono', monospace";
    colorPreset.value = localStorage.colorPreset || '#00e5ff'; customColor.value = localStorage.customColor || '#00e5ff';
    bgPreset.value = localStorage.bgPreset || '#000000'; customBg.value = localStorage.customBg || '#000000';
    weekdaySizeSelect.value = localStorage.weekdaySize || '1.2'; showTimeExtrasSelect.value = localStorage.showTimeExtras || 'true';
    zmanDisplayTypeSelect.value = localStorage.zmanDisplayType || 'time'; showNextZmanPrefixSelect.value = localStorage.showNextZmanPrefix || 'true';
    zmanColorPresetSelect.value = localStorage.zmanColorPreset || 'theme'; zmanCustomColorInput.value = localStorage.zmanCustomColor || '#00e5ff';
    weatherColorPresetSelect.value = localStorage.weatherColorPreset || 'theme'; weatherCustomColorInput.value = localStorage.weatherCustomColor || '#00e5ff';
    showWeatherTimelineSelect.value = localStorage.showWeatherTimeline || 'true';
    const s = localStorage.getItem('alarms'); if (s) alarms = JSON.parse(s); createAlarmUI();
    const ez = localStorage.getItem('enabledZmanim'); if (ez) { enabledZmanKeys = new Set(JSON.parse(ez)); } else { enabledZmanKeys = new Set(); for (const [k, m] of Object.entries(ZMANIM_DB)) if (m.default) enabledZmanKeys.add(k); }
    buildZmanimChecklist(); modal.style.display = 'flex';
  }

  function livePreviewAdvanced() {
    if (modal.style.display !== 'flex') return;
    localStorage.weekdaySize = weekdaySizeSelect.value; localStorage.showTimeExtras = showTimeExtrasSelect.value;
    localStorage.zmanColorPreset = zmanColorPresetSelect.value; localStorage.zmanCustomColor = zmanCustomColorInput.value;
    localStorage.weatherColorPreset = weatherColorPresetSelect.value; localStorage.weatherCustomColor = weatherCustomColorInput.value;
    localStorage.showWeatherTimeline = showWeatherTimelineSelect.value; localStorage.layout = layoutSelect.value;
    localStorage.weatherFmt = weatherFmtSelect.value; localStorage.font = fontSelect.value;
    applyThemeAndStyle(); updateNextZmanDisplay(); updateWeatherDisplay();
  }

  function initializeApp() {
    applyThemeAndStyle(); updateTimeAndDate(); setInterval(updateTimeAndDate, 1000);
    setInterval(initGeolocationAndZmanim, 10*60000); initGeolocationAndZmanim();
  }

  async function toggleFullscreen() {
    const doc = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (doc.requestFullscreen) doc.requestFullscreen();
      else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitFullscreen();
    }
  }

  gearBtn.addEventListener('click', openModalWithCurrentSettings);
  saveBtn.addEventListener('click', saveAndClose);
  document.getElementById('addAlarm').addEventListener('click', window.addAlarm);
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  advBtn.addEventListener('click', () => { advancedDiv.style.display = (advancedDiv.style.display === 'block' ? 'none' : 'block'); advBtn.textContent = (advancedDiv.style.display === 'block' ? '▲ Hide' : '⚡ Advanced'); });
  modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
  document.body.addEventListener('click', e => { if (document.body.classList.contains('alarm-active')) { document.body.classList.remove('alarm-active'); if (activeAlarmTimeout) clearTimeout(activeAlarmTimeout); return; } if (modal.style.display !== 'flex' && !e.target.closest('.panel') && !e.target.closest('#gear')) document.body.classList.toggle('hidden-ui'); });
  [weekdaySizeSelect, showTimeExtrasSelect, zmanColorPresetSelect, weatherColorPresetSelect, showWeatherTimelineSelect, layoutSelect, weatherFmtSelect, fontSelect].forEach(s => s.addEventListener('change', livePreviewAdvanced));
  [zmanCustomColorInput, weatherCustomColorInput].forEach(i => i.addEventListener('input', livePreviewAdvanced));
  initializeApp();
</script>
</body>
</html>
